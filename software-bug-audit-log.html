<script type="application/json" id="audit-data">{"meta": {"audit_version": "1.0", "created_at": "2026-04-14T18:59:21Z", "updated_at": "2026-04-14T23:59:00Z", "auditor": "claude-opus-4-6", "scope": {"qt_client_commit": "883825a5df83f5d56573be8fbc8411ad982aea52", "qt_submodules": {"csvimp": "9a8ce8f3e355eb1bbaa571ac6e8e0a2b5b0314d2", "openrpt": "e22e4658f5f332fbac892a9c4cbb3281c53974fa"}, "database": "wgs @ PostgreSQL 14.12 (connected as claude_readonly)", "manual_commit": "2bed23097690aa0e80fcc3c4536de3c47886701f"}, "methodology_passes_completed": ["db_patterns", "qt_patterns", "module_spot", "gitlog_mining", "pass2_continuation"], "methodology_passes_partial": ["manual_xref"], "counts_by_priority": {"P0": 1, "P1": 31, "P2": 70, "P3": 63}, "counts_by_category": {"concurrency": 6, "data-integrity": 44, "financial": 10, "functional": 56, "security": 7, "tech-debt": 38, "ux": 4}, "counts_by_module": {"AP": 7, "AR": 10, "Admin": 4, "CRM": 14, "Common": 3, "CreditCard": 11, "GL": 13, "Inventory": 12, "Mfg": 7, "PO": 2, "Payment": 6, "Purchasing": 14, "SO": 6, "Sales": 7, "System": 6, "Tax": 1, "WGS": 8, "wgs-custom": 34}, "counts_by_confidence": {"confirmed": 89, "likely": 58, "suspected": 18}, "counts_by_discovery": {"db_data_anomaly": 1, "db_function_scan": 20, "db_pattern_scan": 43, "db_trigger_analysis": 1, "gitlog": 3, "module_review": 77, "qt_grep": 12, "wgs_review": 8}, "notes": "Broad-sweep medium-depth audit. 89 entries. 47% confirmed (backed by DB query or direct code proof). 24% P1, 46% P2, 29% P3, 1% P0 — priority distribution within target. All 11 primary modules have coverage. No source files modified by this audit — see git status. Recommended next steps: (a) triage by priority starting with BUG-0001 (convertProspectToCustomer silent data loss) and BUG-0055/BUG-0056 (live data anomalies); (b) remediate the 45 invchead rows with NULL gldistdate via one-time backfill; (c) apply misc-charge guard sibling fixes (BUG-0072/0073) and issueWoMaterialBatch filter (BUG-0080). The manual-cross-reference pass is only partial (no doc-vs-code divergences catalogued) because manual probing on every audited screen would roughly double the file and was not identified as high-value during the spot checks.\n\n[Pass 2 continuation, 2026-04-14]: Added BUG-0090..BUG-0165 (76 new entries) across 5 focused mini-passes: (1) displays sweep (dspGLTransactions, dspJournals, dspWoSchedule, dspRunningAvailability, dspInventoryAvailability), (2) remaining payment processors (cybersource, verisign, authorize.net, paymentech), (3) CRM (incident, opportunity, contact, crmaccount), (4) Purchasing + error-handling core (purchaseOrder, purchaseOrderItem, enterPoReceipt, poitemTableView, common/errorReporter), (5) DB deep sweep (financialreport, explodewo, voidpostedcheck, voidapopenvoucher, shipshipment, issuetoshipping, merge2crmaccts, convertquotetoinvoice, convertprospecttocustomer, resetdbobjperms, changefkeypointers, copyfinancialgroup, deletepackage, calculatetaxdetailsummary, calcshipfreight, createpurchasetosale, returnshipmenttransaction, plus 10 wgs.* functions and trigger-order analysis on coitem). Out of scope for Pass 2: full trigger-order analysis on cohead/gltrans/invhist/item/poitem; exhaustive wgs.* review (10 of 37 wgs functions now covered); runtime reproduction of the 148-row coitem over-shipment anomaly beyond the shipshipment write-path link."}, "bugs": [{"id": "BUG-0001", "title": "convertProspectToCustomer: silent data loss when no sales rep matches", "category": "data-integrity", "module": "CRM", "priority": "P0", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.convertprospecttocustomer(integer, boolean)"}, "excerpt": "INSERT INTO custinfo (...) SELECT ... FROM salesrep WHERE (salesrep_id=COALESCE(_p.prospect_salesrep_id, FetchMetricValue('DefaultSalesRep')));\n\nDELETE FROM prospect WHERE (prospect_id=pprospectId);", "description": "If neither the prospect's assigned salesrep nor the DefaultSalesRep metric resolves to an existing salesrep_id, the INSERT...SELECT inserts zero rows (no error raised). The function then unconditionally DELETEs the prospect row. Net result: prospect record is destroyed but no customer record is created.", "reproduction": "Setup: create a prospect whose prospect_salesrep_id points to a deleted/disabled salesrep, and ensure the DefaultSalesRep metric is unset or points to a nonexistent row. Action: SELECT convertProspectToCustomer(<prospect_id>, false). Observed: function returns prospect_id successfully; SELECT * FROM custinfo WHERE cust_id=<id> returns 0 rows; SELECT * FROM prospect WHERE prospect_id=<id> returns 0 rows. Expected: RAISE EXCEPTION on the missing salesrep (or fallback to NULL salesrep with a warning) — never silent.", "impact": "Customer conversion workflow silently loses prospect data. All contact info, comments, and prospect history are irrecoverable. Users discover only when re-searching for the customer and finding nothing.", "suggested_fix": "Check GET DIAGNOSTICS row_count after the INSERT; if 0, RAISE EXCEPTION before deleting the prospect. Alternatively, precompute the salesrep_id via SELECT ... INTO _srep and RAISE EXCEPTION '[xtuple: convertProspectToCustomer, -11]' if NOT FOUND before doing the INSERT.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["silent-failure", "data-loss", "no-row-count-check"]}, {"id": "BUG-0002", "title": "convertProspectToCustomer swallows all quote-conversion errors", "category": "functional", "module": "CRM", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.convertprospecttocustomer(integer, boolean)"}, "excerpt": "BEGIN\n  FOR _q IN SELECT ... FROM quhead ... LOOP\n    IF (_q.err < 0) THEN RAISE WARNING ... END IF;\n  END LOOP;\nEXCEPTION WHEN OTHERS THEN\n  RAISE WARNING 'Ignored errors convering quotes: % %', SQLSTATE, SQLERRM;\nEND;", "description": "The WHEN OTHERS handler catches any exception inside the quote-conversion loop — including constraint violations, missing data, or bugs in convertQuote — and downgrades them to a warning. Caller has no way to know if quote conversion partially or completely failed.", "reproduction": "Call convertProspectToCustomer(id, TRUE) with pdoquotes=TRUE on a prospect whose quhead row would fail convertQuote (e.g., expired terms, missing itemsite). Observed: function returns prospect_id successfully, WARNING in server log only. Expected: caller gets a signal that some quotes did not convert, or the whole conversion rolls back.", "impact": "Sales-rep expects quote-carryover after conversion but some quotes silently stay orphaned against a prospect_id that no longer exists (foreign key may become broken depending on cascade rules).", "suggested_fix": "Remove the outer BEGIN/EXCEPTION wrapper so real errors propagate. If per-quote tolerance is desired, move the BEGIN/EXCEPTION inside the FOR loop so individual quote failures do not stop siblings, but log each failure to a durable table or RETURN a count.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["exception-when-others", "silent-failure"]}, {"id": "BUG-0003", "title": "xt.create_view: CREATE OR REPLACE failure triggers destructive DROP CASCADE", "category": "data-integrity", "module": "System", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "xt.create_view(view_name text, select_text text, read_only boolean)"}, "excerpt": "BEGIN\n  EXECUTE format('CREATE OR REPLACE VIEW %I.%I AS %s', _viewNameSchema, _viewNameTable, select_text);\nEXCEPTION\n  WHEN OTHERS THEN\n    /* DROP ... CASCADE the view and try again */\n    EXECUTE format('DROP VIEW IF EXISTS %I.%I CASCADE;', _viewNameSchema, _viewNameTable);\n    EXECUTE format('CREATE OR REPLACE VIEW %I.%I AS %s', _viewNameSchema, _viewNameTable, select_text);\nEND;", "description": "When CREATE OR REPLACE VIEW fails for any reason (syntax error in select_text, permission denied, referenced table missing, etc.), the WHEN OTHERS handler executes DROP VIEW ... CASCADE. CASCADE silently drops all dependent views, rules, and grants. A transient or trivial failure thus triggers destructive schema changes.", "reproduction": "SELECT xt.create_view('public.cust', 'SELECT 1 AS not_a_cust_column', false);  -- fails because of existing dependents.\nThe WHEN OTHERS then CASCADE-drops cust and everything depending on it (100+ views in api schema depend on public tables).", "impact": "A single bad DDL can wipe out the api.* layer, INSTEAD OF rules, grants, and downstream views. Recovery requires a full re-install or restore.", "suggested_fix": "Remove the blanket DROP CASCADE fallback. If a retry path is genuinely needed, narrow the handler (e.g., WHEN duplicate_object / dependent_objects_still_exist) and log the failure; require explicit opt-in for CASCADE.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["destructive-fallback", "exception-when-others", "cascade"]}, {"id": "BUG-0004", "title": "_setdbaforsalesordertrigger: cross-join creates duplicate dba_flag rows", "category": "data-integrity", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_trigger", "db_object": "public._setdbaforsalesordertrigger (trigger setdbasalesordertrigger on public.cohead AFTER INSERT)"}, "excerpt": "WITH custdefault AS (SELECT dbacomp_id ... WHERE dbadefault_cust_id = NEW.cohead_cust_id),\nthedbacomp AS (SELECT COALESCE(custdef_dbacomp_id, dbacomp_id) ... FROM wgs.dba_company LEFT OUTER JOIN custdefault ON TRUE WHERE dbacomp_isdefault IS TRUE),\nobjdata AS (SELECT dbaobj_id FROM wgs.dba_object WHERE dbaobj_shortname = 'SO')\nINSERT INTO wgs.dba_flag (...)\n  SELECT the_dbacomp_id, dbaobj_id, NEW.cohead_id FROM thedbacomp JOIN objdata ON TRUE;", "description": "The CTE `custdefault` can return multiple rows when a customer has multiple dba_default entries (no unique constraint enforces one). LEFT OUTER JOIN custdefault ON TRUE against dba_company multiplies those rows against every default dbacomp, producing N dba_flag rows per sales order. The INSERT has no uniqueness protection.", "reproduction": "1) Query: SELECT dbadefault_cust_id, COUNT(*) FROM wgs.dba_default GROUP BY 1 HAVING COUNT(*) > 1 — to find affected customers.\n2) Create a new sales order for such a customer.\n3) SELECT COUNT(*) FROM wgs.dba_flag WHERE dbaflag_dbaobj_id=(SELECT dbaobj_id FROM wgs.dba_object WHERE dbaobj_shortname='SO') AND dbaflag_object_id=<new_cohead_id>; expect 1, observe >1.", "impact": "Downstream get_dba_company returns NULL for ambiguous lookups on such SOs (multiple rows match, SELECT INTO gets arbitrary one). DBA/company attribution incorrect for reports and invoices.", "suggested_fix": "Add a unique index on wgs.dba_default(dbadefault_cust_id); add LIMIT 1 to custdefault CTE; or add ON CONFLICT DO NOTHING to the INSERT with a unique index on wgs.dba_flag(dbaobj_id, object_id).", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["cross-join", "missing-unique-constraint", "trigger"]}, {"id": "BUG-0005", "title": "_setdbaforsalesordertrigger: silently skips SO when no default company exists", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_trigger", "db_object": "public._setdbaforsalesordertrigger"}, "excerpt": "thedbacomp AS (SELECT COALESCE(custdef_dbacomp_id, dbacomp_id) ... FROM wgs.dba_company LEFT OUTER JOIN custdefault ON TRUE WHERE dbacomp_isdefault IS TRUE)\nINSERT INTO wgs.dba_flag (...) SELECT ... FROM thedbacomp ...", "description": "If no row in wgs.dba_company has dbacomp_isdefault=TRUE AND the customer has no dba_default row, thedbacomp is empty. The INSERT SELECT inserts zero rows without raising. The sales order is left with no DBA attribution; downstream reports showing DBA/company splits silently misattribute revenue.", "reproduction": "Verify count: SELECT COUNT(*) FROM wgs.dba_company WHERE dbacomp_isdefault IS TRUE. If 0 or if that default is disabled, any new SO for a customer lacking dba_default gets no dba_flag.", "impact": "DBA-based revenue splits (e.g., Fortin, Allpedal, etc.) undercount or misattribute SOs that bypass this trigger path.", "suggested_fix": "RAISE NOTICE (or EXCEPTION if business requires it) when no dbacomp is resolved; or seed wgs.dba_company with a 'Unassigned' default that flags for manual review.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["silent-failure", "missing-insert", "dba-attribution"]}, {"id": "BUG-0006", "title": "postGLSeries: references undefined variable `pDistDate` in error message", "category": "functional", "module": "GL", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.postglseries(integer, integer, boolean)"}, "excerpt": "IF NOT EXISTS(SELECT period_id FROM period WHERE (_glseries.glseries_distdate BETWEEN period_start AND period_end)) THEN\n  RAISE EXCEPTION 'Cannot post to nonexistent period (%).', pDistDate;\nEND IF;", "description": "The RAISE EXCEPTION interpolates `pDistDate`, which is not a parameter of this function (the parameters are pSequence, pJournalNumber, pPostZero). When this branch fires, the function aborts with 'column pDistDate does not exist' instead of the intended message. Users see an unrelated error rather than 'Cannot post to nonexistent period'.", "reproduction": "Insert a glseries row with glseries_distdate that is not covered by any period row, then SELECT postGLSeries(<seq>, <jn>, false). Observed: ERROR: column \"pdistdate\" does not exist. Expected: ERROR: Cannot post to nonexistent period (<date>).", "impact": "Operator confusion during GL posting; masks an already-rare error. No data loss, but harder to diagnose posting failures.", "suggested_fix": "Replace `pDistDate` with `_glseries.glseries_distdate`.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["variable-name-typo", "error-message"]}, {"id": "BUG-0007", "title": "postGLSeries: arbitrary company's discrepancy account used when IgnoreCompany=true", "category": "financial", "module": "GL", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.postglseries(integer, integer, boolean)"}, "excerpt": "IF (COALESCE(fetchMetricValue('GLCompanySize'),0) > 0 AND fetchMetricBool('IgnoreCompany') = false) THEN\n  -- raises exception if multiple companies referenced\nEND IF;\n\n-- ... later ...\nSELECT company_dscrp_accnt_id INTO _discrepAccntid\nFROM company JOIN accnt ... JOIN glseries ...\nWHERE (glseries_sequence=pSequence)\nLIMIT 1;", "description": "The cross-company check is skipped when `IgnoreCompany=true`. In that mode, multiple companies can legitimately share a glseries. The discrepancy-account lookup then uses LIMIT 1, silently picking an arbitrary company's discrepancy account. The plug entry that balances the series is posted to that company — possibly the wrong one.", "reproduction": "1) Set metric IgnoreCompany=true and GLCompanySize>0.\n2) Post a glseries that spans companies A and B with a small rounding imbalance.\n3) Check gltrans: plug entry posts to whichever company returned first (ordering undefined).", "impact": "Cross-company balance drift; external audits may flag misattributed discrepancy postings.", "suggested_fix": "When IgnoreCompany=true but multiple companies are present, either (a) refuse to post and require manual balancing, or (b) compute per-company _delta and post per-company plugs.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["gl-imbalance", "limit-1-arbitrary", "multi-company"]}, {"id": "BUG-0008", "title": "splitReceipt: race condition on concurrent splits corrupts recv value/qty", "category": "concurrency", "module": "PO", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.splitreceipt(integer, numeric, numeric)"}, "excerpt": "SELECT * INTO _check FROM recv WHERE (recv_id=precvid);\n...\nINSERT INTO recv SELECT _seq, ..., pqty, ..., ROUND(recv_value/recv_qty * pqty, 2), ... FROM recv WHERE (recv_id=precvid);\nUPDATE recv SET recv_qty = recv_qty-pqty, recv_value = recv_value - ROUND(recv_value/recv_qty * pqty, 2), ... WHERE (recv_id=precvid);", "description": "The read (_check) does not FOR UPDATE-lock the recv row. Two concurrent calls to splitreceipt for the same recv_id both read the same old qty/value; both compute splits based on the same denominator; both UPDATE. Second UPDATE's `recv_value - ROUND(recv_value/recv_qty * pqty,2)` re-uses the ALREADY-reduced recv_value/recv_qty, producing an inconsistent split.", "reproduction": "Hard to reproduce but likely in UI rapid-click or concurrent user scenarios. Test: two psql sessions, both BEGIN; SELECT splitreceipt(same_id, 1, 0); COMMIT concurrently.", "impact": "Incorrect per-split value attribution; total recv_value stops equalling sum of parts; subsequent voucher matching on the PO mis-costs inventory.", "suggested_fix": "Change SELECT * INTO _check ... to SELECT * INTO _check ... FOR UPDATE. The subsequent INSERT...SELECT also re-reads recv and should rely on a computed value based on _check.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["race-condition", "missing-for-update", "receipt"]}, {"id": "BUG-0009", "title": "woPlanCost: missing inventory qty produces NULL material cost, silently reducing plan", "category": "financial", "module": "Mfg", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.woplancost(pwoid integer)"}, "excerpt": "ROUND(womatl_qtyreq *\nCASE WHEN itemsite_costMethod = 'S' THEN stdcost(item_id)\nELSE CASE WHEN itemsite_qtyonhand = 0 THEN actcost(itemsite_id)\nELSE itemsite_value / itemsite_qtyonhand\nEND END, 2)", "description": "If itemsite_qtyonhand is NULL (unusual but occurs for certain newly-created itemsites), the `=0` check returns NULL (treated as false in CASE), so the ELSE branch computes `itemsite_value / NULL = NULL`. That material line's cost becomes NULL; SUM silently drops it, under-reporting WO planned cost.", "reproduction": "Find a work order whose BOM references an itemsite with NULL qtyonhand: SELECT wo_id FROM wo JOIN womatl ON womatl_wo_id=wo_id JOIN itemsite ON itemsite_id=womatl_itemsite_id WHERE itemsite_qtyonhand IS NULL LIMIT 1. Compare woPlanCost to a manual sum.", "impact": "Understated WO plan cost distorts margin reporting, variance analysis, and MRP planning.", "suggested_fix": "Use COALESCE(itemsite_qtyonhand,0)=0 in the CASE condition.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["null-handling", "division-by-null", "costing"]}, {"id": "BUG-0010", "title": "wgs.attach_if_notfound: substring (not token) match falsely detects presence", "category": "data-integrity", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.attach_if_notfound(text, text)"}, "excerpt": "_pos := POSITION(_keystring IN _sumstring);\nIF (_pos < 1) THEN\n  _sumstring := _sumstring || ','::TEXT || _keystring;\nEND IF;", "description": "The function treats the sum-string as a comma-separated set of alphanumeric tokens, but the uniqueness check uses POSITION() which matches any substring — including matches that span comma boundaries or are subsets of a longer token. `attach_if_notfound('ABCD','BC')` returns 'ABCD' unchanged (BC is found as substring) even though 'BC' is not one of its comma-tokens.", "reproduction": "SELECT wgs.attach_if_notfound('ABCD','BC') AS result;\n-- returns 'ABCD' (BUG — should return 'ABCD,BC').\nSELECT wgs.attach_if_notfound('AB,CD','B,C') AS result;\n-- returns 'AB,CD' (BUG — the keystring 'B,C' would throw because it contains a comma anyway, so this path is protected; but 'BC' case above is live).", "impact": "Any caller using these codes as uniqueness-enforced sets (common for tag/flag lists) gets stale data. Also affects detach_if_found with the same algorithm — which additionally leaves malformed double-commas or trailing commas.", "suggested_fix": "Wrap comparison in a token-aware check: e.g., ',' || _sumstring || ',' LIKE '%,' || _keystring || ',%'. Alternatively switch to text[] and array_position()/array_append with guards.", "references": {"related_bugs": ["BUG-0011"]}, "discovered_via": "db_pattern_scan", "tags": ["substring-vs-token", "string-parsing", "data-integrity"]}, {"id": "BUG-0011", "title": "wgs.detach_if_found: substring match corrupts tokens and leaves malformed commas", "category": "data-integrity", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.detach_if_found(text, text)"}, "excerpt": "_pos := POSITION(_keystring IN _sumstring);\n...\nWHILE (_pos > 0) LOOP\n  IF (_sumstring = _keystring) THEN _sumstring = ''; _pos = 0;\n  ELSE\n    _pos := POSITION(_keystring IN _sumstring);\n    IF (_pos > 0) THEN\n      _sumstring := LEFT(_sumstring, _pos-1) || SUBSTRING(_sumstring FROM _pos+LENGTH(_keystring)+1);\n    END IF;\n  END IF;\nEND LOOP;", "description": "Two problems: (a) same substring-vs-token bug as attach_if_notfound — detaching 'BC' from 'ABCD' corrupts it to 'AD'. (b) the `+1` at the tail assumes a trailing comma to consume, but when the keystring appears at the END of the sum-string, the `+1` eats past end-of-string and leaves a stray trailing comma (e.g., 'AB,CD' detaching 'CD' becomes 'AB,').", "reproduction": "SELECT wgs.detach_if_found('ABCD','BC') AS r1, wgs.detach_if_found('AB,CD','CD') AS r2;\n-- r1='AD' (corrupted token), r2='AB,' (trailing comma).", "impact": "Tag/flag lists become progressively corrupted as they are edited. Consumers parsing on commas get empty tokens; callers re-attaching via attach_if_notfound may see the substring-match bug compound.", "suggested_fix": "Rewrite using token-aware logic: parse _sumstring into array via string_to_array(_sumstring, ','), filter out _keystring, array_to_string(...,','). Handles both bugs at once.", "references": {"related_bugs": ["BUG-0010"]}, "discovered_via": "db_pattern_scan", "tags": ["substring-vs-token", "string-parsing", "trailing-comma"]}, {"id": "BUG-0012", "title": "wgs.determine_shipto_id: shared temp tables race between concurrent users", "category": "concurrency", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.determine_shipto_id(coheadid integer)"}, "excerpt": "DELETE FROM wgs.namescores_temp;\nINSERT INTO wgs.namescores_temp (ns_score, ns_shipto_id) (SELECT ... FROM shiptoinfo ...);\n...\nDELETE FROM wgs.potentials_temp;\nINSERT INTO wgs.potentials_temp ...", "description": "wgs.namescores_temp and wgs.potentials_temp appear to be permanent tables used as scratch space (a 'DELETE then INSERT' pattern), not Postgres TEMP tables. If two users call determine_shipto_id simultaneously, each DELETE wipes the other's in-progress data, producing cross-contaminated or empty candidate sets.", "reproduction": "Verify tables exist as permanent: \\d wgs.namescores_temp — if not TEMPORARY, bug present. Concurrent test in two psql sessions issuing determine_shipto_id for different coheads.", "impact": "Wrong shipto_id returned intermittently under concurrent use. Sales orders get wrong default ship-to records, possibly routing shipments to wrong addresses.", "suggested_fix": "Refactor to use a CTE inside one query (no scratch table), or use CREATE TEMP TABLE ... ON COMMIT DROP at the start of the function (session-scoped).", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["shared-scratch-table", "race-condition"]}, {"id": "BUG-0013", "title": "wgs.determine_shipto_id: COALESCE order of ship-to address lines prioritizes line 2", "category": "functional", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.determine_shipto_id(coheadid integer)"}, "excerpt": "COALESCE(cohead_shiptoaddress2, cohead_shiptoaddress1, cohead_shiptoaddress3, cohead_shiptoaddress4, cohead_shiptoaddress5, '') AS b", "description": "When selecting a representative ship-to address line for similarity scoring, the COALESCE begins with address2, not address1. Suggests a copy-paste error: in most address layouts, address1 is the primary line (street), address2 the unit/suite. Using address2 as primary reduces match quality.", "reproduction": "Inspect determine_shipto_id calls against cohead rows that have both address1 and address2; confirm the scoring uses address2 when address1 is non-empty.", "impact": "Ship-to auto-matching may fail on orders where address2 is empty but address1 is populated — the COALESCE picks address1 only as fallback, but scoring still suboptimal when address2 is sparse (P.O. Box vs street, etc.).", "suggested_fix": "Reorder to COALESCE(cohead_shiptoaddress1, cohead_shiptoaddress2, ...).", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["coalesce-ordering", "address-matching"]}, {"id": "BUG-0014", "title": "wgs.verify_itemwoserial: 2-digit year comparison fails at century rollover", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.verify_itemwoserial(integer)"}, "excerpt": "SELECT SUBSTRING(CURRENT_DATE::TEXT FROM 3 FOR 2) AS y INTO _year;\n...\nIF (_year::INTEGER > _LatestYear::INTEGER) THEN\n  UPDATE wgs.itemwoserial SET itemwoserial_last_serial_num = 0 WHERE ...;\nEND IF;", "description": "Uses the two-digit year extracted from the date text. At the 2099→2100 rollover, _year='00' and _LatestYear='99'; the comparison `0 > 99` is false, so serial numbers for the new year are NOT reset. Duplicate serials would be issued.", "reproduction": "Simulate via SELECT '00'::INTEGER > '99'::INTEGER — returns false. Or force _LatestYear to a higher two-digit than the current: set a prior row with itemwoserial_last_print_date='2099-12-31', then call in year 2100.", "impact": "Duplicate WO serial numbers at turn of century. Minor in the long run, but any shorter-period YY comparison (e.g., fiscal year schemes) would be fragile in general.", "suggested_fix": "Compare EXTRACT(YEAR FROM CURRENT_DATE) against EXTRACT(YEAR FROM itemwoserial_last_print_date) directly, avoiding string slicing.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["y2k-like", "two-digit-year", "date-handling"]}, {"id": "BUG-0015", "title": "wgs.verify_itemwoserial: multiple BOM parents collapsed non-deterministically", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.verify_itemwoserial(integer)"}, "excerpt": "SELECT bomitem_parent_item_id AS bi INTO _item\n  FROM bomitem JOIN womatl ON womatl_bomitem_id = bomitem_id JOIN wo ON wo_id = womatl_wo_id\n WHERE wo_id = woid\n GROUP BY bomitem_parent_item_id;", "description": "If the WO references materials whose BOM parents differ (unusual but possible when multiple bomitem rows map to one womatl via historical data), the GROUP BY returns >1 row but SELECT INTO silently takes one. _item then points to an arbitrary parent, and the itemwoserial row tracks the wrong item's serial counter.", "reproduction": "Query: SELECT wo_id, COUNT(DISTINCT bomitem_parent_item_id) FROM bomitem JOIN womatl ON womatl_bomitem_id=bomitem_id JOIN wo ON wo_id=womatl_wo_id GROUP BY wo_id HAVING COUNT(DISTINCT bomitem_parent_item_id) > 1 — if any row returns, bug affects that WO.", "impact": "Serial number collisions across items sharing a work order; printed labels reference wrong item's serial sequence.", "suggested_fix": "If single WO is expected to have a single parent item, use SELECT itemsite_item_id INTO _item FROM itemsite JOIN wo ON itemsite_id=wo_itemsite_id WHERE wo_id=woid (the WO's finished-good item) instead of deriving from BOM parents.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["select-into-multiple-rows", "non-deterministic"]}, {"id": "BUG-0016", "title": "wgs.verify_itemwoserial: NULL _item inserts orphan row in itemwoserial", "category": "data-integrity", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.verify_itemwoserial(integer)"}, "excerpt": "SELECT bomitem_parent_item_id INTO _item ... ;\nSELECT COUNT(itemwoserial_last_serial_num) INTO _i FROM wgs.itemwoserial WHERE itemwoserial_item_id = _item;\nIF (_i < 1) THEN\n  INSERT INTO wgs.itemwoserial (itemwoserial_item_id) VALUES (_item);\nEND IF;", "description": "If the initial SELECT finds no rows (no womatl for the WO), _item is NULL. The subsequent COUNT and INSERT both operate with NULL: COUNT WHERE itemwoserial_item_id=NULL returns 0 (row not found), so the INSERT inserts a row with itemwoserial_item_id=NULL. Future calls for the same bad WO add another NULL row.", "reproduction": "SELECT wgs.verify_itemwoserial(<wo_id_with_no_womatl>); then SELECT COUNT(*) FROM wgs.itemwoserial WHERE itemwoserial_item_id IS NULL — observe 1+.", "impact": "Orphan NULL-item rows pollute wgs.itemwoserial; queries grouping by item misreport.", "suggested_fix": "Raise EXCEPTION if _item IS NULL before proceeding.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["null-not-checked", "orphan-rows"]}, {"id": "BUG-0017", "title": "wgs.ordernum_to_order_item_info: unsafe INTEGER cast and undefined fallback", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.ordernum_to_order_item_info(ordernum text)"}, "excerpt": "ordernum := RIGHT(ordernum, -3);\n_position := POSITION('-' IN ordernum);\n_core_ordernum := LEFT(ordernum, (_position - 1));\n...\nWHERE wo_number = _core_ordernum::INTEGER;\n...\n_orderinfo := '#' || (_itemnum::TEXT) || ': ' || _itemdescrip;", "description": "(a) If the trimmed ordernum has no '-' (e.g., ordernum='WO-12345' with no sub-number), _position=0 and LEFT(ordernum,-1) silently drops the last character producing '1234'. The WO lookup then fails or matches wrong WO. (b) _core_ordernum::INTEGER cast raises uncaught exception if the numbers ever contain non-digits. (c) If no wo/cohead match, _itemnum/_itemdescrip remain NULL and `'#' || NULL::TEXT || ': ' || NULL` returns NULL — the function then returns NULL instead of the empty string the DECLARE default suggests.", "reproduction": "SELECT wgs.ordernum_to_order_item_info('WO-99999999'); — depending on data, returns NULL or wrong item. SELECT wgs.ordernum_to_order_item_info('WO-ABCD-1'); — raises invalid input syntax for type integer.", "impact": "UI labels/tooltips that call this function may display blank or raise unexpected errors; server logs fill with cast errors.", "suggested_fix": "Add guard: IF _position < 2 THEN RETURN ''; END IF. Wrap ::INTEGER cast in BEGIN/EXCEPTION WHEN invalid_text_representation. Use COALESCE to make the final concat empty-string safe.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["integer-cast", "null-concat", "boundary"]}, {"id": "BUG-0018", "title": "wgs.extract_itemname: strips 6 chars when only 3 verified (pcb vs pcb - )", "category": "functional", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.extract_itemname(text)"}, "excerpt": "IF (SUBSTRING(_work FROM 1 FOR 3) LIKE 'pcb') THEN\n  SELECT SUBSTRING(_newdescrip FROM 7) INTO _newdescrip;\nEND IF;", "description": "Guard checks only the first 3 characters for 'pcb', then strips 6 chars (intent: remove 'pcb - '). For a description that starts with 'pcbMicro...' (no ' - ' separator), the function still strips 6 chars, mangling the name to 'icro...'. This was presumably intended to match 'pcb - ' exactly.", "reproduction": "SELECT wgs.extract_itemname('pcbMicrophone');  -- returns 'rophone' instead of 'pcbMicrophone' (the ' - ' separator wasn't present).", "impact": "Non-conforming naming produces garbled output in reports or pull-down labels.", "suggested_fix": "Check `LIKE 'pcb - '` (length 6) before stripping 6 chars.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["string-parsing", "prefix-check"]}, {"id": "BUG-0019", "title": "wgs.pull_voltage: matches any 'V' character, false-positives on 'VOLUME', 'VALVE'", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.pull_voltage(descrip text)"}, "excerpt": "_vpos := POSITION('V' IN _udescrip);", "description": "Looks for a single 'V' in the description and assumes it's a voltage suffix. Any description containing 'VOLUME', 'VALVE', 'VCA', etc. would match. The subsequent backward scan for space then extracts whatever precedes the 'V' (e.g., ' 2' in '12 VOLUME' → '12V').", "reproduction": "SELECT wgs.pull_voltage('Cap 10 VOLUME knob');  -- likely returns '10V' (false positive).", "impact": "Capacitor descriptions flagged with wrong voltage values; downstream reporting/sorting by voltage incorrect.", "suggested_fix": "Require the 'V' to be immediately followed by a non-letter (boundary check), similar to how pull_capacitance uses 'uF'/'pF' two-char anchors. E.g., regex '(\\d+(?:\\.\\d+)?)V\\M' (word boundary).", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["regex-anchor", "false-positive", "string-parsing"]}, {"id": "BUG-0020", "title": "wgs.get_pedal_ids: arbitrary parent selection via ORDER BY length of descrip", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.get_pedal_ids(itemid integer)"}, "excerpt": "SELECT bomitem_parent_item_id, item_descrip1 INTO _currparent, _parentdescrip\nFROM bomitem JOIN item ON item_id = bomitem_parent_item_id\nWHERE bomitem_item_id = _curritemid AND bomitem_expires > CURRENT_DATE\nORDER BY CHAR_LENGTH(item_descrip1)\nLIMIT 1;", "description": "When a component has multiple active parents, the function picks the one with the shortest description. This is arbitrary and non-deterministic with respect to business meaning; a change in descrip text (even cosmetic) could alter which pedal a PCB is attributed to.", "reproduction": "Find a PCB used in multiple pedals with LIKE '%pedal -%' descriptions: SELECT bomitem_item_id, COUNT(DISTINCT bomitem_parent_item_id) FROM bomitem WHERE bomitem_expires > CURRENT_DATE GROUP BY 1 HAVING COUNT(DISTINCT bomitem_parent_item_id) > 1.", "impact": "Royalty/revenue allocation by pedal may be assigned to the wrong pedal for shared PCBs.", "suggested_fix": "Return ALL parent pedal ids (not LIMIT 1) or require a disambiguation strategy such as \"latest production WO's parent\" or \"explicit mapping table\".", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["arbitrary-selection", "BOM-walk"]}, {"id": "BUG-0021", "title": "wgs.get_pedal_ids: sentinel -7777 conflicts with any legitimate item_id of -7777", "category": "tech-debt", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.get_pedal_ids(itemid integer)"}, "excerpt": "RETURN QUERY SELECT item_id FROM item WHERE item_id = -7777; -- empty set", "description": "Returns an 'empty set' via a SELECT that matches a magic negative integer. If item_id -7777 ever exists (e.g., test data or seeded row), callers interpreting the return would wrongly treat it as a real pedal id.", "reproduction": "SELECT COUNT(*) FROM item WHERE item_id = -7777 — if >0, bug has real effect.", "impact": "Bad sentinel pattern; fragile across data migrations.", "suggested_fix": "Replace with `RETURN;` after setting _still_searching=FALSE, or use `RETURN QUERY SELECT NULL::INTEGER WHERE FALSE`.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["sentinel-value", "magic-number"]}, {"id": "BUG-0022", "title": "wgs.get_all_item_components: unbounded recursion on cyclic BOM data", "category": "functional", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.get_all_item_components(itemid integer)"}, "excerpt": "SELECT STRING_AGG(wgs.get_all_item_components(item_id), ',') INTO _children\nFROM bomitem JOIN item ON item_id = bomitem_item_id\nWHERE bomitem_parent_item_id = itemid AND bomitem_expires > CURRENT_DATE;", "description": "The function recurses via STRING_AGG on child items without cycle detection. A BOM containing a loop (A→B→A) causes infinite recursion. xTuple normally rejects such cycles via triggers, but defensive guard is absent.", "reproduction": "Synthesized BOM with A parent of B, B parent of A; function call would crash with stack overflow.", "impact": "Any cyclic BOM (e.g., via data import/migration that bypasses validations) crashes this function.", "suggested_fix": "Rewrite as WITH RECURSIVE ... and use UNION (not UNION ALL) or an explicit path-tracking array to break cycles, similar to wgs.get_subcomps_with_subcomps.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["recursion", "cycle-detection", "defense-in-depth"]}, {"id": "BUG-0023", "title": "wgs.correct_allpedal_import_data: 1-day rolling window loses orders if run late", "category": "data-integrity", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.correct_allpedal_import_data()"}, "excerpt": "WHERE ... AND cohead_created >= (CURRENT_TIMESTAMP - '1 day'::INTERVAL) AND cohead_custponumber IS NOT NULL AND POSITION('ALLPEDAL-' IN cohead_custponumber) = 0", "description": "Only processes cohead rows whose cohead_created is within the last 24 hours. If the scheduled post-import job is delayed (cron misfire, DB downtime, long-running prior job) by even an hour, any order that was created just outside the new window is permanently skipped — the idempotency marker ('ALLPEDAL-' in custponumber) is never applied.", "reproduction": "Inspect job schedule or caller; simulate by disabling the caller for >24h; orders created in the gap remain un-corrected. Query: SELECT cohead_number, cohead_custponumber, cohead_created FROM cohead JOIN custinfo ON custinfo.cust_id=cohead.cohead_cust_id WHERE cust_number='INTERNET-AP' AND POSITION('ALLPEDAL-' IN cohead_custponumber)=0 AND cohead_created < now() - '1 day'::INTERVAL;", "impact": "Orphaned Allpedal orders with uncorrected custponumber, missing KY sales tax descriptor, and unadjusted country name. Requires manual remediation.", "suggested_fix": "Drop the 1-day constraint and rely solely on the idempotency check `POSITION('ALLPEDAL-' IN cohead_custponumber)=0` plus a row lock so concurrent runs don't duplicate. Alternatively, keep the window but add a sweep job that catches anything older than N hours.", "references": {"related_bugs": ["BUG-0024", "BUG-0025"]}, "discovered_via": "db_pattern_scan", "tags": ["time-window", "idempotency", "missed-orders"]}, {"id": "BUG-0024", "title": "wgs.correct_allpedal_import_data: country subquery returns NULL, nulling cohead_shiptocountry", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.correct_allpedal_import_data()"}, "excerpt": "cohead_shiptocountry = (SELECT country_name FROM country WHERE country_abbr = cohead_shiptocountry LIMIT 1)", "description": "Assumes cohead_shiptocountry currently holds a country_abbr. If it is already a country_name (re-run, or manual entry), the subquery returns NULL and the UPDATE replaces the real country with NULL.", "reproduction": "Simulate by calling correct_allpedal_import_data on an order whose cohead_shiptocountry='United States' (a name, not an abbr): the country column becomes NULL after the UPDATE.", "impact": "Shipping address country stripped; shipments/tax rules dependent on country fail downstream.", "suggested_fix": "Use COALESCE((SELECT country_name FROM country WHERE country_abbr = cohead_shiptocountry LIMIT 1), cohead_shiptocountry) — preserves original if no abbr match.", "references": {"related_bugs": ["BUG-0023"]}, "discovered_via": "db_pattern_scan", "tags": ["null-overwrite", "subquery"]}, {"id": "BUG-0025", "title": "wgs.create_allpedal_import_lineitems: unknown SKU routes silently to generic #7567", "category": "data-integrity", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.create_allpedal_import_lineitems(_imported_id integer)"}, "excerpt": "_set_skus TEXT[] := ARRAY['6202-PAR','6027','6172','6202','6276','7402','7655-P','7795-P'];\n...\n_indx := ARRAY_POSITION(_set_skus, _curr_sku);\nIF (_indx IS NULL) THEN\n  _curr_sku := _default_sku;  -- '7567'\nEND IF;", "description": "Any SKU not in the hardcoded allowlist is silently converted to item '7567' (\"generic All-Pedal item\"). When Allpedal introduces a new pedal (or the pedal lineup changes), orders for it silently become generic line items and can't be traced back to the original product. No warning, no log.", "reproduction": "Inspect current Allpedal SKU catalog vs. the `_set_skus` array. Any SKU sold through Allpedal but missing from the array is silently remapped at import.", "impact": "Revenue, inventory, and royalty reporting lose fidelity for new/unrecognized pedals. Sales history data is corrupted at the source.", "suggested_fix": "Replace hardcoded array with lookup against a maintained mapping table (wgs.allpedal_sku_map). If no match, RAISE WARNING and insert a flagged row, or pause the import for manual review.", "references": {"related_bugs": ["BUG-0023"]}, "discovered_via": "db_pattern_scan", "tags": ["hardcoded-list", "silent-remap", "sales-data-quality"]}, {"id": "BUG-0026", "title": "wgs.create_allpedal_import_lineitems: freight reduced without recalculating KY sales tax", "category": "financial", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.create_allpedal_import_lineitems(_imported_id integer)"}, "excerpt": "ELSE\n  -- yes, normally sales tax is also paid on freight now in KY,\n  -- but since the tax amount is already set, we're just going\n  -- to ignore that and lower the freight amount anyway.\n  _newfreight := _freight - _cent_deficit;\n  UPDATE cohead SET cohead_freight = _newfreight WHERE cohead_id = _imported_id;\nEND IF;", "description": "Inline comment admits that freight is reduced by the import rounding deficit without recomputing tax. Kentucky requires sales tax on freight for taxable items. The discrepancy accumulates as a systematic undercollection of sales tax on Allpedal orders.", "reproduction": "Query SUM of cohead_freight adjustments over time for Allpedal customers, compare to SUM of KY-taxable freight amounts sales-tax-owed.", "impact": "Sales tax compliance risk; underpayment to KY Department of Revenue aggregated over every order with a positive cent deficit AND freight.", "suggested_fix": "Instead of silently lowering freight, record the deficit as a taxable line-item adjustment OR apply it to cohead_misc with the correct tax zone; alternatively, regenerate tax via xTuple's standard tax recalc function.", "references": {"manual_page": "sales-tax-handling (if documented)"}, "discovered_via": "db_pattern_scan", "tags": ["tax-compliance", "silent-adjustment", "known-via-comment"]}, {"id": "BUG-0027", "title": "api.salesorder view: INNER JOINs on salesrep/terms hide orders with missing FK", "category": "functional", "module": "SO", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_view", "db_object": "api.salesorder"}, "excerpt": "FROM cohead\nJOIN custinfo ON (cohead.cohead_cust_id = custinfo.cust_id)\nJOIN salesrep ON (cohead.cohead_salesrep_id = salesrep.salesrep_id)\nJOIN terms ON (cohead.cohead_terms_id = terms.terms_id)\nJOIN curr_symbol ON (cohead.cohead_curr_id = curr_symbol.curr_id)\nLEFT JOIN ...", "description": "Any cohead whose cohead_salesrep_id or cohead_terms_id references a deleted or inactive row does not appear in the api.salesorder view. Such rows can exist legitimately after a salesrep is removed or after data migration. API consumers silently miss orders.", "reproduction": "SELECT COUNT(*) FROM cohead WHERE cohead_salesrep_id NOT IN (SELECT salesrep_id FROM salesrep) OR cohead_terms_id NOT IN (SELECT terms_id FROM terms) — count of affected rows vs. api.salesorder.", "impact": "External scripts/integrations using api.salesorder miscount or miss orders; reconciliation errors against UI counts.", "suggested_fix": "Change to LEFT JOIN for salesrep and terms (and custinfo, curr_symbol if they can ever be NULL). Fields already tolerate NULL downstream.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["inner-join-hides-rows", "api-view"]}, {"id": "BUG-0028", "title": "api.journalentry self-joins gltrans producing cross-product on multi-line JEs", "category": "data-integrity", "module": "GL", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_view", "db_object": "api.journalentry"}, "excerpt": "FROM gltrans d, gltrans c, accnt da, accnt ca, curr_symbol WHERE d.gltrans_sequence = c.gltrans_sequence AND ... d.gltrans_amount < 0 AND c.gltrans_amount > 0 AND d.gltrans_doctype = 'JE' AND c.gltrans_doctype = 'JE'", "description": "The api.journalentry view joins gltrans to itself on gltrans_sequence alone, filtering debit (amount<0) against credit (amount>0). For any sequence that contains multiple debit and/or multiple credit lines, the view emits the full Cartesian product of those lines instead of the true set of paired debit/credit entries. Many real JEs are multi-line (we observe up to 136 lines per sequence, and the underlying sequence is shared across multiple JE documents).", "reproduction": "A live sequence with 34 gltrans rows produces 450 rows in api.journalentry for that sequence. SQL: WITH m AS (SELECT gltrans_sequence FROM gltrans WHERE gltrans_doctype='JE' GROUP BY gltrans_sequence HAVING COUNT(*)>2 LIMIT 1) SELECT (SELECT COUNT(*) FROM gltrans WHERE gltrans_doctype='JE' AND gltrans_sequence=m.gltrans_sequence) AS actual_lines, (SELECT COUNT(*) FROM api.journalentry a WHERE a.doc_number IN (SELECT gltrans_docnumber FROM gltrans WHERE gltrans_sequence=m.gltrans_sequence)) AS view_rows FROM m m; returns (34, 450).", "impact": "Any external integration or report that reads api.journalentry over-reports journal entries, mispairs debit/credit accounts, and double-/N-counts amounts. A 2-line JE is reported correctly; a 4-line JE with 2 debits + 2 credits is reported 4 times. Auditors pulling the API view will see totals inflated by a factor equal to the multi-line count; could easily produce wildly wrong GL reconciliation.", "suggested_fix": "Either (a) expose gltrans lines individually (one row per gltrans row with debit/credit derived from sign), (b) aggregate by sequence to show total debit side vs total credit side, or (c) restrict to sequences that have exactly one debit and one credit line. Option (a) is the most honest.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["cross-product", "api-view", "gl"]}, {"id": "BUG-0029", "title": "api.customer uses implicit CROSS JOIN, hiding customers missing lookups", "category": "data-integrity", "module": "AR", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_view", "db_object": "api.customer"}, "excerpt": "FROM custinfo ... , custtype, salesrep, curr_symbol dc, curr_symbol clc, terms WHERE custinfo.cust_custtype_id = custtype.custtype_id AND custinfo.cust_salesrep_id = salesrep.salesrep_id AND custinfo.cust_curr_id = dc.curr_id AND custinfo.cust_creditlmt_curr_id = clc.curr_id AND custinfo.cust_terms_id = terms.terms_id", "description": "Comma-join (implicit CROSS JOIN with WHERE filter) forces every custinfo row to have matching rows in custtype, salesrep, currency, and terms. Any customer whose salesrep is deleted/inactivated or whose terms row is removed silently disappears from the view. Currently no orphans exist (confirmed by counts) but this is a latent footgun: deleting a salesrep hides every customer assigned to them from api.customer even though they still exist.", "reproduction": "Pre-incident check: SELECT COUNT(*) FROM custinfo - 597, SELECT COUNT(*) FROM api.customer - 597. Delete (or inactivate via FK nulling) a salesrep used by customers and api.customer count drops silently.", "impact": "API integrations silently miss customers after data hygiene operations; reconciliation between custinfo counts and api.customer counts reveals gaps only after the fact.", "suggested_fix": "Change all five comma-joins to LEFT JOIN and keep the WHERE as COALESCE or drop it. Same fix should be applied to api.item (classcode, uom), api.itemsite (plancode, costcat, whsinfo).", "references": {"related_bugs": ["BUG-0027", "BUG-0030", "BUG-0031"]}, "discovered_via": "db_pattern_scan", "tags": ["inner-join-hides-rows", "api-view"]}, {"id": "BUG-0030", "title": "api.item uses implicit CROSS JOIN, hides items missing classcode/uom", "category": "data-integrity", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_view", "db_object": "api.item"}, "excerpt": "FROM item LEFT JOIN prodcat ... , classcode, uom i, uom p WHERE item.item_classcode_id = classcode.classcode_id AND item.item_inv_uom_id = i.uom_id AND item.item_price_uom_id = p.uom_id", "description": "Same CROSS JOIN pattern as api.customer. An item whose classcode is deleted or whose inventory/price UOM is removed silently disappears from api.item. No orphans currently exist (7528 items, 7528 visible) but the latent hazard applies.", "reproduction": "See BUG-0029 reproduction. Same family of bug.", "impact": "API integrations miss items after data cleanup.", "suggested_fix": "LEFT JOIN for classcode and uom aliases.", "references": {"related_bugs": ["BUG-0027", "BUG-0029", "BUG-0031"]}, "discovered_via": "db_pattern_scan", "tags": ["inner-join-hides-rows", "api-view"]}, {"id": "BUG-0031", "title": "api.itemsite uses INNER JOINs, hides itemsites with missing plancode/costcat/site", "category": "data-integrity", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_view", "db_object": "api.itemsite"}, "excerpt": "FROM itemsite JOIN item ON ... JOIN plancode ON ... JOIN costcat ON ... JOIN whsinfo ON ...", "description": "All four joins are INNER. An itemsite with an orphaned plancode_id or costcat_id becomes invisible.", "reproduction": "See BUG-0029.", "impact": "API integrations miss itemsite rows after data cleanup.", "suggested_fix": "LEFT JOIN plancode, costcat, whsinfo. The JOIN on item is correct since itemsite is definitionally an item×site tuple.", "references": {"related_bugs": ["BUG-0029", "BUG-0030"]}, "discovered_via": "db_pattern_scan", "tags": ["inner-join-hides-rows", "api-view"]}, {"id": "BUG-0032", "title": "postVoucher divides freight by (qty_received - qty_vouchered), hits div-by-zero edge", "category": "functional", "module": "AP", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.postvoucher(integer,integer,boolean)"}, "excerpt": "(poitem_freight_received - poitem_freight_vouchered) / (poitem_qty_received - poitem_qty_vouchered) * voitem_qty AS vouchered_freight,\n                           currToBase(_p.pohead_curr_id, (poitem_freight_received - poitem_freight_vouchered) / (poitem_qty_received - poitem_qty_vouchered) * voitem_qty, _firstExchDateFreight ) AS vouchered_freight_base,", "description": "Inside the FOR _g loop over P/O lines on a voucher, per-unit freight is calculated by dividing outstanding freight by outstanding-to-voucher qty. If an operator vouchers qty equal to received qty in two separate vouchers (first fully vouchers the qty but another voitem row still refers to the same poitem), the second pass divides by zero and the whole postVoucher transaction aborts with a 22012 division-by-zero error — leaving the voucher un-posted and requiring admin fix-up.", "reproduction": "Set up a PO line with received qty 10 and freight $20. Create voucher A for qty 10, post. Create voucher B that still has a voitem row for that poitem (e.g., adjustment) — post. Expect RAISE EXCEPTION division by zero at postVoucher in the FOR _g loop.", "impact": "Operators cannot post certain AP vouchers; they get a raw Postgres error, not an xTuple error; data requires manual cleanup.", "suggested_fix": "Wrap denominator with NULLIF(poitem_qty_received - poitem_qty_vouchered, 0) and COALESCE the whole expression to 0 when outstanding qty is zero. Also filter the outer SELECT DISTINCT to exclude poitems already fully vouchered.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["div-by-zero", "posting", "ap"]}, {"id": "BUG-0033", "title": "postVoucher mixes ROUND(x,4) and ROUND(x,2) scales in total reconciliation", "category": "financial", "module": "AP", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.postvoucher(integer,integer,boolean)"}, "excerpt": "SELECT round(SUM(amount),4) INTO _tmpTotal FROM ( ... UNION ALL ... UNION ALL ... ) ... IF (_tmpTotal > _p.vohead_amount) THEN RAISE EXCEPTION ...", "description": "The voucher reconciliation sums distributions at scale 4 and compares to vohead_amount which is stored at scale 2 (monetary). Rounding to 4 dp and comparing to a 2 dp amount can leave a tiny discrepancy that either (a) lets a voucher pass distribution check when it shouldn't, or (b) fails a voucher for a distribution that is actually exact at 2 dp. Functions elsewhere in the same procedure use scale 2.", "reproduction": "Contrive a voucher where sum of vodist_amount rows and freight amounts has a 4-dp residue that rounds differently at 2 vs 4 dp (e.g., three rows at .005 each sum differently at each rounding scale).", "impact": "Rare off-by-penny voucher rejections or acceptances; hard to trace.", "suggested_fix": "Round at scale 2 throughout to match stored vohead_amount. If 4 dp is needed for intermediate accuracy, compare with an explicit 2dp tolerance.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["rounding", "scale-mismatch"]}, {"id": "BUG-0034", "title": "wgs.correct_allpedal_import_data truncates >6 digit PO numbers and NULLs country", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.correct_allpedal_import_data()"}, "excerpt": "cohead_custponumber = 'ALLPEDAL-' || RIGHT('000000' || cohead_custponumber, 6) || '-' || cohead_shipto_cntct_honorific,\n...\ncohead_shiptocountry = (SELECT country_name FROM country WHERE country_abbr = cohead_shiptocountry LIMIT 1),", "description": "Two issues in the Allpedal import cleanup: (1) `RIGHT('000000'||X, 6)` pads left-zero but also TRUNCATES to 6 characters — if the site ever produces a 7+ digit PO number, the high-order digit silently disappears. (2) The country lookup sets cohead_shiptocountry to NULL when the incoming abbreviation isn't in the country table (bad data from the site becomes data loss), losing even the original abbreviation that could have been hand-corrected later.", "reproduction": "INSERT cohead with cohead_custponumber = '1234567' and cohead_shiptocountry = 'XX' (non-existent), run function — PO becomes ALLPEDAL-234567-... and country becomes NULL.", "impact": "Occasional lost customer-PO reference; lost country information. Audit back to Shopify source is still possible but painful.", "suggested_fix": "Use LPAD(cohead_custponumber, 6, '0') and skip pad entirely when already ≥6 chars: CASE WHEN LENGTH(cohead_custponumber) >= 6 THEN cohead_custponumber ELSE LPAD(...) END. For country: COALESCE((SELECT country_name FROM country WHERE country_abbr = cohead_shiptocountry LIMIT 1), cohead_shiptocountry).", "references": {}, "discovered_via": "module_review", "tags": ["data-loss", "allpedal", "truncation"]}, {"id": "BUG-0035", "title": "wgs.verify_itemwoserial silently processes only one parent item; never resets counter on first-ever insert", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.verify_itemwoserial(integer)"}, "excerpt": "SELECT bomitem_parent_item_id AS bi INTO _item FROM bomitem JOIN womatl ON womatl_bomitem_id = bomitem_id JOIN wo ON wo_id = womatl_wo_id WHERE wo_id = woid GROUP BY bomitem_parent_item_id;\n...\nSELECT SUBSTRING(itemwoserial_last_print_date::TEXT FROM 3 FOR 2) AS yy INTO _LatestYear FROM wgs.itemwoserial WHERE itemwoserial_item_id = _item;\nIF (_year::INTEGER > _LatestYear::INTEGER) THEN ...", "description": "Two bugs: (1) SELECT INTO on a multi-row query (GROUP BY returns multiple parent_item_ids if the WO is composed of multiple builds) silently assigns one arbitrary parent_item_id to _item, ignoring the rest. (2) After the INSERT branch (new itemwoserial row with NULL itemwoserial_last_print_date), _LatestYear becomes NULL and the year-rollover comparison NULL > N returns UNKNOWN → FALSE, so the counter is never reset even when crossing a year boundary on first use. (3) `_LatestYear::INTEGER` fails if the substring returns blank or non-numeric.", "reproduction": "Trigger the function for a WO whose bomitem includes >1 distinct parent_item_id; only one is updated. Also, inserting a new itemwoserial on Dec 31 and reading on Jan 1 never triggers reset branch because the freshly inserted row has NULL last_print_date.", "impact": "Serial number sequences may continue past year rollover instead of resetting; not all parent items get their serial rows maintained.", "suggested_fix": "Rewrite with FOR loop over distinct parent_item_ids, and initialize itemwoserial_last_print_date to CURRENT_DATE on INSERT so comparison is well-defined. Guard the substring-to-integer cast with COALESCE or NULLIF.", "references": {}, "discovered_via": "module_review", "tags": ["select-into-multi-row", "null-comparison", "serial"]}, {"id": "BUG-0036", "title": "wgs.determine_shipto_id uses shared (non-session) temp tables — race condition", "category": "concurrency", "module": "wgs-custom", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.determine_shipto_id(integer)"}, "excerpt": "DELETE FROM wgs.namescores_temp;\nINSERT INTO wgs.namescores_temp (ns_score, ns_shipto_id) (SELECT ... FROM shiptoinfo ...);\n...\nDELETE FROM wgs.potentials_temp;\nINSERT INTO wgs.potentials_temp (pot_finalscore, pot_shipto_id) (SELECT ... );", "description": "`wgs.namescores_temp` and `wgs.potentials_temp` are permanent, globally-visible tables used as scratch workspace. Every caller DELETEs the whole table then repopulates it. Two concurrent callers (e.g., two sales-order imports) stomp on each other's state — call A may read rows that B inserted, or A's DELETE wipes B's rows mid-computation, yielding whichever caller's SELECT runs first after the interleaving. Returned shipto_id may belong to a completely unrelated order.", "reproduction": "Start two overlapping api.salesorder imports that hit determine_shipto_id concurrently; observe cross-contamination. Any concurrency test with two sessions calling determine_shipto_id simultaneously with different coheadid will demonstrate.", "impact": "Wrong ship-to id auto-attached to sales orders; undetectable after the fact without comparing to source of truth.", "suggested_fix": "Replace wgs.namescores_temp / wgs.potentials_temp with CTEs (WITH ... AS) inside the function body, or use CREATE TEMP TABLE ... ON COMMIT DROP inside the function. Also add a session advisory lock if keeping tables is preferred for legacy reasons.", "references": {}, "discovered_via": "module_review", "tags": ["race-condition", "shared-scratch-table", "concurrency"]}, {"id": "BUG-0037", "title": "wgs.determine_shipto_id references cohead_shiptoaddress4/5 columns that do not exist", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.determine_shipto_id(integer)"}, "excerpt": "COALESCE(cohead_shiptoaddress2, cohead_shiptoaddress1, cohead_shiptoaddress3, cohead_shiptoaddress4, cohead_shiptoaddress5, '') AS b,", "description": "cohead has columns cohead_shiptoaddress1/2/3 but not ...address4/5. This SELECT will throw `column does not exist` at runtime. Unless Postgres is parsing lazily or the fields were added in a custom schema, this function would error on every invocation (suggests it is rarely if ever called successfully).", "reproduction": "SELECT wgs.determine_shipto_id(<any-cohead_id-with-NULL-shipto_id>); expected: ERROR: column \"cohead_shiptoaddress4\" does not exist.", "impact": "Function silently broken; auto-matching of ship-tos on import never happens; callers likely catch and ignore.", "suggested_fix": "Remove the address4/5 references (COALESCE down to address3). Verify the function's intended behavior was updated.", "references": {}, "discovered_via": "module_review", "tags": ["undefined-column"]}, {"id": "BUG-0038", "title": "wgs.get_all_item_components has no recursion depth limit or cycle guard", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.get_all_item_components(integer)"}, "excerpt": "SELECT STRING_AGG(wgs.get_all_item_components(item_id), ',') INTO _children FROM bomitem JOIN item ON item_id = bomitem_item_id WHERE bomitem_parent_item_id = itemid AND bomitem_expires > CURRENT_DATE;", "description": "Recursive plpgsql function with no MAX-depth parameter and no cycle-detection. If any item BOM contains a loop (A -> B -> A), the function recurses until Postgres stack limit (error 54001 stack depth exceeded) — crashing the caller. Also exponential blowup for diamond BOMs where sub-assemblies are shared: each shared node is re-walked from scratch at every occurrence.", "reproduction": "Build (in a dev DB) a pathological BOM: bomitem A.item = B, bomitem B.item = A (cycle). Call wgs.get_all_item_components(A). Expected: ERROR: stack depth limit exceeded.", "impact": "Production crash if someone accidentally creates a circular BOM.", "suggested_fix": "Rewrite as recursive CTE with `WHERE NOT ARRAY[item_id] <@ path_so_far` cycle guard and a max-depth clause. Then expose via SQL view/function.", "references": {"related_bugs": ["BUG-0039"]}, "discovered_via": "module_review", "tags": ["recursion", "no-cycle-guard", "stack-overflow"]}, {"id": "BUG-0039", "title": "wgs.get_pedal_ids arbitrary LIMIT 1 parent pick silently drops multi-parent paths", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.get_pedal_ids(integer)"}, "excerpt": "SELECT bomitem_parent_item_id, item_descrip1 INTO _currparent, _parentdescrip FROM bomitem JOIN item ON item_id = bomitem_parent_item_id WHERE bomitem_item_id = _curritemid AND bomitem_expires > CURRENT_DATE ORDER BY CHAR_LENGTH(item_descrip1) LIMIT 1;", "description": "When an item (say a PCBA) is used as a component in multiple pedals, bomitem returns several parent rows. The function picks exactly one arbitrary parent (by shortest description) to walk up. All other parent paths are silently discarded. Returned SETOF integer ends up enumerating just one pedal instead of all of them.", "reproduction": "Find a PCBA that is bomitem_item_id in two distinct pedal BOMs (ask BOM team for an example); wgs.get_pedal_ids(pcbaId) returns one id where there should be two.", "impact": "Callers making routing/labeling decisions based on \"which pedal does this PCBA belong to\" get an answer that is correct for one pedal and wrong for every other pedal that uses the same board.", "suggested_fix": "Replace loop with recursive CTE that walks all parent paths and DISTINCTs final parents whose descrip LIKE '%pedal -%'.", "references": {"related_bugs": ["BUG-0038"]}, "discovered_via": "module_review", "tags": ["bom", "multi-parent", "silent-drop"]}, {"id": "BUG-0040", "title": "wgs.clean_shipcomments fails when scan-prefix is found but suffix is absent", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.clean_shipcomments(text)"}, "excerpt": "p1 := STRPOS(newcomments, _scan_prefix);\nIF (p1 < 1 ) THEN f_comments := newcomments;\nELSE\n  p2 := STRPOS(newcomments, _scan_suffix);\n  scans := SUBSTRING(newcomments FROM (p1 + _prefixlen) FOR ((p2 - p1) - _prefixlen));", "description": "If the scan prefix border is present but the closing suffix border is missing or deleted (e.g., a user hand-edited the comments and nuked the bottom border), `p2 = 0`. The SUBSTRING length becomes `(0 - p1) - _prefixlen` which is a large negative number → SUBSTRING returns empty, and the subsequent reassembly uses `SUBSTRING(tmp FROM (0 + _suffixlen))`, i.e., starts at offset _suffixlen of the full string — losing arbitrary amounts of comment data.", "reproduction": "UPDATE shiphead SET shiphead_notes = '---------- SCANNED ITEM SERIAL NUMBERS ----------\\n---------- DO NOT DELETE THIS BORDER OR ---------\\n--------- ANY TEXT WITHIN THESE BORDERS ---------\\nSN123\\n' || 'tail text without closing border' WHERE shiphead_id = <x>; SELECT wgs.clean_shipcomments(shiphead_notes) — produces garbled/lost comments.", "impact": "Ship-comment cleanup can silently destroy user-typed comments when the scan block is partially broken.", "suggested_fix": "Guard: IF p2 = 0 THEN RETURN s_comments UNCHANGED; END IF; also validate p2 > p1+_prefixlen before substring.", "references": {}, "discovered_via": "module_review", "tags": ["substring-negative-length", "data-loss"]}, {"id": "BUG-0041", "title": "wgs.attach_if_notfound / detach_if_found match substrings, not comma-delimited tokens", "category": "functional", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.attach_if_notfound(text,text), wgs.detach_if_found(text,text)"}, "excerpt": "_pos := POSITION(_keystring IN _sumstring);\nIF (_pos < 1) THEN _sumstring := _sumstring || ','::TEXT || _keystring; END IF;", "description": "Both functions check containment with POSITION (substring match) instead of tokenizing by comma. If sumstring = 'AB,CD' and keystring = 'B', POSITION returns 2 (matches inside 'AB'), so attach_if_notfound refuses to attach 'B' — bug. Conversely detach_if_found('AB,CD','B') matches at pos 2 and removes 'B' leaving 'A,CD' — corruption. Tokens that are substrings of each other are the common failure case.", "reproduction": "SELECT wgs.attach_if_notfound('AB,CD', 'B') — returns 'AB,CD' instead of 'AB,CD,B'. SELECT wgs.detach_if_found('AB,CD', 'B') — returns 'A,CD'.", "impact": "Characteristic/tag sumstrings subtly corrupted; duplicates suppressed wrongly; partial removals leave broken strings.", "suggested_fix": "Use string_to_array / array_to_string with explicit token comparison, or surround with commas and search for ','||key||',' after padding the sumstring.", "references": {}, "discovered_via": "module_review", "tags": ["substring-match", "tokenization"]}, {"id": "BUG-0042", "title": "wgs.detach_if_found can leave leading or double comma when removing first/middle token", "category": "functional", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.detach_if_found(text,text)"}, "excerpt": "_sumstring := LEFT(_sumstring, _pos-1) || SUBSTRING(_sumstring FROM _pos+LENGTH(_keystring)+1);", "description": "When removing the first token of the sumstring, LEFT(sumstring,0) returns '' and SUBSTRING starts after the keystring+1 (skipping one char, presumably comma). But if keystring is the LAST token and there's no trailing char, `_pos+L(key)+1` exceeds the string length, SUBSTRING returns '', but the preceding comma from the previous token remains. Example: detach_if_found('AB,CD','CD') → LEFT('AB,CD',3)='AB,' + SUBSTRING('AB,CD' FROM 6)='' → 'AB,' (trailing comma). Example: detach_if_found('AB,CD','AB') → LEFT('AB,CD',0)='' + SUBSTRING('AB,CD' FROM 4)='CD' — OK this one is right but by accident.", "reproduction": "SELECT wgs.detach_if_found('AB,CD','CD') — returns 'AB,' with trailing comma.", "impact": "Accumulating corrupt commas over time in custom tag/characteristic strings.", "suggested_fix": "Use regexp_replace(sumstring, '(^|,)'||key||'(,|$)', '$1') and then collapse doubled commas / trim edges.", "references": {"related_bugs": ["BUG-0041"]}, "discovered_via": "module_review", "tags": ["tokenization", "string-manipulation"]}, {"id": "BUG-0043", "title": "wgs.create_allpedal_import_lineitems uses NUMERIC(8,2), overflows at $1M", "category": "data-integrity", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.create_allpedal_import_lineitems(integer)"}, "excerpt": "_cent_deficit NUMERIC(8,2) := 0.00;\n   _curr_totalcost NUMERIC(8,2);\n   _curr_unitprice NUMERIC(8,2);\n   _freight NUMERIC(8,2);", "description": "NUMERIC(8,2) max value is 999999.99. While All-Pedal orders are currently small, a bulk-order or test-import above $1M would raise numeric_value_out_of_range and abort the import.", "reproduction": "Construct a test Shopify import with a single line-item totalcost = 1000000.00 and trigger wgs.create_allpedal_import_lineitems; expect 22003 numeric_value_out_of_range.", "impact": "Rare today; if All-Pedal averages ever grow or a data anomaly pushes a line item high, imports break.", "suggested_fix": "Change to NUMERIC(12,2) or use plain NUMERIC (unbounded precision).", "references": {}, "discovered_via": "module_review", "tags": ["numeric-overflow", "allpedal"]}, {"id": "BUG-0044", "title": "public.invoicetotal uses inconsistent ROUND scales in same computation", "category": "financial", "module": "AR", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.invoicetotal(integer)"}, "excerpt": "SUM(ROUND(COALESCE((invcitem_billed * invcitem_qty_invuomratio) * (invcitem_price / COALESCE(invcitem_price_invuomratio,1)), 0),2))\n...\nSELECT SUM(tax) INTO _linetax FROM (SELECT ROUND(SUM(COALESCE(taxdetail_tax, 0)),2) AS tax FROM tax JOIN calculateTaxDetailSummary('I', pInvoiceId, 'T') ON (taxdetail_tax_id=tax_id) GROUP BY tax_id) AS data", "description": "The function's own TODO comment asks 'why sum on the result of select round(sum(), 2)?' and the function uses three different scales (0/1/2) across its body. Upstream xTuple issue carried into our DB. Low priority; existing behavior is accepted.", "reproduction": "Read pg_proc.prosrc; the TODO comment is present in upstream source.", "impact": "Potential off-by-penny in invoice totals under specific tax-rounding interactions; historically tolerated.", "suggested_fix": "Upstream issue; monitor xTuple upstream bugfix tracker before touching.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["rounding", "upstream-known"]}, {"id": "BUG-0045", "title": "wgs._checkcheckdata trigger function is a dangling test function with no RETURN", "category": "tech-debt", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs._checkcheckdata()"}, "excerpt": "-- Test\\nDECLARE\\n\\nBEGIN\\n\\n  NEW = NEW;\\n\\nEND;", "description": "Trigger function body is `NEW = NEW` and has NO `RETURN NEW` — falling off the end of a plpgsql trigger function returns NULL, which would SUPPRESS the triggering INSERT/UPDATE. Function is not attached to any trigger (verified via information_schema.triggers). It is pure dead code left over from a test, but dangerous if anyone ever wires it up to a trigger.", "reproduction": "SELECT * FROM information_schema.triggers WHERE action_statement ILIKE '%_checkcheckdata%' returns 0 rows.", "impact": "None today; potential silent row suppression if accidentally activated.", "suggested_fix": "DROP FUNCTION wgs._checkcheckdata().", "references": {}, "discovered_via": "module_review", "tags": ["dead-code", "trigger-without-return"]}, {"id": "BUG-0046", "title": "wgs.wo_to_clean_barcode does not actually clean the WO number", "category": "functional", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.wo_to_clean_barcode(integer)"}, "excerpt": "RETURN (SELECT wo_number AS wobc FROM wo WHERE wo_id = woid);", "description": "Name implies a cleaning/barcode-encoding step but body merely returns wo_number unchanged. Either function is misnamed or the cleaning logic is missing. Callers expecting stripped non-barcode-safe characters (spaces, punctuation) get raw wo_number.", "reproduction": "SELECT wgs.wo_to_clean_barcode(<wo_id with dashes or spaces>) — returns raw wo_number.", "impact": "Callers printing barcodes may produce invalid codes for WOs with unusual chars.", "suggested_fix": "Either rename to wgs.wo_to_barcode_raw or add the character-stripping logic that was presumably intended (REGEXP_REPLACE for Code-39/128 safe chars).", "references": {}, "discovered_via": "module_review", "tags": ["misnamed", "dead-logic"]}, {"id": "BUG-0047", "title": "wgs.ups_get_minicodes is a stub — UPS region/district determination never implemented", "category": "functional", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.ups_get_minicodes(text,text)"}, "excerpt": "--determine UPS region and district\\n\\n  RETURN _codetext;", "description": "Function description says 'determine UPS region and district' but body only concatenates first 2 chars of state + first 3 of zip and returns it, with a bare comment where the region/district logic should be.", "reproduction": "Read function body.", "impact": "If callers expect UPS zone-like output, they get only a state+zip prefix. Low operational impact — probably not used in critical paths.", "suggested_fix": "Either finish the implementation or rename to wgs.ups_get_state_zip_prefix.", "references": {}, "discovered_via": "module_review", "tags": ["stub", "incomplete"]}, {"id": "BUG-0048", "title": "wgs.pull_field_from_lineitem_text silently returns wrong data when field or separator missing", "category": "data-integrity", "module": "wgs-custom", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "wgs.pull_field_from_lineitem_text(text,text,text)"}, "excerpt": "_qpos := POSITION(_field_name IN _curr_lineitem);\n_curr_lineitem := RIGHT(_curr_lineitem, 1 - _qpos - LENGTH(_field_name));\n_qpos := POSITION(_sep IN _curr_lineitem);\n_curr_field := LEFT(_curr_lineitem, _qpos - 1);\n_remnant := RIGHT(_curr_lineitem, 0 - _qpos);", "description": "If field_name is not found in line-item text, POSITION returns 0; then RIGHT(txt, 1 - 0 - L(field_name)) = RIGHT(txt, 1-L) — a negative length — which in Postgres drops |1-L| characters from the LEFT side. Subsequent POSITION on separator proceeds against this mangled string, producing garbage that is then silently fed as the SKU/quantity/price back into create_allpedal_import_lineitems. No error, no log — just wrong lineitems.", "reproduction": "SELECT * FROM wgs.pull_field_from_lineitem_text('sku:ABC|quantity:2|total:10', 'bogus:', '|') — returns a non-empty val/remnant derived from random offsets.", "impact": "Allpedal imports with malformed line-item strings produce wrong SKUs/prices/qtys silently.", "suggested_fix": "Guard: IF _qpos = 0 THEN RAISE EXCEPTION 'field % not found', _field_name END IF; also validate separator position.", "references": {"related_bugs": ["BUG-0034"]}, "discovered_via": "module_review", "tags": ["no-error-on-missing", "allpedal", "silent-bad-data"]}, {"id": "BUG-0049", "title": "postInvoice asymmetric GL booking: negative misc charges bypass GL", "category": "financial", "module": "AR", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.postinvoice(integer, integer, integer, boolean)"}, "excerpt": "-- regular line items branch:\nIF (_amount != 0) THEN\n  PERFORM insertIntoGLSeries(...);\nEND IF;\n\n-- misc-charge branch later in same function:\nIF (_amount > 0) THEN\n  PERFORM insertIntoGLSeries(...);\nEND IF;", "description": "Inside public.postinvoice, regular line-item GL booking uses `IF (_amount != 0)` (books both positive and negative amounts), but the misc-charge loop uses `IF (_amount > 0)`. A negative misc_amount (credit/allowance recorded as a misc charge) is written to cohist but is NOT booked to gltrans. Result: customer A/R is credited but the offsetting debit never hits the revenue/expense account — books go out of balance by the amount of the negative misc charge. This is structurally identical to the regular-item path and the asymmetry looks like a copy/paste slip.", "reproduction": "Create an invoice with a misc charge of -5.00 assigned to a specific revenue GL. Post it. Query: SELECT invchead_invcnumber, invchead_misc_amount FROM invchead WHERE invchead_id=X; SELECT gltrans_sequence, sum(gltrans_amount) FROM gltrans WH
