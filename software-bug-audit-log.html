toDelete` struct contains hardcoded literals). However, the pattern is fragile: any future refactor that lets caller data seep into `table` or `keycol` becomes an injection. At minimum keyval should use bindValue even though it happens to be an int today.", "reproduction": "N/A — style/fragility issue.", "impact": "Latent risk if the toDelete struct is ever populated from non-literal sources; also the keyval path is not parameterized.", "suggested_fix": "Switch to prepare+bind for keyval; validate that table/keycol are whitelisted names (they come from a local struct today, so a compile-time whitelist is trivial).", "references": {}, "discovered_via": "module_review", "tags": ["string-concat", "fragile", "crm", "sql-hygiene"]}, {"id": "BUG-0116", "title": "contact.cpp: sHandleValidUse disconnect/connect leaks if called before _uses is populated", "category": "functional", "module": "CRM", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/contact.cpp", "line_start": 947, "line_end": 962}, "excerpt": "disconnect(_uses, SIGNAL(itemSelected(int)), _editUse, SLOT(animateClick()));\ndisconnect(_uses, SIGNAL(itemSelected(int)), _viewUse, SLOT(animateClick()));\n...\nif (_editUse->isEnabled())\n  connect(_uses, SIGNAL(itemSelected(int)), _editUse, SLOT(animateClick()));\nelse if (_viewUse->isEnabled())\n  connect(_uses, SIGNAL(itemSelected(int)), _viewUse, SLOT(animateClick()));", "description": "Handler runs on every valid(bool) emission. Qt disconnect is idempotent so duplicate connections don't accumulate on normal use. However, if _editUse / _viewUse enabled state toggles twice in a row without the slot firing, a stale connection can remain to the no-longer-enabled button. Symptom: double-click on uses list activates the wrong edit/view button.", "reproduction": "Observed historically in dspWoSchedule-style dual-button rows; verify with qt-test manual double-click.", "impact": "Wrong button fires on double-click under an edge sequence; minor UX issue.", "suggested_fix": "Store a pointer to the currently connected button and always disconnect that one, rather than blindly disconnecting both.", "references": {}, "discovered_via": "module_review", "tags": ["signal-slot", "qt", "crm", "ux"]}, {"id": "BUG-0117", "title": "opportunity.cpp: modal todoItem newdlg.exec() return value ignored", "category": "tech-debt", "module": "CRM", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/opportunity.cpp", "line_start": 559, "line_end": 562}, "excerpt": "todoItem newdlg(this, 0, true);\nnewdlg.set(params);\nnewdlg.exec();", "description": "Dialog opens as modal but the exec() return value is dropped. If the dialog in the future gains an 'apply-to-parent' save semantic, the parent will never fill-list. Same pattern appears in multiple CRM files.", "reproduction": "N/A — currently harmless because the view-only dialog does not save.", "impact": "Pattern-debt; bites any refactor that changes the dialog to have a side effect.", "suggested_fix": "`if (newdlg.exec() != XDialog::Rejected) sFillList();` (or whatever the parent needs to refresh).", "references": {}, "discovered_via": "module_review", "tags": ["modal-dialog", "ignored-return", "crm"]}, {"id": "BUG-0118", "title": "incident.cpp: populate() calls exec() then first() without between-check (L575-589)", "category": "tech-debt", "module": "CRM", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/incident.cpp", "line_start": 575, "line_end": 589}, "excerpt": "incidentpopulate.exec();\nif(incidentpopulate.first())\n{\n  _cntct->setId(incidentpopulate.value(\"incdt_cntct_id\").toInt());\n  ...\n}", "description": "Populate exec() is never checked; only first() is tested. If exec() fails, first() returns false and the form remains blank (setId(-1) defaults apply). User sees empty form instead of error message, which is confusing when trying to open an existing incident that actually exists. Pattern affects most populate() methods codebase-wide.", "reproduction": "Break DB connection while opening an incident.", "impact": "Silent blank-form instead of actionable error; user thinks record is missing.", "suggested_fix": "Add ErrorReporter::error check between exec() and first() in populate() methods.", "references": {}, "discovered_via": "module_review", "tags": ["populate", "silent-failure", "crm"]}, {"id": "BUG-0119", "title": "crmaccount.cpp: XSqlQuery(\"COMMIT;\") relies on constructor-side exec without checking return", "category": "tech-debt", "module": "CRM", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/crmaccount.cpp", "line_start": 537, "line_end": 544}, "excerpt": "XSqlQuery commit(\"COMMIT;\");\n_NumberGen = -1;\nif (commit.lastError().type() != QSqlError::NoError)\n{\n  ErrorReporter::error(QtCriticalMsg, this, tr(\"Database Error\"),\n                       commit, __FILE__, __LINE__);\n  return;\n}", "description": "The constructor form XSqlQuery(\"COMMIT;\") builds AND executes the query (a xTuple convenience that's easy to miss). lastError() is then checked, so this works today. Flagged because the pattern is unobvious and easy to break when refactoring (e.g., if someone later splits it into XSqlQuery commit; commit.prepare(\"COMMIT;\") and forgets to call exec()).", "reproduction": "N/A — style concern.", "impact": "Refactor-hazard; not a live bug.", "suggested_fix": "Use the two-line form everywhere for clarity: `XSqlQuery q; q.exec(\"COMMIT\");`.", "references": {}, "discovered_via": "module_review", "tags": ["style", "refactor-hazard", "crm"]}, {"id": "BUG-0120", "title": "incident.cpp: _incdthist->populate runs before ErrorReporter check on the same query (L507-514)", "category": "tech-debt", "module": "CRM", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/incident.cpp", "line_start": 505, "line_end": 515}, "excerpt": "incidentFillHistoryList.exec();\n_incdthist->populate(incidentFillHistoryList);\nif (ErrorReporter::error(QtCriticalMsg, this, tr(\"Error Retrieving Incident History\"),\n                             incidentFillHistoryList, __FILE__, __LINE__))\n{\n  return;\n}", "description": "populate(incidentFillHistoryList) is called before the ErrorReporter check. If exec() failed, the XTreeWidget receives an invalid query and may emit Qt warnings or leave stale rows from a prior invocation. The eventual ErrorReporter::error return happens too late to prevent the populate call.", "reproduction": "Simulate exec() failure; observe populate receives a bad query.", "impact": "Stale rows or Qt warnings in console.", "suggested_fix": "Reorder: run ErrorReporter::error first, populate only on success.", "references": {}, "discovered_via": "module_review", "tags": ["populate", "ordering", "crm"]}, {"id": "BUG-0121", "title": "purchaseOrder.cpp: sCalculateTotals silently leaves money totals stale if query returns 0 rows", "category": "functional", "module": "Purchasing", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrder.cpp", "line_start": 1374, "line_end": 1385}, "excerpt": "purchaseCalculateTotals.exec();\nif (purchaseCalculateTotals.first())\n{\n  _totalQtyOrd->setLocalValue(purchaseCalculateTotals.value(\"qtyord_total\").toDouble());\n  _subtotal->setLocalValue(purchaseCalculateTotals.value(\"f_total\").toDouble());\n  _totalFreight->setLocalValue(purchaseCalculateTotals.value(\"freightsub\").toDouble() + _freight->localValue());\n  _total->setLocalValue(purchaseCalculateTotals.value(\"total\").toDouble() + _tax->localValue() + purchaseCalculateTotals.value(\"freightsub\").toDouble() + _freight->localValue());\n}", "description": "If the totals query returns 0 rows (PO with no line items, or DB error returning empty set), first() is false and the _subtotal / _totalFreight / _total widgets retain whatever value they had before. No error is reported. User sees outdated numbers on screen and may save the PO with whatever `_total->localValue()` happened to be.", "reproduction": "Open a PO, delete all line items, observe totals don't zero out.", "impact": "Money-sensitive display corruption; user may post PO with wrong amount-due.", "suggested_fix": "Initialize all totals to 0 before the exec, or add an else branch that zeros them and reports error. Also use ErrorReporter::error for the exec failure path.", "references": {}, "discovered_via": "module_review", "tags": ["money-sensitive", "unchecked-exec", "purchasing", "display-corruption"]}, {"id": "BUG-0122", "title": "purchaseOrder.cpp: sCreate continues after failed INSERT of pohead (L647-656)", "category": "functional", "module": "Purchasing", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrder.cpp", "line_start": 647, "line_end": 656}, "excerpt": "purchasecreateHeader.exec();\nif (purchasecreateHeader.lastError().type() != QSqlError::NoError)\n  ErrorReporter::error(QtCriticalMsg, this, tr(\"Error Creating Purchase Order Header\"),\n                       purchasecreateHeader, __FILE__, __LINE__);\n\n// Populate Ship To contact and addresses for the Receiving Site\nsHandleShipTo();\n\n(void)_lock.acquire(\"pohead\", _poheadid, AppLock::Interactive);", "description": "When the CREATE HEADER exec fails, ErrorReporter pops a dialog but the function does NOT return. Execution falls through to sHandleShipTo() and AppLock::acquire with whatever _poheadid currently holds (likely the previous PO or -1). Subsequent saves write to the wrong pohead_id or fail on FK.", "reproduction": "Force createPo() to return an error (e.g., deny pohead INSERT privilege); observe that the new-PO flow continues with stale _poheadid.", "impact": "P1: potential cross-PO data corruption; locks taken on wrong record.", "suggested_fix": "Add `return;` inside the error branch, or wrap the call in an `if (ErrorReporter::error(...)) return;` guard.", "references": {}, "discovered_via": "module_review", "tags": ["missing-return", "money-sensitive", "purchasing"]}, {"id": "BUG-0123", "title": "enterPoReceipt.cpp: postReceipt -11 result is rolled back despite comment saying to ignore it", "category": "functional", "module": "Purchasing", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/enterPoReceipt.cpp", "line_start": 483, "line_end": 495}, "excerpt": "postLine.exec();\nif (postLine.first())\n{\n  int result = postLine.value(\"result\").toInt();\n  if ((result < 0 && result != -11) || (result != itemlocSeries)) // ignore -11 as it just means there was no inventory\n  {\n    rollback.exec();\n    cleanup.exec();\n    failedItems.append(qi.value(\"item_number\").toString());\n    errors.append(tr(\"Error Posting PO Receipt Information. %1\")\n      .arg(storedProcErrorLookup(\"postReceipt\", result)));\n    continue;\n  }", "description": "Logic bug in the condition: `(result < 0 && result != -11) || (result != itemlocSeries)`. The intent (per comment) is 'treat -11 as success, otherwise require result == itemlocSeries'. But when result == -11, the first clause is false and the second clause `-11 != itemlocSeries` is true (itemlocSeries is always positive), so the whole condition is true and the receipt is ROLLED BACK even though the comment says to ignore it. The code never actually hits the happy path for -11.", "reproduction": "Receive a non-inventory-controlled item; postReceipt returns -11; the receipt gets rolled back despite the 'ignore -11' intent.", "impact": "P1: money-sensitive. Inventory receipts for non-controlled items may be rolled back, requiring re-post. Likely observed in operator logs as 'Error Posting' on non-inventory line items.", "suggested_fix": "Rewrite as: `if (result < 0 && result != -11) { /* error */ } else if (result >= 0 && result != itemlocSeries) { /* error */ }`. Or more cleanly: `bool success = (result == itemlocSeries) || (result == -11);`", "references": {}, "discovered_via": "module_review", "tags": ["logic-error", "money-sensitive", "purchasing", "inventory"]}, {"id": "BUG-0124", "title": "enterPoReceipt.cpp: BEGIN transaction exec not checked before posting (L476)", "category": "functional", "module": "Purchasing", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/enterPoReceipt.cpp", "line_start": 475, "line_end": 482}, "excerpt": "// Wrap the remaining sql function calls in a transaction in case of errors\nenterPost.exec(\"BEGIN;\");", "description": "BEGIN;' exec is not checked. If the session is in an aborted state (prior failed query) BEGIN fails, and the subsequent postReceipt() and UPDATE calls run outside a transaction. On error in the middle, the earlier writes are already committed and cannot be rolled back by the rollback.exec() call at L489.", "reproduction": "Trigger an aborted-tx state before entering the receipt post path; posting will partially succeed.", "impact": "P1: partial posting of receipts, no rollback protection in the 'wrap in transaction in case of errors' branch.", "suggested_fix": "Wrap BEGIN in ErrorReporter::error check; bail out of the loop (failedItems.append + continue) if BEGIN fails.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "transaction", "money-sensitive", "purchasing"]}, {"id": "BUG-0125", "title": "enterPoReceipt.cpp: parentItemlocdist.exec silently leaves itemlocdistId unset on DB error (L434)", "category": "functional", "module": "Purchasing", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/enterPoReceipt.cpp", "line_start": 432, "line_end": 450}, "excerpt": "parentItemlocdist.exec();\nif (parentItemlocdist.first())\n{\n  // If the \"to\" itemsite is not controlled, distribute the From side here\n  if (!qi.value(\"controlled\").toBool())\n  {\n    if (distributeInventory::SeriesAdjust(itemlocSeries, this, lotnum, expdate, warrdate,\n      true) == XDialog::Rejected)\n    ...", "description": "If parentItemlocdist.exec() fails, first() returns false and the entire block (including the call to distributeInventory::SeriesAdjust) is skipped silently. The loop continues to the next line item. No error is reported. Inventory distribution is silently incomplete.", "reproduction": "Force the parentItemlocdist query to error (e.g., bad itemsite_id state); next item receipt is processed as if this line had no parent distribution.", "impact": "Silent inventory distribution gap on transfer receipts.", "suggested_fix": "Add an `else if (ErrorReporter::error(...))` branch after first() check to surface the exec failure and abort the loop iteration.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "silent-failure", "inventory", "purchasing"]}, {"id": "BUG-0126", "title": "purchaseOrderItem.cpp: copy-characteristics INSERT exec unchecked (L305-307)", "category": "functional", "module": "Purchasing", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrderItem.cpp", "line_start": 300, "line_end": 310}, "excerpt": "purchaseet.prepare( \"INSERT INTO charass (charass_target_type, charass_target_id, charass_char_id, charass_value) SELECT 'PI', :orderid, charass_char_id, charass_value FROM charass WHERE (charass_target_type='SI' AND charass_target_id=:soitem_id));\");\npurchaseet.bindValue(\":orderid\", _poitemid);\npurchaseet.bindValue(\":soitem_id\", _parentso);\npurchaseet.exec();", "description": "When a PO item is created from a sales-order item, this INSERT copies characteristics from the SO item to the PO item. exec() is never checked. If the INSERT fails (FK violation, unique constraint), the PO item is saved without its characteristics silently. Also note the typo `))` in the SQL (extra paren inside the WHERE clause — this appears to parse as nested parens which PG accepts).", "reproduction": "Create a PO from an SO with characteristics; manually break the charass FK; observe silent loss.", "impact": "Silent data inconsistency between SO and PO item characteristics.", "suggested_fix": "Wrap in ErrorReporter::error check after exec(); also tidy up the parentheses in the WHERE clause.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "silent-failure", "purchasing", "sql-typo"]}, {"id": "BUG-0127", "title": "purchaseOrderItem.cpp: dependent UPDATE for parentwo is unchecked (L819)", "category": "functional", "module": "Purchasing", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrderItem.cpp", "line_start": 807, "line_end": 821}, "excerpt": "purchaseSave.exec();\nif (ErrorReporter::error(...)) { return; }\n\nif (_parentwo != -1)\n{\n  purchaseSave.prepare(\"UPDATE poitem SET poitem_order_id=:parentwo, poitem_order_type='W' WHERE (poitem_id=:poitem_id);\");\n  purchaseSave.bindValue(\":parentwo\", _parentwo);\n  purchaseSave.bindValue(\":poitem_id\", _poitemid);\n  purchaseSave.exec();\n  // no error check!\n}", "description": "The dependent UPDATE that links a PO item back to its parent work order is unchecked. If this UPDATE fails, the PO item is saved with no parent-WO linkage; the WO has no visibility of the purchase commitment.", "reproduction": "Create a PO item sourced from a WO; corrupt the FK; save.", "impact": "Broken WO<->PO linkage, silent.", "suggested_fix": "Add ErrorReporter::error check after the second exec.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "purchasing", "wo-link"]}, {"id": "BUG-0128", "title": "purchaseOrder.cpp: sSave loops deletePr() ignoring each individual result (L985-989)", "category": "functional", "module": "Purchasing", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrder.cpp", "line_start": 983, "line_end": 990}, "excerpt": "purchaseSave.prepare(\"SELECT deletePr(:pr_id) AS _result;\");\nfor(int i = 0; i < _pridList.size(); ++i)\n{\n  purchaseSave.bindValue(\":pr_id\", _pridList.at(i));\n  purchaseSave.exec();\n}", "description": "Each iteration overwrites the prior exec result; neither exec() nor _result is ever inspected. Any deletePr failure is silently swallowed. Purchase-request rows intended for deletion may survive.", "reproduction": "Create a PO linked to multiple PRs, fail one deletePr (e.g., a PR not in a deletable state), observe the PR row remains.", "impact": "Purchase Request records not cleaned up after conversion to PO.", "suggested_fix": "Check exec() error and the negative-integer result of deletePr per iteration.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "loop", "stored-proc-return", "purchasing"]}, {"id": "BUG-0129", "title": "purchaseOrder.cpp: sCalculateTax exec() falls through silently on 0 rows (L1678-1683)", "category": "functional", "module": "Purchasing", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrder.cpp", "line_start": 1676, "line_end": 1684}, "excerpt": "taxq.exec();\nif (taxq.first())\n  _tax->setLocalValue(taxq.value(\"tax\").toDouble());\nelse if (ErrorReporter::error(QtCriticalMsg, this, tr(\"Calculating P/O Tax\"),\n                              taxq, __FILE__, __LINE__))\n    return;", "description": "If the tax query runs successfully but returns 0 rows (e.g., no taxzone), first() is false AND ErrorReporter::error returns false (no SQL error). Control falls past the if/else-if without updating _tax. The _tax widget retains its last value. Subsequent save commits whatever _tax currently holds, which may be from a different PO or a stale calculation.", "reproduction": "Open a PO with a vendor whose taxzone_id is NULL; observe _tax does not zero out.", "impact": "Money-sensitive: tax may not zero when it should.", "suggested_fix": "Initialize _tax to 0 before the call; or add an explicit else branch that zeros _tax.", "references": {}, "discovered_via": "module_review", "tags": ["money-sensitive", "purchasing", "tax"]}, {"id": "BUG-0130", "title": "poitemTableView.cpp: setCurrentIndex(rowCount()-1) on empty model yields invalid QModelIndex", "category": "functional", "module": "Purchasing", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/poitemTableView.cpp", "line_start": 66, "line_end": 73}, "excerpt": "if (editor->objectName() == \"poitem_duedate\" &&\n    hint == QAbstractItemDelegate::EditNextItem)\n{\n  setCurrentIndex(model()->index(model()->rowCount() - 1, ITEM_NUMBER_COL));\n}", "description": "When the user tabs away from the duedate field (EditNextItem), the view tries to put focus on the last row. If the model is empty (rowCount()==0), index(-1, col) is invalid; Qt tolerates this (clears selection) but the user just lost their tab target. Worse: if rowCount changed between edit-start and edit-end, the computed last-row index may not be the intended one.", "reproduction": "Open a PO, delete all line items, add one, start editing duedate, hit Tab. The focus ends up unset.", "impact": "Minor UX bug; data-integrity not affected.", "suggested_fix": "Guard with `if (model()->rowCount() > 0)`.", "references": {}, "discovered_via": "module_review", "tags": ["off-by-one", "qt-model", "ux", "purchasing"]}, {"id": "BUG-0131", "title": "poitemTableView.cpp: else-if ErrorReporter pattern swallows 'query succeeded but returned 0 rows' (L426)", "category": "functional", "module": "Purchasing", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/poitemTableView.cpp", "line_start": 420, "line_end": 442}, "excerpt": "itemq.exec();\nif (itemq.first())\n{\n  model->setData(...);\n}\nelse if (ErrorReporter::error(QtCriticalMsg, 0, tr(\"Error Retrieving PO Information\"),\n                          itemq, __FILE__, __LINE__))\n{\n  hitError = true;\n  break;\n}", "description": "Common xTuple idiom. If exec succeeded but returned 0 rows (e.g., item no longer exists), first() is false and ErrorReporter returns false (no SQL error). Control falls through without setting itemsite_id or warehous_id on the row. The user just typed an item number that has no itemsite and the UI silently accepts it.", "reproduction": "Type an item number that exists but has no itemsite in the selected warehouse.", "impact": "PO item row saved with missing itemsite_id — may FK-violate on save, or silently drop data.", "suggested_fix": "Add an explicit `else { show 'Item has no itemsite in this warehouse' warning }` branch.", "references": {}, "discovered_via": "module_review", "tags": ["silent-failure", "purchasing", "itemsite"]}, {"id": "BUG-0132", "title": "purchaseOrder.cpp: weight-UOM label lookup falls back to generic text on DB error (L152-160)", "category": "tech-debt", "module": "Purchasing", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrder.cpp", "line_start": 150, "line_end": 162}, "excerpt": "XSqlQuery getWeightUOM;\ngetWeightUOM.prepare(\"SELECT uom_name FROM uom WHERE (uom_item_weight);\");\ngetWeightUOM.exec();\nif (getWeightUOM.first())\n  {\n    QString newLabel (tr(\"Total Weight (%1):\"));\n    _totalWeightLit->setText(newLabel.arg(getWeightUOM.value(\"uom_name\").toString()));\n  }", "description": "Label lookup in the constructor. If exec() fails or the uom table has no row with uom_item_weight=true, the widget shows 'Total Weight:' with no unit. Cosmetic, but on a money-sensitive form with multi-unit inventory it is misleading.", "reproduction": "Delete the row with uom_item_weight=true; open a PO; observe generic label.", "impact": "Cosmetic; operators may misinterpret weight units on non-metric installs.", "suggested_fix": "Add an error-path that shows a warning or uses the system default UOM.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "ui-label", "purchasing"]}, {"id": "BUG-0133", "title": "purchaseOrderItem.cpp: manufacturer combo populated via DISTINCT with no error check (L98-101)", "category": "tech-debt", "module": "Purchasing", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/purchaseOrderItem.cpp", "line_start": 96, "line_end": 102}, "excerpt": "purchasepurchaseOrderItem.exec(\"SELECT DISTINCT itemsrc_manuf_name FROM itemsrc ORDER BY 1;\");\nfor (int i = 0; purchasepurchaseOrderItem.next(); i++)\n  _manufName->append(i, purchasepurchaseOrderItem.value(\"itemsrc_manuf_name\").toString());\n_manufName->setId(-1);", "description": "Combo population in the constructor. If exec() fails, loop runs zero iterations and the user is presented with an empty manufacturer dropdown. They may think no manufacturers are configured when the real issue is a DB error.", "reproduction": "Break DB connection during form construction.", "impact": "Confusing UX; not a data bug.", "suggested_fix": "Add ErrorReporter::error check after exec.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "combo-population", "purchasing"]}, {"id": "BUG-0134", "title": "common/errorReporter.cpp: dberrs table has commented-out entries and '/ TOOD' comment typo", "category": "tech-debt", "module": "Common", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "common/errorReporter.cpp", "line_start": 20, "line_end": 60}, "excerpt": "// TODO: expose to scripting\n/ TOOD: allow extending the list to constraints in packages\n...\nconst struct { ... } dberrs[] = {\n// TODO: fill in with appropriate text and uncomment\n  ...\n};", "description": "The error-reporter constraint-name-to-message lookup table has multiple 'fill in with appropriate text and uncomment' TODO stubs. Additionally line 23 has a slash-T typo `/ TOOD:` that is a malformed single-line comment. Runtime behavior: when a constraint fires that isn't in the table, xTuple shows the raw PostgreSQL error message, which is intimidating to operators.", "reproduction": "Trigger any constraint not listed in dberrs[] (e.g., a custom package check); observe raw PG error.", "impact": "Lower-quality error messages to operators.", "suggested_fix": "Fill in the constraint table, fix the typo, and open the list for package extension (the TODO explicitly mentions this).", "references": {}, "discovered_via": "module_review", "tags": ["typo", "tech-debt", "common", "error-messages"]}, {"id": "BUG-0135", "title": "common/errorReporter.cpp: 52-TODO cluster representing known incomplete error-code coverage", "category": "tech-debt", "module": "Common", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "common/errorReporter.cpp", "line_start": 1, "line_end": 1490}, "excerpt": "// 52 TODOs spread across error-code mapping / SQL-state to error-message translation", "description": "errorReporter.cpp carries 52 TODO comments documenting missing or incomplete error-code -> user-message mappings. None represents a live functional bug; each represents a future-work item to improve user-visible error text. Rolled up into a single audit entry to avoid spamming the log.", "reproduction": "N/A — tech-debt register.", "impact": "Users occasionally see raw PG errors instead of translated text.", "suggested_fix": "Over time, walk the TODO list and translate each. Low priority.", "references": {}, "discovered_via": "module_review", "tags": ["todo-cluster", "tech-debt", "common"]}, {"id": "BUG-0136", "title": "resetdbobjperms concatenates untrusted object name into ALTER/REVOKE/GRANT — SQL injection", "category": "security", "module": "Admin", "priority": "P2", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.resetdbobjperms(text)", "line_start": 1, "line_end": 1}, "excerpt": "EXECUTE 'ALTER TABLE '   || pObjname || ' OWNER TO ' || getEffectiveXtUser() || ';';\nEXECUTE 'REVOKE ALL ON ' || pObjname || ' FROM PUBLIC;';\nEXECUTE 'GRANT  ALL ON ' || pObjname || ' TO GROUP xtrole;';", "description": "The function interpolates pObjname and the effective xt user directly into three DDL EXECUTE statements with no quote_ident, no regclass cast, and no whitelist check. Any caller able to invoke this (it is owner/definer-style admin plumbing called during package (re)install) can pass a crafted string such as 'public.foo; DROP TABLE x; --' and execute arbitrary SQL with the function's privileges.", "reproduction": "SELECT public.resetdbobjperms('public.foo; CREATE TABLE public.pwned(x int); --');", "impact": "Arbitrary DDL/DML executed with definer privileges; total schema compromise if an attacker can reach this entry point (e.g. via a higher-level procedure that forwards user input).", "suggested_fix": "Cast pObjname via ::regclass once up front, then format the object reference with format('%I.%I', n.nspname, c.relname) and likewise format('%I', getEffectiveXtUser()) for the role. Reject anything that doesn't resolve to a single existing relation.", "references": {}, "discovered_via": "db_function_scan", "tags": ["sql-injection", "ddl", "definer", "admin"]}, {"id": "BUG-0137", "title": "changefkeypointers builds UPDATE with unquoted identifiers and raw integer literals via EXECUTE", "category": "security", "module": "Admin", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.changefkeypointers(text,text,integer,integer,text[],boolean)", "line_start": 1, "line_end": 1}, "excerpt": "EXECUTE 'UPDATE ' || _fk.schemaname || '.' || _fk.tablename || ' SET ' || _fk.attname || '=' || pTargetId || ' WHERE (' || _fk.attname || '=' || pSourceId || ');';", "description": "Schema, table and column names pulled from catalog rows are concatenated into dynamic SQL without quote_ident, and the numeric id parameters are embedded as literal text rather than bound as parameters. If a catalog entry (or the exclusion-list input array) contains mixed-case or reserved-word identifiers the statement breaks; if any catalog poisoning is possible it becomes an injection vector. Adjacent function changepseudofkeypointers suffers the same value-concatenation pattern (it does quote_ident the identifiers but still inlines the ids).", "reproduction": "Create a table public.\"Weird Name\"(id int, crmacct_id int); call changefkeypointers on crmacct_id — the generated UPDATE fails because \"Weird Name\" is emitted unquoted.", "impact": "Merges silently fail on non-ascii/quoted identifiers; elevated injection surface anywhere catalog content is even partially attacker-influenced.", "suggested_fix": "Use format('UPDATE %I.%I SET %I = $1 WHERE %I = $2', _fk.schemaname, _fk.tablename, _fk.attname, _fk.attname) and EXECUTE ... USING pTargetId, pSourceId.", "references": {}, "discovered_via": "db_function_scan", "tags": ["sql-injection", "merge", "dynamic-sql"]}, {"id": "BUG-0138", "title": "copyfinancialgroup concatenates session username into table identifier and values into EXECUTE", "category": "security", "module": "GL", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.copyfinancialgroup(integer,integer,integer)", "line_start": 1, "line_end": 1}, "excerpt": "EXECUTE ' INSERT INTO tmp_flgrpxref' || getEffectiveXtUser() || ' (flgrpxref_oldid, ...) VALUES (' || pSourceGroup || ', ...);';", "description": "The per-user scratch table name tmp_flgrpxref<username> is assembled by text concatenation (no quote_ident), and group id parameters are inlined as literals. If xtuple usernames are ever permitted to contain quotes, dashes, or unicode, this blows up; it is also a direct injection surface if the effective xt user value can be influenced (it ultimately derives from a SET session variable).", "reproduction": "Set an xt user name containing a double-quote or semicolon and call copyfinancialgroup — the EXECUTE produces malformed SQL.", "impact": "Function crashes or executes attacker-controlled SQL under the caller's privileges; also undermines multi-tenant isolation assumptions for the tmp_flgrpxref* naming scheme.", "suggested_fix": "Use format('INSERT INTO %I (flgrpxref_oldid, ...) VALUES ($1, ...)', 'tmp_flgrpxref'||getEffectiveXtUser()) and pass the ids via USING; additionally validate getEffectiveXtUser() against ^[a-zA-Z_][a-zA-Z0-9_]*$.", "references": {}, "discovered_via": "db_function_scan", "tags": ["sql-injection", "dynamic-sql", "financial-report"]}, {"id": "BUG-0139", "title": "deletepackage assembles ALTER TABLE ... DISABLE TRIGGER with raw package/table names", "category": "security", "module": "Admin", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.deletepackage(integer)", "line_start": 1, "line_end": 1}, "excerpt": "EXECUTE 'ALTER TABLE ' || _pkgname || '.pkg' || _tabs[_i] || ' DISABLE TRIGGER pkg' || _tabs[_i] || 'altertrigger;';", "description": "The package name (from pkghead) and per-table suffix are concatenated into DDL without quote_ident. A rogue or malformed pkghead row (e.g. a package name containing whitespace or a quote) can break the uninstall path or inject DDL.", "reproduction": "INSERT a pkghead row with pkghead_name='foo; DROP TABLE public.usr; --' and invoke deletepackage on it.", "impact": "Arbitrary DDL during package uninstall; failed uninstalls that leave orphan triggers.", "suggested_fix": "Validate pkghead_name against [A-Za-z_][A-Za-z0-9_]* on insert AND use format('ALTER TABLE %I.%I DISABLE TRIGGER %I', _pkgname, 'pkg'||_tabs[_i], 'pkg'||_tabs[_i]||'altertrigger') in the EXECUTE.", "references": {}, "discovered_via": "db_function_scan", "tags": ["sql-injection", "ddl", "packages"]}, {"id": "BUG-0140", "title": "merge2crmaccts delete-source uses 'WHERE crmacct = pSourceId' (table name, not column) — source never purged", "category": "data-integrity", "module": "CRM", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.merge2crmaccts(integer,integer,boolean)", "line_start": 1, "line_end": 1}, "excerpt": "DELETE FROM crmacct WHERE crmacct = pSourceId;", "description": "The purge branch uses 'crmacct' (the table name) where it should use 'crmacct_id'. In PostgreSQL this parses as a whole-row reference and the comparison never holds, so when merge2crmaccts is called with pPurge=TRUE the duplicate source account is silently NOT removed. The merge UPDATEs still reassign FKs, so the database is left with an orphan crmacct row that has lost all its children — producing ghost accounts that appear in lookups but have no activity.", "reproduction": "SELECT public.merge2crmaccts(<dup_id>, <keep_id>, TRUE); then SELECT * FROM crmacct WHERE crmacct_id=<dup_id>; the row is still present.", "impact": "Merge operations do not remove the duplicate; CRM list views contain ghost accounts; reports double-count entities if joined carelessly.", "suggested_fix": "Change to DELETE FROM crmacct WHERE crmacct_id = pSourceId; audit for any other 'WHERE <tablename> = <int>' typos.", "references": {}, "discovered_via": "db_function_scan", "tags": ["typo", "merge", "crm", "orphan-rows"]}, {"id": "BUG-0141", "title": "shipshipment updates coitem_qtyshipped without capping at coitem_qtyord — produces over-shipped SO lines", "category": "data-integrity", "module": "Sales", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.shipshipment(integer,timestamp with time zone)", "line_start": 1, "line_end": 1}, "excerpt": "UPDATE coitem\n   SET coitem_qtyshipped = (coitem_qtyshipped + _c._qty)\n WHERE (coitem_id=_c.coitem_id);", "description": "shipshipment increments coitem_qtyshipped by the sum of shipitem rows tied to the shipment with no guard against qtyord, no FOR UPDATE, and no recomputation from shipitem history. In live data this has produced 148 coitem rows where coitem_qtyshipped > coitem_qtyord. Downstream AR, commissions, backorder logic, and close-order flags all use qtyshipped and produce wrong answers.", "reproduction": "SELECT coitem_id, coitem_qtyord, coitem_qtyshipped FROM coitem WHERE coitem_qtyshipped > coitem_qtyord; -- 148 rows currently.", "impact": "Incorrect backorder quantities, incorrect commission accruals, SO lines that appear oversold, ghost negative 'remaining-to-ship' values, and potentially double-billed AR.", "suggested_fix": "Wrap the UPDATE in SELECT ... FOR UPDATE on coitem, recompute coitem_qtyshipped from SUM(shipitem_qty) JOIN shiphead where shiphead_shipped, and RAISE EXCEPTION if the new value would exceed coitem_qtyord (allowing a configurable over-ship tolerance metric). Also backfill-fix the 148 rows.", "references": {}, "discovered_via": "db_data_anomaly", "tags": ["inventory", "shipping", "live-data-anomaly", "missing-invariant"]}, {"id": "BUG-0142", "title": "issuetoshipping creates shipitem rows without validating against remaining qtyord", "category": "data-integrity", "module": "Sales", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.issuetoshipping(text,integer,numeric,integer,timestamp,integer,boolean,boolean)", "line_start": 1, "line_end": 1}, "excerpt": "INSERT INTO shipitem (shipitem_shiphead_id, shipitem_orderitem_id, shipitem_qty, ...)", "description": "issuetoshipping is the primary write path for the shipitem table. It inserts shipitem rows based on the caller's requested qty with no validation that SUM(existing shipitem_qty for unshipped heads) + new qty <= coitem_qtyord - coitem_qtyshipped. Combined with BUG-0141 in shipshipment, this is how coitem_qtyshipped > coitem_qtyord rows get manufactured in the first place.", "reproduction": "Issue-to-shipping more qty than remains on a SO line; no exception is raised at issue time.", "impact": "Allows the over-shipment invariant violation to be introduced; corrupts subsequent shipshipment commit.", "suggested_fix": "Before inserting shipitem, SELECT coitem_qtyord, coitem_qtyshipped FROM coitem WHERE coitem_id=pOrderitemId FOR UPDATE and verify new_ship_qty + already_staged <= qtyord - qtyshipped (+ override metric if configured).", "references": {}, "discovered_via": "db_function_scan", "tags": ["inventory", "shipping", "missing-invariant"]}, {"id": "BUG-0143", "title": "coitem BEFORE INSERT/UPDATE trigger chain does not enforce qtyshipped <= qtyord invariant", "category": "data-integrity", "module": "Sales", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_trigger", "path": "public._soitembeforetrigger", "line_start": 1, "line_end": 1}, "excerpt": "-- _soitembeforetrigger checks coitem_status transitions but not NEW.coitem_qtyshipped > NEW.coitem_qtyord", "description": "PostgreSQL fires multiple BEFORE INSERT/UPDATE triggers on public.coitem in alphabetical order (coitembeforeimptaxtypedef, coitemimportedpoprbeforetrigger, soitembeforetrigger, soitemtrigger). None of them raise when NEW.coitem_qtyshipped > NEW.coitem_qtyord. That leaves shipshipment and issuetoshipping as the only defenders — and both are missing the check.", "reproduction": "UPDATE coitem SET coitem_qtyshipped = coitem_qtyord + 1 WHERE coitem_id=<any>; succeeds.", "impact": "Removes the last defense-in-depth. Any future code path that writes to coitem can repeat the over-shipment bug.", "suggested_fix": "Add to _soitembeforetrigger: IF NEW.coitem_qtyshipped > NEW.coitem_qtyord * (1 + COALESCE(fetchmetricvalue('SOOverShipTolerance'),0)/100.0) THEN RAISE EXCEPTION 'coitem % qtyshipped (%) exceeds qtyord (%)', NEW.coitem_id, NEW.coitem_qtyshipped, NEW.coitem_qtyord; END IF;", "references": {}, "discovered_via": "db_trigger_analysis", "tags": ["triggers", "invariant", "sales-order"]}, {"id": "BUG-0144", "title": "convertquotetoinvoice references nonexistent metric 'enablextcommissionission' — commission branch is dead code", "category": "functional", "module": "Sales", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.convertquotetoinvoice(integer)", "line_start": 1, "line_end": 1}, "excerpt": "IF (fetchMetricBool('enablextcommissionission')) THEN ...", "description": "The metric name is 'enablextcommission' everywhere else in the schema; here it is mangled to 'enablextcommissionission' (double '-ission' suffix, obvious copy-paste accident). fetchMetricBool returns FALSE for unknown metrics, so the entire xt-commission code path inside quote-to-invoice conversion is unreachable. Customers running xt-commission will silently get no commission rows on quote-originated invoices.", "reproduction": "SELECT * FROM metric WHERE metric_name LIKE 'enablextcommission%'; — only 'enablextcommission' exists.", "impact": "Silent loss of commission tracking on every quote-to-invoice conversion.", "suggested_fix": "Rename the literal to 'enablextcommission' and add a grep/CI check for misspelled fetchMetricBool literals.", "references": {}, "discovered_via": "db_function_scan", "tags": ["typo", "metrics", "commissions", "dead-code"]}, {"id": "BUG-0145", "title": "convertprospecttocustomer wraps quote conversion in EXCEPTION WHEN OTHERS — swallows real errors", "category": "functional", "module": "CRM", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.convertprospecttocustomer(integer,boolean)", "line_start": 1, "line_end": 1}, "excerpt": "EXCEPTION WHEN OTHERS THEN\n  RAISE WARNING 'Ignored errors convering quotes: % %', SQLSTATE, SQLERRM;", "description": "The loop that converts associated quotes is wrapped in a bare EXCEPTION WHEN OTHERS that degrades every failure to a RAISE WARNING and continues. This hides constraint violations, deadlocks, OOM, and permission errors from callers. The warning text also contains 'convering' for 'converting' — a second indicator the block is copy-pasted boilerplate that nobody reviewed.", "reproduction": "Force a quote-conversion failure (e.g. revoke insert on cohead for the calling role) and call convertprospecttocustomer — the function returns success anyway.", "impact": "Data drift: prospect->customer conversions report success even when downstream quote conversions fail; operations discover the missing records hours or days later.", "suggested_fix": "Remove the bare exception block or narrow it to the specific exception classes you want to tolerate (e.g. unique_violation). Fix the 'convering' typo.", "references": {}, "discovered_via": "db_function_scan", "tags": ["exception-handling", "silent-failure", "typo"]}, {"id": "BUG-0146", "title": "public.isdate silently classifies malformed input as not-a-date by swallowing all exceptions", "category": "tech-debt", "module": "Common", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.isdate(varchar)", "line_start": 1, "line_end": 1}, "excerpt": "BEGIN\n  PERFORM s::date;\n  RETURN true;\nEXCEPTION WHEN others THEN\n  RETURN false;\nEND;", "description": "isdate catches every exception class (including out_of_memory, deadlock_detected, query_canceled, serialization_failure) and returns FALSE. For an isX-style predicate this is almost tolerable, but it hides real operational errors and prevents cancellation from propagating.", "reproduction": "N/A — behavioural.", "impact": "Cancelled queries and transient infra errors are re-encoded as 'not a date', hiding operational problems.", "suggested_fix": "Narrow the handler to EXCEPTION WHEN invalid_datetime_format OR datetime_field_overflow OR invalid_text_representation THEN RETURN false.", "references": {}, "discovered_via": "db_function_scan", "tags": ["exception-handling", "silent-failure"]}, {"id": "BUG-0147", "title": "wgs.to_int_cleanly swallows every exception class", "category": "tech-debt", "module": "WGS", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.to_int_cleanly(text)", "line_start": 1, "line_end": 1}, "excerpt": "BEGIN\n  RETURN txt::INTEGER;\n  EXCEPTION WHEN OTHERS THEN RETURN NULL;\nEND", "description": "Same pattern as public.isdate. This helper is used in report and import paths to turn 'maybe-an-int' strings into ints; EXCEPTION WHEN OTHERS converts admin cancellations and infrastructure failures into silent NULLs.", "reproduction": "N/A — behavioural.", "impact": "Imports that should stop on infra failure instead produce NULL-populated rows.", "suggested_fix": "Narrow to WHEN invalid_text_representation OR numeric_value_out_of_range.", "references": {}, "discovered_via": "wgs_review", "tags": ["exception-handling", "silent-failure", "wgs"]}, {"id": "BUG-0148", "title": "wgs.base26_to_int integer overflow — author-acknowledged in comment, still unguarded", "category": "tech-debt", "module": "WGS", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.base26_to_int(text)", "line_start": 1, "line_end": 1}, "excerpt": "-- author comment: 'If the string is too long (or, a larger value than \"GYTISYX\", which is 2147483647) it crashes due to integer overflow.'\n_accum := _accum * 26;", "description": "The function's own inline comment acknowledges that inputs longer than 7 chars (or > 'GYTISYX') overflow a 4-byte integer and raise. Nothing in the function tests LENGTH(txt) before the multiplication loop, so callers must remember to validate upstream. Any future caller that forgets will surface a raw numeric_value_out_of_range to the client.", "reproduction": "SELECT wgs.base26_to_int('AAAAAAAA'); -- 8 chars -> overflow.", "impact": "User-facing errors on over-long inputs; no graceful NULL/false fallback.", "suggested_fix": "Either widen the arithmetic to BIGINT/NUMERIC internally, or raise a domain-specific exception early ('base26 input must be <= 7 chars'). Add a companion try-form that returns NULL instead of raising.", "references": {}, "discovered_via": "wgs_review", "tags": ["overflow", "robustness", "author-acknowledged", "wgs"]}, {"id": "BUG-0149", "title": "explodewo phantom BOM expansion loop has no depth guard — infinite loop risk on cyclic phantom components", "category": "functional", "module": "Mfg", "priority": "P1", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.explodewo(integer,boolean)", "line_start": 1, "line_end": 1}, "excerpt": "WHILE EXISTS ( SELECT 1 FROM womatl JOIN itemsite ... JOIN item ...\n               WHERE (womatl_wo_id=pWoid) AND (item_type='F') ) LOOP\n  FOR _p IN ... LOOP\n    INSERT INTO womatl ...\n    DELETE FROM womatl WHERE (womatl_id=_p.womatl_id);\n  END LOOP;\nEND LOOP;", "description": "The outer WHILE re-tests for any phantom (item_type='F') remaining on the work order. If any BOM defines a phantom whose expansion (directly or transitively) re-introduces a phantom child — even via data entry error — the loop never terminates. There is no max-depth counter, no seen-item set, and no timeout.", "reproduction": "Construct an item A (type='F') whose BOM contains item B (type='F') whose BOM contains item A. Call explodewo on a WO that uses A — it spins until statement_timeout or out-of-memory.", "impact": "A single malformed BOM can hang the back-end thread used for WO release, blocking manufacturing throughput; in the worst case it can exhaust work_mem / transaction memory.", "suggested_fix": "Introduce an integer depth counter initialized to 0, increment inside the outer WHILE, and RAISE EXCEPTION 'cyclic phantom BOM detected for WO %' after e.g. 50 iterations; ideally also detect cycles explicitly via a WITH RECURSIVE cycle check before starting the expansion.", "references": {}, "discovered_via": "db_function_scan", "tags": ["recursion", "manufacturing", "bom", "infinite-loop"]}, {"id": "BUG-0150", "title": "wgs.get_subcomps_with_subcomps WITH RECURSIVE has no cycle detection", "category": "functional", "module": "WGS", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.get_subcomps_with_subcomps(integer)", "line_start": 1, "line_end": 1}, "excerpt": "WITH RECURSIVE subcomps AS (\n  SELECT ... FROM bomitem WHERE bomitem_parent_item_id = $1\n  UNION ALL\n  SELECT ... FROM bomitem b JOIN subcomps s ON b.bomitem_parent_item_id = s.child_item_id\n) ...", "description": "The CTE does a UNION ALL with no 'NOT EXISTS' cycle guard and no CYCLE clause. A circular BOM (A->B->A, possible on items not marked phantom) makes the query run until statement_timeout. Unlike explodewo, this is a read-only report, but the effect on pg_stat_activity and connection pressure is the same.", "reproduction": "Seed two bomitem rows making item A a descendant of its own BOM and SELECT * FROM wgs.get_subcomps_with_subcomps(<A>);", "impact": "Reports or UI calls hang indefinitely; idle-in-transaction snowballing.", "suggested_fix": "Add WITH RECURSIVE ... CYCLE child_item_id SET is_cycle USING path (PG 14+), or emulate by carrying an array path and filtering 'AND NOT (b.bomitem_component_item_id = ANY(s.path))'.", "references": {}, "discovered_via": "wgs_review", "tags": ["recursion", "cte", "bom", "wgs"]}, {"id": "BUG-0151", "title": "wgs.determine_shipto_id uses permanent tables named *_temp — concurrent callers race on shared state", "category": "functional", "module": "WGS", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.determine_shipto_id(integer)", "line_start": 1, "line_end": 1}, "excerpt": "DELETE FROM wgs.namescores_temp;\nINSERT INTO wgs.namescores_temp ...\nDELETE FROM wgs.potentials_temp;\nINSERT INTO wgs.potentials_temp ...", "description": "The function DELETEs and INSERTs into two *_temp tables that are schema-qualified permanent tables (confirmed via pg_class), not PostgreSQL TEMP tables. Two concurrent invocations (two users, two workers, or the same user triggering parallel UI paths) race: session A's DELETE wipes session B's staged rows mid-computation, yielding wrong shipto_id assignments.", "reproduction": "Run two concurrent SELECT wgs.determine_shipto_id(<different orders>); calls from two psql sessions and observe that at least one returns NULL or the other session's match.", "impact": "Wrong shipto assignment on orders processed concurrently; silent data corruption that propagates into shipping labels and AR.", "suggested_fix": "Replace wgs.namescores_temp and wgs.potentials_temp with CREATE TEMP TABLE ... ON COMMIT DROP inside the function, or rewrite the whole routine as CTE / subqueries so no intermediate table is needed.", "references": {}, "discovered_via": "wgs_review", "tags": ["concurrency", "shared-state", "race-condition", "shipping", "wgs"]}, {"id": "BUG-0152", "title": "wgs.pull_emails vs wgs.pull_emails_nowampler — near-identical copy-paste duplicate (only domain filter differs)", "category": "tech-debt", "module": "WGS", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.pull_emails / wgs.pull_emails_nowampler", "line_start": 1, "line_end": 1}, "excerpt": "-- nowampler differs by: IF (_good AND (_posttxt <> 'wamplerpedals.com'))", "description": "Two 6+KB functions with only one additional predicate in the variant. Any bug fixed in one will miss the other. The naming convention ('nowampler') also encodes a business rule into the function name — schema rot waiting to happen.", "reproduction": "Diff the two function bodies.", "impact": "Maintenance hazard; future parser fixes will drift between the two.", "suggested_fix": "Collapse to a single wgs.pull_emails(text, text, _exclude_domains text[] default '{}') and make the variant a thin wrapper or drop it.", "references": {}, "discovered_via": "wgs_review", "tags": ["duplication", "maintainability", "wgs"]}, {"id": "BUG-0153", "title": "wgs.clean_shipcomments vs wgs.clean_shipcomments2 — divergent duplicates with different behavior", "category": "tech-debt", "module": "WGS", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.clean_shipcomments / wgs.clean_shipcomments2", "line_start": 1, "line_end": 1}, "excerpt": "-- v1: simple concat / strip\n-- v2: sort-by-scanner parsing, multi-line reconstruction", "description": "Two same-named-prefix functions that do substantively different things: v1 is a minimal prettifier, v2 does full scanner-aware reconstruction. Neither calls the other, and there is no docstring indicating which is canonical. Callers across the codebase likely pick one at random based on who copied last.", "reproduction": "Grep the wgs codebase for 'clean_shipcomments' usages and observe split adoption.", "impact": "Inconsistent shipping comment output on paperwork; bug fixes applied to the wrong variant silently fail.", "suggested_fix": "Pick a canonical implementation (likely v2), make the other a thin wrapper or drop it, and document which is preferred.", "references": {}, "discovered_via": "wgs_review", "tags": ["duplication", "maintainability", "shipping", "wgs"]}, {"id": "BUG-0154", "title": "voidpostedcheck reads checkhead/apopen/aropen without FOR UPDATE — concurrent void/apply race", "category": "data-integrity", "module": "AP", "priority": "P2", "severity": "high", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.voidpostedcheck(integer,integer,date)", "line_start": 1, "line_end": 1}, "excerpt": "SELECT checkhead_amount, checkhead_curr_rate ... FROM checkhead WHERE checkhead_id = pCheckid;\n-- later: UPDATE apopen SET apopen_paid = apopen_paid - ... ;", "description": "voidpostedcheck reads the check amount, its apopen/aropen links, and the GL balances, then writes reversing gltrans and updates apopen/aropen paid totals. None of the source rows are locked with FOR UPDATE. Two concurrent voids on the same check (e.g. two users who both clicked 'Void' during a UI retry) can both pass the 'already voided?' check and both post reversals. Same class of risk for concurrent 'apply payment' happening mid-void.", "reproduction": "Behavioural; contrived race would require two simultaneous UI clicks. Difficult to reproduce deterministically without fault injection.", "impact": "Double-reversed GL posting, double-adjusted apopen_paid, out-of-balance AP aging.", "suggested_fix": "SELECT ... FROM checkhead WHERE checkhead_id=pCheckid FOR UPDATE at function entry; also lock associated apopen/aropen rows before mutation.", "references": {}, "discovered_via": "db_function_scan", "tags": ["concurrency", "locking", "ap", "ar"]}, {"id": "BUG-0155", "title": "voidpostedcheck divides by checkhead_curr_rate without NULLIF guard — div-by-zero risk", "category": "functional", "module": "AP", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.voidpostedcheck(integer,integer,date)", "line_start": 1, "line_end": 1}, "excerpt": "... checkhead_amount / checkhead_curr_rate ...", "description": "The function computes base-currency equivalents using checkhead_curr_rate as a denominator without a CASE/NULLIF guard. A zero or NULL rate (possible on legacy imported rows or on currencies with temporarily missing rates) raises division_by_zero or returns NULL silently, depending on whether the divide is in arithmetic or in a COALESCE chain.", "reproduction": "UPDATE checkhead SET checkhead_curr_rate=0 WHERE checkhead_id=<any>; SELECT voidpostedcheck(<id>, 0, current_date);", "impact": "Void fails with a raw division_by_zero, or (worse) posts with NULL amounts that trigger downstream constraint failures in gltrans.", "suggested_fix": "Replace '/ checkhead_curr_rate' with '/ NULLIF(checkhead_curr_rate, 0)' and RAISE EXCEPTION if the rate is zero/NULL.", "references": {}, "discovered_via": "db_function_scan", "tags": ["division-by-zero", "currency", "robustness", "ap"]}, {"id": "BUG-0156", "title": "voidapopenvoucher updates recv_invoiced / poitem_qty_vouchered without locking source rows", "category": "data-integrity", "module": "AP", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.voidapopenvoucher(integer,integer,date)", "line_start": 1, "line_end": 1}, "excerpt": "UPDATE recv SET recv_invoiced = FALSE ...;\nUPDATE poitem SET poitem_qty_vouchered = (poitem_qty_vouchered - ...) ...;", "description": "The function decrements poitem_qty_vouchered and flips recv_invoiced back to FALSE without first SELECT ... FOR UPDATE on those rows. A concurrent 'create voucher' (which reads and increments qty_vouchered) can race with a void, ending up with negative qty_vouchered or a received-but-still-invoiced row after both finish.", "reproduction": "Behavioural; concurrent voucher/void on the same PO.", "impact": "AP integrity drift: negative qty_vouchered values, orphan recv rows stuck as invoiced.", "suggested_fix": "Lock related recv and poitem rows FOR UPDATE before mutating them; alternatively wrap the void in an advisory lock keyed to pohead_id.", "references": {}, "discovered_via": "db_function_scan", "tags": ["concurrency", "locking", "ap"]}, {"id": "BUG-0157", "title": "createpurchasetosale has no FOR UPDATE on pohead when matching existing open POs", "category": "data-integrity", "module": "Purchasing", "priority": "P3", "severity": "medium", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.createpurchasetosale", "line_start": 1, "line_end": 1}, "excerpt": "SELECT pohead_id FROM pohead WHERE pohead_vend_id = ... AND pohead_status='U' ... ;", "description": "The function selects an open PO for a vendor to append a new poitem, but does not SELECT ... FOR UPDATE. Two concurrent SO->PO auto-link operations can both select the same pohead, both insert poitems, and produce double ordering if downstream dedup is missing. Similar pattern exists for auto-linking to open voitem/apopen rows.", "reproduction": "Behavioural; concurrent 'Release SO' on two SOs pointing at the same vendor.", "impact": "Double-inserted poitems; vendor receives duplicate lines.", "suggested_fix": "SELECT ... FROM pohead ... FOR UPDATE SKIP LOCKED when auto-selecting a target PO.", "references": {}, "discovered_via": "db_function_scan", "tags": ["concurrency", "locking", "purchasing"]}, {"id": "BUG-0158", "title": "calcshipfreight compares boolean to text literal 'true'", "category": "tech-debt", "module": "Sales", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.calcshipfreight(integer)", "line_start": 1, "line_end": 1}, "excerpt": "WHERE shiphead_shipped = 'true'", "description": "shiphead_shipped is a boolean. The literal 'true' (quoted) works today via implicit text->bool cast, but this prevents index usage on the column and will break under strict SQL mode or if the column is ever changed to an enum. A subtle correctness+performance drag.", "reproduction": "EXPLAIN SELECT ... FROM shiphead WHERE shiphead_shipped='true'; vs the same with = TRUE — the cast is visible in the plan.", "impact": "Potential seq-scan on shiphead_shipped; fragile under schema migrations.", "suggested_fix": "Change to WHERE shiphead_shipped = TRUE (or WHERE shiphead_shipped, since it's a bool).", "references": {}, "discovered_via": "db_function_scan", "tags": ["type-coercion", "style", "performance"]}, {"id": "BUG-0159", "title": "calculatetaxdetailsummary rounds line amounts to 2 decimals before tax calc — penny-rounding accumulation", "category": "functional", "module": "Tax", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.calculatetaxdetailsummary", "line_start": 1, "line_end": 1}, "excerpt": "ROUND((coitem_qtyord * coitem_qty_invuomratio) * (coitem_price / coitem_price_invuomratio), 2) AS amount", "description": "The summary function rounds each line's extended amount to 2 decimals BEFORE passing to calculateTaxDetail. For multi-line orders whose unit prices end in fractional pennies (common with uom conversion ratios), each line contributes up to $0.005 rounding error. Over a large invoice this can drift the tax total by several cents versus the per-invoice single-round approach.", "reproduction": "Construct an order with 100 lines whose true extended amount is $X.XX5 each; compare calculatetaxdetailsummary output against manual SUM(amount)*rate.", "impact": "Occasional 1-N cent mismatch between the tax total on the printed invoice and the amount reported to the tax authority; audit fodder.", "suggested_fix": "Pass the unrounded amount to calculateTaxDetail and round only once at the summary level, or use numeric(18,6) throughout and round only at display time.", "references": {}, "discovered_via": "db_function_scan", "tags": ["rounding", "tax", "financial"]}, {"id": "BUG-0160", "title": "financialreport accumulates NULL into grand total — silently NULLs entire report footer", "category": "functional", "module": "GL", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.financialreport(integer,integer[],character,boolean,integer)", "line_start": 1, "line_end": 1}, "excerpt": "_grndttl := _grndttl + _n;", "description": "The accumulator is incremented in a loop where _n is produced by a CASE expression with several WHEN branches that yield NULL (e.g. sign flip on a missing account, or when a row has no flitem_type match). A single NULL turns _grndttl into NULL for the rest of the report. There is no COALESCE on either side of the addition.", "reproduction": "Build a financial layout that maps to an account with no postings in the period and generate the report — grand total goes NULL.", "impact": "Financial statements silently print NULL or 0.00 at the bottom instead of a correct total; audit and management reporting impact.", "suggested_fix": "Change to _grndttl := _grndttl + COALESCE(_n, 0); verify all CASE branches explicitly return 0 instead of NULL when that's the intended accounting meaning.", "references": {}, "discovered_via": "db_function_scan", "tags": ["null-handling", "financial-report", "accumulator", "gl"]}, {"id": "BUG-0161", "title": "wgs.wordwrap outer loop can infinite-loop on pathological input", "category": "tech-debt", "module": "WGS", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.wordwrap(text,integer)", "line_start": 1, "line_end": 1}, "excerpt": "WHILE LENGTH(intext) > 0 LOOP\n  ...\n  intext := SUBSTR(intext, e + 1);\nEND LOOP;", "description": "The outer loop terminates only when LENGTH(intext)=0, relying on e>=1 each iteration. The search for the next break point uses a STRPOS/REGEX combo that can return 0 on pathological inputs (e.g. a run of NULs or a single multibyte grapheme in a sub-byte width limit). A zero-progress iteration loops forever.", "reproduction": "Behavioural; would require constructing an input that makes the break search return 0 despite LENGTH>0.", "impact": "Unlikely in production text but a latent bug; statement_timeout will eventually save the session.", "suggested_fix": "Add an 'IF e <= 0 THEN EXIT; END IF;' guard (after emitting the remaining text) and an iteration counter.", "references": {}, "discovered_via": "wgs_review", "tags": ["loop-termination", "robustness", "wgs"]}, {"id": "BUG-0162", "title": "returnshipmenttransaction deletes shipitem/shiphead without row-level locking", "category": "data-integrity", "module": "Sales", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "public.returnshipmenttransaction(integer,integer,timestamp)", "line_start": 1, "line_end": 1}, "excerpt": "DELETE FROM shipitem WHERE ... ;\nDELETE FROM shiphead WHERE NOT EXISTS (SELECT 1 FROM shipitem WHERE shipitem_shiphead_id = shiphead_id);", "description": "The function deletes shipitem rows and then deletes the parent shiphead via NOT EXISTS. It does not lock shiphead or shipitem rows first. A concurrent 'issue-to-shipping' can insert a new shipitem between the inner DELETE and the outer DELETE, racing the NOT EXISTS decision and leaving either an orphan shipitem (if the shiphead goes away first) or a half-returned shipment (if the new shipitem survives).", "reproduction": "Behavioural; concurrent returnshipmenttransaction and issuetoshipping on the same shiphead_id.", "impact": "Orphan shipitem rows or partial-return shipheads; reconciliation headaches downstream.", "suggested_fix": "SELECT ... FROM shiphead WHERE shiphead_id = ... FOR UPDATE at function entry, then do the child-then-parent delete inside that lock.", "references": {}, "discovered_via": "db_function_scan", "tags": ["concurrency", "locking", "shipping", "returns"]}, {"id": "BUG-0163", "title": "changepseudofkeypointers inlines integer parameters into dynamic SQL despite quote_ident on identifiers", "category": "security", "module": "Admin", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.changepseudofkeypointers(text,text,integer,integer,text[])", "line_start": 1, "line_end": 1}, "excerpt": "EXECUTE 'UPDATE ' || quote_ident(...) || '.' || quote_ident(...) || ' SET ' || quote_ident(...) || '=' || pTargetId || ' ...';", "description": "This sibling of changefkeypointers correctly uses quote_ident on schema/table/column but still concatenates pSourceId and pTargetId as bare text into the EXECUTE. Today they are declared INTEGER so the injection surface is nil, but if the function signature is ever widened (e.g. to support UUID pkeys or string-shaped pseudo-keys), the inlined values become a live SQL injection vector.", "reproduction": "N/A — preventative.", "impact": "Latent injection if type signature evolves; style inconsistency with the rest of the PG codebase which uses USING.", "suggested_fix": "Switch to format('UPDATE %I.%I SET %I = $1 WHERE %I = $2', ...) + EXECUTE ... USING pTargetId, pSourceId.", "references": {}, "discovered_via": "db_function_scan", "tags": ["sql-injection", "dynamic-sql", "style", "admin"]}, {"id": "BUG-0164", "title": "wgs.int_to_base26 returns empty string for NULL and 0 (instead of NULL / 'A')", "category": "tech-debt", "module": "WGS", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": true, "location": {"type": "db_function", "path": "wgs.int_to_base26(integer)", "line_start": 1, "line_end": 1}, "excerpt": "IF i < 0 THEN RAISE EXCEPTION ... END IF;\n-- no IF i IS NULL branch; loop 'WHILE i > 0' exits immediately, returns ''", "description": "Passing NULL returns '' (empty string) because the WHILE i > 0 predicate is NULL (treated as false) and the accumulator starts at ''. Passing 0 similarly returns '' rather than 'A'. Callers that expect a NULL->NULL passthrough or a canonical zero encoding will silently mis-encode.", "reproduction": "SELECT wgs.int_to_base26(NULL); -- returns '' instead of NULL. SELECT wgs.int_to_base26(0); -- returns ''.", "impact": "Downstream joins on empty-string base26 keys can false-match each other; NULL semantics lost.", "suggested_fix": "At the top: IF i IS NULL THEN RETURN NULL; END IF; IF i = 0 THEN RETURN 'A'; END IF; (or document the zero convention explicitly).", "references": {}, "discovered_via": "wgs_review", "tags": ["null-handling", "encoding", "wgs"]}, {"id": "BUG-0165", "title": "'convering' typo in RAISE WARNING string hides log searches for conversion errors", "category": "tech-debt", "module": "Sales", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "path": "public.convertprospecttocustomer(integer,boolean)", "line_start": 1, "line_end": 1}, "excerpt": "RAISE WARNING 'Ignored errors convering quotes: % %', SQLSTATE, SQLERRM;", "description": "Companion to BUG-0151 and BUG-0150 — the same block that swallows exceptions has the typo 'convering' instead of 'converting' in the warning message. grep on the PG log for 'converting' misses these entries; operators looking for ignored-quote-conversion events will miss them.", "reproduction": "grep the xtuple log for 'convering'.", "impact": "Log searches miss real error instances; developer time wasted.", "suggested_fix": "Replace 'convering' with 'converting' throughout the xtuple codebase.", "references": {}, "discovered_via": "db_function_scan", "tags": ["typo", "logging", "cosmetic"]}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('audit-data').textContent);
const BUGS = DATA.bugs;
const META = DATA.meta;
const PRIO_ORDER = {P0: 0, P1: 1, P2: 2, P3: 3};
const CONF_ORDER = {confirmed: 0, likely: 1, suspected: 2};

function uniqSorted(key) {
  return [...new Set(BUGS.map(b => b[key]))].sort();
}

function fillSelect(id, values, label) {
  const sel = document.getElementById(id);
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  }
}

fillSelect('priorityFilter', uniqSorted('priority'));
fillSelect('moduleFilter', uniqSorted('module'));
fillSelect('categoryFilter', uniqSorted('category'));
fillSelect('confidenceFilter', uniqSorted('confidence'));

function renderHeaderStats() {
  document.getElementById('totalCount').textContent = '(' + BUGS.length + ' entries)';
  document.getElementById('updatedAt').textContent = 'Updated: ' + (META.updated_at || 'unknown');
  const pc = document.getElementById('priorityChips');
  const pcCounts = META.counts_by_priority || {};
  for (const p of ['P0', 'P1', 'P2', 'P3']) {
    if (pcCounts[p] == null) continue;
    const el = document.createElement('span');
    el.className = 'chip ' + p.toLowerCase();
    el.textContent = p + ': ' + pcCounts[p];
    pc.appendChild(el);
  }
  const bar = document.getElementById('priorityBar');
  const total = BUGS.length;
  for (const p of ['P0', 'P1', 'P2', 'P3']) {
    const n = pcCounts[p] || 0;
    if (n === 0) continue;
    const seg = document.createElement('div');
    seg.className = 'bar ' + p.toLowerCase();
    seg.style.width = (100 * n / total) + '%';
    seg.title = p + ': ' + n;
    bar.appendChild(seg);
  }
  const cc = document.getElementById('confChips');
  const ccCounts = META.counts_by_confidence || {};
  for (const c of ['confirmed', 'likely', 'suspected']) {
    if (ccCounts[c] == null) continue;
    const el = document.createElement('span');
    el.className = 'chip n';
    el.innerHTML = '<span class="conf-dot ' + c + '"></span>' + c + ': ' + ccCounts[c];
    cc.appendChild(el);
  }
}
renderHeaderStats();

let sortKey = 'id';
let sortDir = 'asc';
let openRow = null;

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function matchFilters(b) {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if (q) {
    const hay = [b.id, b.title, b.excerpt, b.description, b.tags ? b.tags.join(' ') : ''].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const p = document.getElementById('priorityFilter').value;
  if (p && b.priority !== p) return false;
  const m = document.getElementById('moduleFilter').value;
  if (m && b.module !== m) return false;
  const c = document.getElementById('categoryFilter').value;
  if (c && b.category !== c) return false;
  const cf = document.getElementById('confidenceFilter').value;
  if (cf && b.confidence !== cf) return false;
  if (document.getElementById('hideKnown').checked && b.known_preexisting) return false;
  return true;
}

function cmpVal(a, b, key) {
  if (key === 'priority') return (PRIO_ORDER[a.priority] ?? 99) - (PRIO_ORDER[b.priority] ?? 99);
  if (key === 'confidence') return (CONF_ORDER[a.confidence] ?? 99) - (CONF_ORDER[b.confidence] ?? 99);
  const va = String(a[key] ?? '').toLowerCase();
  const vb = String(b[key] ?? '').toLowerCase();
  if (va < vb) return -1;
  if (va > vb) return 1;
  return 0;
}

function renderTable() {
  const filtered = BUGS.filter(matchFilters);
  filtered.sort((a, b) => {
    const c = cmpVal(a, b, sortKey);
    return sortDir === 'asc' ? c : -c;
  });

  document.getElementById('countLine').textContent =
    'Showing ' + filtered.length + ' of ' + BUGS.length + ' entries.';
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('emptyNote').style.display = filtered.length ? 'none' : 'block';

  for (const b of filtered) {
    const tr = document.createElement('tr');
    tr.className = 'row';
    tr.dataset.id = b.id;
    tr.innerHTML =
      '<td class="id-cell">' + escapeHtml(b.id) + '</td>' +
      '<td><span class="chip ' + b.priority.toLowerCase() + '">' + escapeHtml(b.priority) + '</span></td>' +
      '<td class="mod-cell">' + escapeHtml(b.module) + '</td>' +
      '<td class="cat-cell">' + escapeHtml(b.category) + '</td>' +
      '<td><span class="conf-dot ' + b.confidence + '"></span>' + escapeHtml(b.confidence) + '</td>' +
      '<td class="title-cell">' + escapeHtml(b.title) +
      (b.known_preexisting ? '<span class="known-tag">known</span>' : '') +
      '</td>';
    tr.addEventListener('click', () => toggleRow(tr, b));
    tbody.appendChild(tr);
  }

  // Update th sort indicators
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.classList.remove('sorted', 'desc');
    if (th.dataset.sort === sortKey) {
      th.classList.add('sorted');
      if (sortDir === 'desc') th.classList.add('desc');
    }
  });
}

function toggleRow(tr, b) {
  if (openRow && openRow.parentNode === tr.parentNode && openRow.previousSibling === tr) {
    openRow.remove();
    openRow = null;
    return;
  }
  if (openRow) openRow.remove();
  const dr = document.createElement('tr');
  dr.className = 'detail';
  const loc = b.location || {};
  const locStr = loc.path ? (loc.path + (loc.line_start ? ':' + loc.line_start + (loc.line_end && loc.line_end !== loc.line_start ? '-' + loc.line_end : '') : '')) : '(no location)';
  const refs = b.references && typeof b.references === 'object'
    ? Object.entries(b.references).map(([k, v]) => escapeHtml(k) + ': ' + escapeHtml(v)).join('<br>')
    : '';
  const tags = (b.tags || []).map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join(' ');

  dr.innerHTML =
    '<td colspan="6">' +
      '<dl class="detail-grid">' +
        '<dt>Location</dt><dd><span class="location-path">' + escapeHtml(locStr) + '</span> <span style="color: var(--fg-dim)">(type: ' + escapeHtml(loc.type || '?') + ')</span></dd>' +
        '<dt>Severity</dt><dd>' + escapeHtml(b.severity) + '</dd>' +
        '<dt>Excerpt</dt><dd><pre>' + escapeHtml(b.excerpt) + '</pre></dd>' +
        '<dt>Description</dt><dd>' + escapeHtml(b.description) + '</dd>' +
        '<dt>Reproduction</dt><dd><pre>' + escapeHtml(b.reproduction) + '</pre></dd>' +
        '<dt>Impact</dt><dd>' + escapeHtml(b.impact) + '</dd>' +
        '<dt>Suggested fix</dt><dd>' + escapeHtml(b.suggested_fix) + '</dd>' +
        (refs ? '<dt>References</dt><dd>' + refs + '</dd>' : '') +
        '<dt>Tags</dt><dd><div class="tag-list">' + tags + '</div></dd>' +
        '<dt>Discovered via</dt><dd>' + escapeHtml(b.discovered_via || '') + '</dd>' +
      '</dl>' +
    '</td>';
  tr.after(dr);
  openRow = dr;
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = k; sortDir = 'asc'; }
    renderTable();
  });
});

['searchBox', 'priorityFilter', 'moduleFilter', 'categoryFilter', 'confidenceFilter', 'hideKnown'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderTable);
  document.getElementById(id).addEventListener('change', renderTable);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('searchBox').value = '';
  document.getElementById('priorityFilter').value = '';
  document.getElementById('moduleFilter').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('confidenceFilter').value = '';
  document.getElementById('hideKnown').checked = false;
  sortKey = 'id'; sortDir = 'asc';
  renderTable();
});

renderTable();
</script>
</body>
</html>
