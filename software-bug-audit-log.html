ERE gltrans_docnumber=... GROUP BY gltrans_sequence; Observed: misc -5.00 is in invchead/cohist but no GL row booked against the misc revenue/expense account. Expected: one debit and one credit for -5.00 like a positive misc charge.", "impact": "GL total revenue (and A/R offset) diverges from invchead/cohist totals by the sum of negative misc charges. Financial reports reconciled to cohist and to gltrans will disagree. Audit trail broken.", "suggested_fix": "Change `IF (_amount > 0)` to `IF (_amount != 0)` on the misc-charge branch to match the regular line-item branch. Verify with a grep for all `IF (_amount` comparisons in postinvoice to find siblings of this mistake.", "references": {}, "discovered_via": "module_review", "tags": ["financial", "gl-imbalance", "asymmetric-branch", "misc-charge"]}, {"id": "BUG-0050", "title": "postInvoice has hardcoded `IF TRUE THEN ... ELSE ...` with dead else-branch", "category": "tech-debt", "module": "AR", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.postinvoice(integer, integer, integer, boolean)"}, "excerpt": "-- leave this condition TRUE until we make this configurable (xtuple issue 3892)\nIF TRUE THEN\n  _firstExchDate := _p.invchead_invcdate;\nELSE\n  ...\nEND IF;", "description": "Placeholder control flow: IF TRUE THEN always selects the first branch, making the else-branch dead code. Referenced as xTuple issue 3892 ('configurable exchange-rate date source'). Not a live bug today but code-rot risk.", "reproduction": "Static review.", "impact": "Multi-currency exchange-rate date for the invoice is always locked to invchead_invcdate, regardless of what the comment suggests was intended.", "suggested_fix": "Make the choice a metric / configuration lookup, or delete the else-branch and the IF. File a deletion PR referencing upstream 3892.", "references": {}, "discovered_via": "module_review", "tags": ["dead-code", "tech-debt", "fx-date"]}, {"id": "BUG-0051", "title": "postInvoice contains explicit no-op assignments `_totalAmount := _totalAmount`", "category": "tech-debt", "module": "AR", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.postinvoice(integer, integer, integer, boolean)"}, "excerpt": "_totalAmount := _totalAmount;\n_totalRoundedBase := _totalRoundedBase;", "description": "After the line-item loop, two self-assignments appear with no effect. Likely debris from a refactor where the right-hand side used to be a different expression (perhaps `_totalAmount + _miscTotal`). Worth inspecting git blame for whether logic was accidentally deleted.", "reproduction": "Static review.", "impact": "None at runtime; but suspicious — may indicate dropped logic that should have accumulated into totals.", "suggested_fix": "Trace git blame to confirm intent. If truly a no-op, delete. If a sum was intended, restore the missing term.", "references": {}, "discovered_via": "module_review", "tags": ["dead-code", "tech-debt", "suspicious-refactor-debris"]}, {"id": "BUG-0052", "title": "postInvoice has unresolved `-- ToDo: handle rounding errors` before currGain calc", "category": "financial", "module": "AR", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.postinvoice(integer, integer, integer, boolean)"}, "excerpt": "-- ToDo: handle rounding errors\n_currGain := ...;", "description": "Multi-currency invoice posting carries a pending TODO at the currency-gain/loss calculation step. Line items are rounded to 2 decimal places at different exchange rates and summed, producing accumulation error that is absorbed into currGain. On invoices with many lines and volatile FX, the unexplained penny differences can reach material amounts.", "reproduction": "Post a 50-line invoice in a non-base currency with a mid-month FX rate change. Sum (invoice_total_base) vs. sum of per-line rounded base amounts. The delta is absorbed by the currGain row.", "impact": "FX-gain/loss GL account accumulates rounding noise that looks like real currency variance. Reports grouped by currGain are misleading for treasury.", "suggested_fix": "Compute base-currency totals before per-line rounding, or compute the rounding delta separately and book it to a dedicated `rounding_adjustment` account rather than currGain.", "references": {}, "discovered_via": "module_review", "tags": ["financial", "rounding", "fx", "todo"]}, {"id": "BUG-0053", "title": "shipShipment uses `_timestamp::DATE` for GL date — timezone-dependent posting", "category": "data-integrity", "module": "SO", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.shipshipment(integer, timestamp with time zone)"}, "excerpt": "_gldate := _timestamp::DATE;", "description": "Casting a `timestamptz` to `::DATE` uses the session's current `TIMEZONE` setting. If a shipment is sent from a warehouse at 23:00 local but the DB session connection is set to UTC (or vice-versa), the GL post date can land on the wrong day — potentially the wrong fiscal period.", "reproduction": "Set TIMEZONE TO 'UTC'; SELECT shipshipment(<sh_id>, '2026-04-14 23:30:00-04'); -- gldate becomes 2026-04-15. Same call with TIMEZONE='America/New_York' gives 2026-04-14.", "impact": "Month-end ship on last day can post to next month's GL if the DB session is in a timezone east of the warehouse. A material month-end cutoff bug.", "suggested_fix": "Explicitly convert in a specific timezone: `_gldate := (_timestamp AT TIME ZONE 'America/New_York')::DATE;` — or better, pass gldate as its own parameter so the caller (e.g., Qt client) can control cutoff semantics.", "references": {}, "discovered_via": "module_review", "tags": ["timezone", "gl-date", "cutoff", "timestamptz"]}, {"id": "BUG-0054", "title": "issueToShipping: TOCTOU race on qtyonhand check — can drive inventory negative", "category": "concurrency", "module": "Inventory", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": false, "location": {"type": "db_function", "db_object": "public.issuetoshipping(text, integer, numeric, integer, timestamp with time zone, integer, boolean, boolean)"}, "excerpt": "SELECT itemsite_qtyonhand, itemsite_costmethod INTO _qoh, _method\n  FROM itemsite\n WHERE itemsite_id = _itemsiteid;\nIF _method = 'A' AND _qoh - ROUND(pQty * _invuomratio, 6) < 0.0 THEN\n  RAISE EXCEPTION 'Cannot issue ... average-cost qtyonhand would go negative';\nEND IF;", "description": "The qtyonhand check is performed via a plain SELECT (no `FOR UPDATE` / no serializable isolation). Two concurrent calls issuing the last unit of the same itemsite both see the pre-issue qoh and both pass the guard. Both issues proceed, driving qoh negative. The exception was supposed to prevent exactly this case for average-cost items (where negative on-hand inverts costing math).", "reproduction": "Start two sessions. Both: SELECT * FROM itemsite WHERE itemsite_id=X; (qoh=1, costmethod='A'). Tx1: SELECT issuetoshipping(...); — not yet committed. Tx2 concurrently: SELECT issuetoshipping(...); — sees qoh=1, passes guard, issues. Tx1 then commits, Tx2 commits. qoh = -1.", "impact": "Average-cost accounting goes haywire on negative on-hand: next receipt averages against a negative base, producing absurd unit costs. Hard to discover until month-end close reveals anomalous COGS.", "suggested_fix": "Lock the itemsite row: `SELECT ... FROM itemsite WHERE itemsite_id=_itemsiteid FOR UPDATE;` before the guard. Alternatively, require SERIALIZABLE isolation on shipping-path calls and retry on serialization failure.", "references": {}, "discovered_via": "module_review", "tags": ["race-condition", "toctou", "inventory", "avg-cost", "fk-missing-lock"]}, {"id": "BUG-0055", "title": "45 posted invoices have NULL gldistdate — invariant violation", "category": "data-integrity", "module": "AR", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_table", "db_object": "public.invchead"}, "excerpt": "SELECT COUNT(*) FROM invchead WHERE invchead_posted=TRUE AND invchead_gldistdate IS NULL;\n-- 45 rows", "description": "postInvoice (the only supported posting path) performs `UPDATE invchead SET invchead_posted=TRUE, invchead_gldistdate=_glDate` in the same statement — the two are intended to rise together. Finding 45 rows with posted=TRUE and gldistdate=NULL indicates either (a) posting was partially successful but a trigger rolled back the gldistdate update, (b) an external tool set invchead_posted directly, or (c) a legacy migration did not backfill. Either way, every one of these invoices is on the books but cannot be reported in gldist-date-bucketed reports (they fall into NULL bucket).", "reproduction": "SELECT invchead_id, invchead_invcnumber, invchead_invcdate, invchead_posted, invchead_gldistdate, invchead_misc_amount FROM invchead WHERE invchead_posted=TRUE AND invchead_gldistdate IS NULL ORDER BY invchead_invcdate DESC;", "impact": "Period-end aging/GL reconciliation reports that filter `WHERE gldistdate BETWEEN a AND b` drop these invoices entirely, producing under-reporting of revenue and skewed aging. Undetected unless someone sums with NULL-inclusive predicates.", "suggested_fix": "(1) Root-cause: track each of the 45 back to its creating process via cmhead/invchead timestamps and any triggers that could reset gldistdate. (2) Remediate: run a one-time backfill setting gldistdate = invcdate (or the gltrans_date of the matching gltrans_sequence row) after manual review. (3) Prevent: add a CHECK constraint `(NOT invchead_posted) OR (invchead_gldistdate IS NOT NULL)`.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["data-integrity", "invariant-violation", "confirmed-live", "reporting-blind-spot"]}, {"id": "BUG-0056", "title": "1 closed aropen row has amount != paid — unbalanced closed A/R", "category": "financial", "module": "AR", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_table", "db_object": "public.aropen"}, "excerpt": "SELECT COUNT(*) FROM aropen WHERE aropen_open=FALSE AND aropen_amount <> aropen_paid;\n-- 1 row", "description": "An aropen row marked closed (aropen_open=FALSE) must by convention have aropen_paid = aropen_amount (otherwise there is unpaid balance but the row is not collectible). One such row exists in production. Either (a) a rounding error caused the closer to skip the final penny, (b) an aropenalloc/application applied a wrong amount, or (c) manual DB manipulation closed the row without zeroing the balance.", "reproduction": "SELECT aropen_id, aropen_docnumber, aropen_doctype, aropen_amount, aropen_paid, (aropen_amount - aropen_paid) AS diff FROM aropen WHERE aropen_open=FALSE AND aropen_amount <> aropen_paid;", "impact": "Aging reports miss this residual balance. Total A/R per aropen sum no longer equals total collected + outstanding.", "suggested_fix": "Inspect the one row's aropenalloc history and the closing transaction. Either reopen and apply the missing amount (if real unpaid balance) or write an adjusting GL entry to reconcile. Add a CHECK constraint: `(aropen_open) OR (aropen_amount = aropen_paid)`.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["financial", "invariant-violation", "confirmed-live"]}, {"id": "BUG-0057", "title": "7 gltrans rows have amount = 0 — should have been rejected by posting", "category": "data-integrity", "module": "GL", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "db_table", "db_object": "public.gltrans"}, "excerpt": "SELECT COUNT(*) FROM gltrans WHERE gltrans_amount = 0;\n-- 7 rows", "description": "GL transactions with amount=0 carry no financial information but bloat gltrans and can trip up reports that join gltrans_sequence assuming each sequence has at least one debit and one credit. Either the writer (probably a posting function not short-circuiting on zero) wrote these, or they are leftover debris from a partially-reverted post.", "reproduction": "SELECT gltrans_id, gltrans_docnumber, gltrans_doctype, gltrans_sequence, gltrans_date, gltrans_source FROM gltrans WHERE gltrans_amount = 0 ORDER BY gltrans_date DESC;", "impact": "Report/reconciliation noise. If a sequence has only zero-amount rows, reports that join on the sequence could see '0 total' and incorrectly conclude the batch was empty.", "suggested_fix": "Delete the 7 rows after verifying their paired sequences balance without them. Add a CHECK constraint gltrans_amount <> 0. Audit insertGLTransaction / insertIntoGLSeries to ensure zero-amount inserts are skipped at the source.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["data-integrity", "gl-noise", "confirmed-live"]}, {"id": "BUG-0058", "title": "682 gltrans rows have NULL gltrans_notes — audit-trail gap", "category": "data-integrity", "module": "GL", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_table", "db_object": "public.gltrans"}, "excerpt": "SELECT COUNT(*) FROM gltrans WHERE gltrans_notes IS NULL;\n-- 682 rows", "description": "gltrans_notes carries human-readable description of each GL row and is the primary audit clue when tracing what caused a posting. 682 rows carry no notes. Some posting paths (especially manual JE paths and older imports) do not supply notes. Not catastrophic but degrades traceability during audit.", "reproduction": "SELECT gltrans_source, gltrans_doctype, COUNT(*) FROM gltrans WHERE gltrans_notes IS NULL GROUP BY 1, 2 ORDER BY 3 DESC;", "impact": "During year-end audit, unexplained entries without notes require cross-lookup to the source doc. No data loss.", "suggested_fix": "Survey which sources contribute null-notes rows and patch those writers to produce meaningful descriptions.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["audit-trail", "data-integrity", "confirmed-live"]}, {"id": "BUG-0059", "title": "CreditCardProcessor::authorize / charge / chargePreauthorized / credit / voidPrevious: 5 documented memory leaks of ParameterList", "category": "functional", "module": "Payment", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/creditcardprocessor.cpp", "line_start": 2560, "line_end": 3131}, "excerpt": "// TODO: memory leak of poutput!\nParameterList CreditCardProcessor::authorize(const ParameterList &pinput)\n{\n  ParameterList *poutput = new ParameterList;\n  ...\n  return *poutput;  // pointer-allocated list is copied out, original never freed\n}", "description": "Five script-callable overloads (authorize, charge, chargePreauthorized, credit, voidPrevious) all allocate `ParameterList *poutput = new ParameterList;` and return `*poutput`, documented with the comment `// TODO: memory leak of poutput!` at lines 2560, 2716, 2872, 2963, 3131. Every scripted CC transaction leaks a ParameterList (plus each entry within it — QVariants and embedded strings). On a high-volume payment-processing server, this accumulates rapidly.", "reproduction": "Call any of the 5 overloads in a loop from a QtScript: `for (var i=0; i<1000; i++) { ccproc.authorize(params); }` and observe the Qt client RSS grow.", "impact": "Gradual memory bloat in long-running Qt clients that process many transactions via script. Can necessitate restarts. Sensitive card-payment data lingers in leaked allocations.", "suggested_fix": "Return by value without new: `ParameterList poutput; ...; return poutput;`. All call sites already consume a ParameterList by value, so the change is transparent to callers.", "references": {}, "discovered_via": "qt_grep", "tags": ["memory-leak", "payment-processing", "todo-tracked", "systemic"]}, {"id": "BUG-0060", "title": "CreditCardProcessor stores full CC request text in metrics table when isTest() is true", "category": "security", "module": "Payment", "priority": "P2", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/creditcardprocessor.cpp", "line_start": 1822, "line_end": 1824}, "excerpt": "// TODO: find a better place to save this\nif (isTest())\n  _metrics->set(\"CCOrder\", prequest);", "description": "sendViaHTTP saves the full CC request XML/payload in the shared `metric` table under the key CCOrder whenever the processor is in test mode. The metric table is application-global and not access-restricted at the row level. If anyone accidentally toggles test mode in production (CCTest metric), the next CC transaction's request — which can include PAN (masked or not, depending on processor) — lands in the metric table. PCI-DSS concern.", "reproduction": "With isTest()=true, submit a test CC transaction; then: SELECT metric_value FROM metric WHERE metric_name='CCOrder'; — full request text is stored.", "impact": "If test mode is accidentally enabled in production, or if the test DB is snapshotted and restored for debugging, the CC test transaction payloads (which in some processors mirror live format) become discoverable by any DB user with read on `metric`.", "suggested_fix": "Write test-mode debug payloads to a local file (or stderr) protected by OS permissions, not to a shared DB row. At minimum, redact PAN/CVV before saving and expire the row after N minutes.", "references": {}, "discovered_via": "qt_grep", "tags": ["pci", "security", "data-leakage", "test-mode"]}, {"id": "BUG-0061", "title": "applock::acquireLock: unchecked exec() merges DB failure with 'lock held by other'", "category": "concurrency", "module": "System", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "common/applock.cpp", "line_start": 158, "line_end": 200}, "excerpt": "XSqlQuery q;\nq.prepare(\"SELECT tryLock(CAST(oid AS INTEGER), :id) AS locked FROM pg_class WHERE relname=:table;\");\nq.bindValue(\":id\", _p->_id);\nq.bindValue(\":table\", _p->_table);\nq.exec();  // unchecked\nif (q.first())\n{\n  result = q.value(\"locked\").toBool();\n  ...\n}", "description": "If exec() fails (network drop, role missing tryLock privilege, relation not found), q.first() returns false and execution falls through to `updateLockStatus()`. The user sees either 'locked by other user' or silent failure — never the real reason. Root-cause debugging of intermittent lock failures is impossible without server-side logs.", "reproduction": "Revoke EXECUTE on public.tryLock from the session user, open a form that locks a record. The UI reports 'record locked by another user' instead of a DB permission error.", "impact": "Lock-acquisition failures masquerade as 'another user has this record'. Users wait; admins can't diagnose; false reports of 'ghost locks'.", "suggested_fix": "Check exec() return value: `if (!q.exec()) { ErrorReporter::error(...); return false; }`. Distinguish 'exec failed' from 'not locked' in downstream logic.", "references": {"related_bugs": ["BUG-0062"]}, "discovered_via": "qt_grep", "tags": ["silent-failure", "exec-unchecked", "locking"]}, {"id": "BUG-0062", "title": "Systemic: 473 bare XSqlQuery .exec(); call sites in guiclient — errors not checked", "category": "functional", "module": "System", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/", "line_start": 0, "line_end": 0}, "excerpt": "Grep summary: `^\\s*\\w+\\.exec\\(\\);\\s*$` → 473 matches in 140 files. Top offenders: salesOrderItem.cpp (31), user.cpp (26), creditcardprocessor.cpp (22), crmaccount.cpp (15), voucher.cpp (15), copyItem.cpp (15), miscVoucher.cpp (11), employee.cpp (9), shipOrder.cpp (9), salesOrder.cpp (9), vendor.cpp (9), shipTo.cpp (8), customer.cpp (7), postProduction.cpp (7), itemSite.cpp (5), warehouse.cpp (5), salesRep.cpp (6), todoItem.cpp (6), cashReceipt.cpp (3).", "description": "473 places call XSqlQuery::exec() and ignore its boolean return, and 'q.first()'/'q.next()' is used as a proxy for success. When the query truly fails (syntax error, permission denied, disconnect), q.first() returns false and the code branches to the 'no rows' path — silently. Full error-handling retrofit is large but high-value: each bare exec is a potential masked failure at runtime.", "reproduction": "Static grep: `grep -rcE '^\\s*\\w+\\.exec\\(\\);\\s*$' guiclient/` reproduces the count and per-file breakdown.", "impact": "Users see wrong empty results, silent no-op saves, missing toast messages, and 'it just didn't do anything' reports. Support effort burns on intermittent issues that would be root-caused in seconds with proper error reporting.", "suggested_fix": "Add a lint rule or semgrep check: every XSqlQuery::exec() must be either (a) guarded by `if (!q.exec()) { ErrorReporter::error(...); return; }` or (b) immediately followed by an ErrorReporter::error(... q ...) block. Prioritize the top-offender files. Many already use ErrorReporter but not consistently.", "references": {"related_bugs": ["BUG-0061"]}, "discovered_via": "qt_grep", "tags": ["exec-unchecked", "systemic", "error-handling", "high-count"]}, {"id": "BUG-0063", "title": "lotSerialUtils::setParams builds SQL fragment with unquoted QString::arg of charass_value", "category": "security", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/lotSerialUtils.cpp", "line_start": 114, "line_end": 123}, "excerpt": "q.exec(QString(\"SELECT charass_value FROM charass WHERE charass_target_type='LS' AND charass_target_id=%1 AND charass_char_id=%2;\").arg(ls_id).arg(_charIds.at(i)));\n...\ncharIdIndexClause.append(QString(\"charass_alias%1.charass_value='%2'\").arg(i+1).arg(charass_value));", "description": "charass_value is fetched from DB then embedded into a SQL clause via QString::arg with NO escaping. If a characteristic value contains a single quote (e.g., lot serial '3 O'Clock Batch'), the generated SQL clause becomes `charass_alias1.charass_value='3 O'Clock Batch'` — syntax error at best, injectable at worst (a crafted characteristic value ending with `';DROP TABLE ls;--` would be executed when this clause is substituted into a MetaSQL query).", "reproduction": "INSERT INTO charass (..., charass_value) VALUES (..., E'bad\\\\';--'); then call any feature that builds a MetaSQL search using setParams() on that lot/serial. Observe SQL error or injection.", "impact": "Lot/serial search/filter by characteristic is fragile or exploitable when characteristic values contain quote-adjacent input.", "suggested_fix": "Use parameterized query: build the clause with placeholders and bindValue. Or at minimum escape via QString's replace(\"'\",\"''\"). Migrating to bindValue is safer.", "references": {}, "discovered_via": "qt_grep", "tags": ["sql-injection", "string-concat", "charass"]}, {"id": "BUG-0064", "title": "lotSerialUtils constructor iterates result of failed query", "category": "functional", "module": "Inventory", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/lotSerialUtils.cpp", "line_start": 24, "line_end": 39}, "excerpt": "bool success = q.exec(\"SELECT char_name, char_type, char_id FROM char JOIN charuse ON (char_id=charuse_char_id AND charuse_target_type = 'LS') ORDER BY char_name ASC\");\nwhile(q.next())\n{\n    _charNames.append(q.value(\"char_name\").toString());\n    ...\n}\nif (!success)\n{\n    qDebug() << \"LotSerialChars: Error\" << q.lastError().text();\n}", "description": "`success` is captured from exec(), but the while(q.next()) loop runs regardless — then the failure is only logged via qDebug. If the query fails, the utility silently reports zero characteristics, which changes downstream behavior (no LS characteristic fields rendered) but user sees no error dialog.", "reproduction": "Revoke SELECT on `char` from user; open a lot/serial-aware form; observe no characteristics rendered and no error message.", "impact": "Users see missing characteristic fields and assume the characteristics 'weren't configured'. Support cost in trace-and-verify loop.", "suggested_fix": "Test success before iterating; surface via ErrorReporter::error if it fails.", "references": {}, "discovered_via": "qt_grep", "tags": ["silent-failure", "exec-unchecked"]}, {"id": "BUG-0065", "title": "lotSerialUtils::getNextLotId returns ls_ls_id_seq.last_value — race and semantics wrong", "category": "data-integrity", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/lotSerialUtils.cpp", "line_start": 126, "line_end": 135}, "excerpt": "int LotSerialUtils::getNextLotId()\n{\n    XSqlQuery q;\n    q.exec(\"SELECT last_value from ls_ls_id_seq\");\n    if (q.first()) { return q.value(\"last_value\").toInt(); }\n    return -1;\n}", "description": "Name says 'NextLotId' but the query returns the sequence's current last allocated value. Under concurrent inserts, last_value is non-deterministic (another session may have bumped it), and it is NOT the next value to be allocated — nextval() is. If any caller uses this to predict/match an upcoming ls_id, it will frequently be wrong under any concurrency.", "reproduction": "Session A: INSERT INTO ls (...) — bumps sequence. Session B: SELECT getNextLotId() — returns A's last value, not B's imminent one. B's next insert will be (that value + 1).", "impact": "Any feature that tries to 'pre-reserve' a lot id or display 'the next lot id will be N' is off-by-one or race-prone.", "suggested_fix": "If the caller needs to predict: switch to `SELECT nextval('ls_ls_id_seq')` and USE that value in the insert via a bound param. If the caller needs 'the id I just inserted', use INSERT ... RETURNING ls_id.", "references": {}, "discovered_via": "qt_grep", "tags": ["sequence-misuse", "race", "semantic-bug"]}, {"id": "BUG-0066", "title": "Systemic: 102 sites use `double` for currency amounts — IEEE-754 rounding drift", "category": "financial", "module": "System", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/", "line_start": 0, "line_end": 0}, "excerpt": "Grep summary: `double\\s+(amount|price|qty|cost|freight|tax|total|balance)` → 102 matches in 36 files. Densest in: taxCache.cpp (14), creditcardprocessor.cpp (11), authorizedotnetprocessor.cpp (9), paymentechprocessor.cpp (7), cybersourceprocessor.cpp (5), salesOrder.cpp (5), salesOrderSimple.cpp (4), reconcileBankaccount.cpp (4).", "description": "Currency fields declared as `double` accumulate IEEE-754 rounding error as they are summed, multiplied by tax rates, and written back to DB NUMERIC columns. For simple cases (single transaction) the round-trip via QString::number/toDouble tends to be acceptable, but in tax-cache multiline calculations (14 doubles in taxCache.cpp) and payment processors the drift shows up as pennies off.", "reproduction": "In taxCache calculations, sum 100 line items each with tax rate 0.0825 on amount 0.01 → total doubles to 0.0825, but `0.01 * 100 * 0.0825` in double is 0.08250000000000001. Single transactions are fine; compounded totals are not.", "impact": "Occasional penny-off totals between the Qt client and DB-side NUMERIC calculations. Flagged by auditors.", "suggested_fix": "Migrate toward storing currency as QString (matching the DB's NUMERIC text representation) or fixed-point integer cents, as already done elsewhere in xTuple (e.g., XTreeWidgetItem's 'money' role). Eliminate `double` from the taxCache cache key math.", "references": {}, "discovered_via": "qt_grep", "tags": ["ieee-754", "currency", "precision", "systemic"]}, {"id": "BUG-0067", "title": "CreditCardProcessor hardcoded curl path — fragile on non-standard installs", "category": "tech-debt", "module": "Payment", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/creditcardprocessor.cpp", "line_start": 1921, "line_end": 1933}, "excerpt": "// TODO: why have a hard-coded path to curl?\n#ifdef Q_OS_WIN\ncurl_path = qApp->applicationDirPath() + \"/curl.exe\";\n#elif defined Q_OS_MAC\ncurl_path = \"/usr/bin/curl\";\n#elif defined Q_OS_LINUX\ncurl_path = \"/usr/bin/curl\";\n#endif\nQFileInfo checkCurl(curl_path);\nif(!checkCurl.isExecutable()) { ... }", "description": "On macOS, modern system default curl is at /usr/bin/curl (still present). But on many Linux distros, /usr/bin/curl may be absent (alpine: /usr/bin/curl or /bin/curl; some minimal images none). Hardcoded path breaks CC processing in those environments when CCUseCurl is enabled.", "reproduction": "Run Qt client on a Linux image without /usr/bin/curl (e.g., minimal container). Enable CCUseCurl. Submit transaction. Fails immediately with exit -18.", "impact": "Deployment-specific breakage in docker/thin-client environments.", "suggested_fix": "Use `QStandardPaths::findExecutable(\"curl\")` or respect `$CURL` env var; fall back to hardcoded path.", "references": {}, "discovered_via": "qt_grep", "tags": ["hardcoded-path", "curl", "portability", "todo-tracked"]}, {"id": "BUG-0068", "title": "CreditCardProcessor blocks GUI thread on curl subprocess (waitForFinished)", "category": "ux", "module": "Payment", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/creditcardprocessor.cpp", "line_start": 1983, "line_end": 2010}, "excerpt": "QApplication::setOverrideCursor( QCursor(Qt::WaitCursor) );\n/* TODO: consider changing to the original implementation:\n        start the proc in a separate thread\n        capture the output as it's generated\n        while (proc->isRunning()) qApp->processEvents();\n */\nproc.start(curl_path, curl_args);\nif ( !proc.waitForStarted() ) { ... return -18; }\nif (! proc.waitForFinished()) { ... return -18; }", "description": "Synchronous curl call from the GUI thread. waitForFinished() blocks event loop. On slow CC-gateway responses, the Qt client freezes for the duration (some acquirers take 5-30 seconds). The TODO acknowledges this and sketches a better fix.", "reproduction": "Test with a processor sandbox that adds artificial delay; observe Qt client frozen.", "impact": "Poor UX during CC capture; user can't cancel. Not a correctness bug.", "suggested_fix": "Move curl into a QThread or use QNetworkAccessManager with signal-slot completion; or add a timeout to waitForFinished and a progress dialog with cancel.", "references": {}, "discovered_via": "qt_grep", "tags": ["gui-thread-blocking", "ux", "todo-tracked"]}, {"id": "BUG-0069", "title": "CreditCardProcessor::checkCreditCard: pcvv==-2 sentinel is flagged as suspicious in code", "category": "tech-debt", "module": "Payment", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/creditcardprocessor.cpp", "line_start": 1690, "line_end": 1696}, "excerpt": "else if (pcvv.toInt() == -2)  // TODO: this doesn't feel right\n  ; // the caller knows that this transaction doesn't have cvv available\nelse if (pcvv.length() > 4)\n{\n  _errorMsg = errorMsg(-99);\n  return -99;\n}", "description": "pcvv is a QString and we call .toInt() — returns 0 for non-numeric. The -2 'no cvv available' sentinel is only triggered by the literal string '-2', which is a strange overload of the CVV field. Authors flag it as 'doesn't feel right'. A pcvv of empty string becomes 0, not -2. A caller who wants 'no cvv' must pass '-2' verbatim.", "reproduction": "Static review.", "impact": "Brittle; any refactor that treats pcvv as strictly a CVV string breaks the 'no cvv' flow silently.", "suggested_fix": "Add a dedicated `bool pHasCvv` parameter instead of overloading the value with a sentinel.", "references": {}, "discovered_via": "qt_grep", "tags": ["sentinel-overload", "todo-tracked"]}, {"id": "BUG-0070", "title": "FraudCheckResult severity is unwired — TODO: FraudChecks", "category": "functional", "module": "Payment", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/creditcardprocessor.cpp", "line_start": 269, "line_end": 269}, "excerpt": "CreditCardProcessor::FraudCheckResult::FraudCheckResult(QChar pcode, int /*TODO: FraudChecks*/ psev, QString ptext)", "description": "Fraud-check severity parameter is accepted but unused (parameter name commented out as a TODO). AVS / CVV response codes always produce results without a meaningful severity — callers that branch on severity behave identically regardless of actual code.", "reproduction": "Static review.", "impact": "Fraud-prevention UI shows AVS/CVV mismatches as warnings identical in severity to benign matches.", "suggested_fix": "Wire psev into fraud-check result and use it to drive the UI warning color/level.", "references": {}, "discovered_via": "qt_grep", "tags": ["unfinished-feature", "fraud", "todo-tracked"]}, {"id": "BUG-0071", "title": "workOrder::sUpdateStartDate compares QSpinBox pointer to 0 instead of value", "category": "functional", "module": "Mfg", "priority": "P1", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/workOrder.cpp", "line_start": 705, "line_end": 714}, "excerpt": "void workOrder::sUpdateStartDate()\n{\n  if ((_warehouse->id() <= 0) || !_dueDate->isValid())\n    return;\n\n  if (_leadTime == 0)         // <-- comparing widget pointer to null\n  {\n    _startDate->setDate(_dueDate->date());\n    return;\n  }\n\n  XSqlQuery startDate;\n  ...\n  startDate.bindValue(\":leadTime\", _leadTime->value());", "description": "`_leadTime` is a QSpinBox pointer (setupUi populates it; used elsewhere as `_leadTime->value()`, `_leadTime->hide()`, `_leadTime->setValue(0)`). Comparing the POINTER to 0 is always false once the UI is constructed, so the zero-leadtime short-circuit (which sets start date = due date) never fires. For items with leadtime=0, the code then sends leadtime=0 to calculateNextWorkingDate(), which may still give the expected answer — but the intended optimization and the intended default behavior are both dead code. If calculateNextWorkingDate ever errors on leadtime=0 (e.g., in a branch that rejects non-positive lead), start date becomes blank.", "reproduction": "Open a WO form on an item with itemsite_leadtime=0. Change the due date. Observe _startDate behavior; verify it goes through calculateNextWorkingDate rather than the fast path.", "impact": "Wrong start date on zero-leadtime items if the SQL function's behavior differs from the simple short-circuit (the code clearly intended the two paths to give the same answer and the short-circuit was put there for performance / UX reasons).", "suggested_fix": "Change `if (_leadTime == 0)` to `if (_leadTime->value() == 0)`.", "references": {}, "discovered_via": "module_review", "tags": ["pointer-vs-value", "dead-branch", "widget"]}, {"id": "BUG-0072", "title": "salesOrder: misc charge value saved even when no misc charge account set", "category": "data-integrity", "module": "SO", "priority": "P1", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/salesOrder.cpp", "line_start": 1259, "line_end": 1266}, "excerpt": "saveSales.bindValue(\":misc\", _miscCharge->localValue());\nif (_miscChargeAccount->id() != -1)\n  saveSales.bindValue(\":misc_accnt_id\", _miscChargeAccount->id());", "description": "The :misc amount is bound unconditionally, but :misc_accnt_id is only bound when an account is selected. If the user enters a misc amount but forgets to pick an account, cohead_misc is saved with cohead_misc_accnt_id=NULL. When the SO is later invoiced, postInvoice has no account to post the misc line against — the amount appears on the invoice but GL booking silently fails or lands on a fallback account. Upstream fix 555c75730 applied this guard in creditMemo; salesOrder escaped the fix.", "reproduction": "Enter a SO, add a misc charge amount of 10.00, clear the misc charge account, save. Observe cohead.cohead_misc=10.00 AND cohead.cohead_misc_accnt_id IS NULL. Invoice and post.", "impact": "Misc charge on SO may be lost at GL posting time, producing a revenue account discrepancy.", "suggested_fix": "Apply creditMemo's pattern: wrap both bindValue(\":misc\", ...) and bindValue(\":misc_descrip\", ...) in `if (_miscChargeAccount->id() > 0)`. Or reject save with a validation error if misc > 0 and no account.", "references": {"git_commits": ["555c75730"]}, "discovered_via": "gitlog", "tags": ["misc-charge", "sibling-fix-missing", "validation"]}, {"id": "BUG-0073", "title": "returnAuthorization: misc charge value bound without misc-charge account guard", "category": "data-integrity", "module": "AR", "priority": "P1", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/returnAuthorization.cpp", "line_start": 518, "line_end": 521}, "excerpt": "returnSave.bindValue(\":rahead_misc\", _miscCharge->localValue());\nif (_miscChargeAccount->id() != -1)\n  returnSave.bindValue(\":rahead_misc_accnt_id\", _miscChargeAccount->id());", "description": "Sibling of BUG-0072. RA save binds :rahead_misc unconditionally, :rahead_misc_accnt_id only if set. On conversion to credit memo, rahead_misc carries over but without an account for GL booking.", "reproduction": "Create an RA, enter a misc charge amount with no account, save. Convert to credit memo.", "impact": "Same as BUG-0072 — misc charge lands on credit memo with no GL destination.", "suggested_fix": "Wrap bindValue(\":rahead_misc\", ...) in `if (_miscChargeAccount->id() > 0)`.", "references": {"related_bugs": ["BUG-0072"], "git_commits": ["555c75730"]}, "discovered_via": "gitlog", "tags": ["misc-charge", "sibling-fix-missing", "validation"]}, {"id": "BUG-0074", "title": "arOpenItem::setCustId: NULL cust_commprcnt silently becomes 0.0 commission", "category": "financial", "module": "AR", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/arOpenItem.cpp", "line_start": 391, "line_end": 413}, "excerpt": "c.prepare(\"SELECT cust_terms_id, cust_salesrep_id, cust_curr_id, cust_taxzone_id, cust_commprcnt FROM custinfo WHERE (cust_id=:cust_id);\");\nc.bindValue(\":cust_id\", pCustid);\nc.exec();\nif (c.first()) { ...\n  _commprcnt = c.value(\"cust_commprcnt\").toDouble();\n}", "description": "custinfo.cust_commprcnt is nullable. QVariant::toDouble() on a null returns 0.0. If a customer has no commission percent set (NULL), this silently yields 0% commission, which later multiplies against invoice totals. Admin may not know the difference between 'customer has 0% commission' (explicitly set) and 'commission is not configured' (NULL).", "reproduction": "UPDATE custinfo SET cust_commprcnt=NULL WHERE cust_id=X. Open arOpenItem for this customer. Observe _commprcnt=0 silently; commission calc on any created invoice line uses 0.", "impact": "Sales-rep commissions on invoices for customers with NULL cust_commprcnt are silently 0. Reps don't notice until commission statements are reviewed. Material financial impact for companies relying on commissions.", "suggested_fix": "Either (a) treat NULL as 'use fleet default' via COALESCE with metric or (b) warn the user via QMessageBox::warning when commission percent is NULL. Also check c.value(\"cust_commprcnt\").isNull() explicitly and log.", "references": {}, "discovered_via": "module_review", "tags": ["null-to-zero", "commission", "financial"]}, {"id": "BUG-0075", "title": "shipOrder::sShip: fragile disconnect/reconnect dance with 9 exit points", "category": "concurrency", "module": "SO", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/shipOrder.cpp", "line_start": 155, "line_end": 447}, "excerpt": "void shipOrder::sShip()\n{\n  disconnect(_ship, SIGNAL(clicked()), this, SLOT(sShip()));\n  ... // ~290 lines with many early returns, each must manually re-connect\n  connect(_ship, SIGNAL(clicked()), this, SLOT(sShip()));\n  ...\n}", "description": "sShip() is ~290 lines with 8+ early-return branches, each of which must manually reconnect the button's clicked() signal. If a future edit adds a new return without a matching connect(), the ship button becomes non-responsive until the dialog is reopened. The comment on line 232 ('beware of endless loop if you change createItemSite err check') is a warning sign.", "reproduction": "Static review. Count disconnect() (1) vs connect() calls inside the function — each return path needs its own.", "impact": "Future edits risk silent UI breakage; maintenance hazard.", "suggested_fix": "Replace the manual disconnect/reconnect pattern with a QSignalBlocker on _ship for the duration of sShip() (RAII), or a helper `struct ReconnectOnScope { ... };` that unconditionally reconnects when the function exits via any path.", "references": {}, "discovered_via": "module_review", "tags": ["signal-slot", "maintenance-hazard", "exception-safety"]}, {"id": "BUG-0076", "title": "shipOrder::sShip: UPDATE shiphead followed by BEGIN; — row update is auto-committed before transaction", "category": "data-integrity", "module": "SO", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/shipOrder.cpp", "line_start": 161, "line_end": 183}, "excerpt": "// line 161-172: UPDATE shiphead SET shiphead_shipvia=..., shiphead_freight=...\nshipq.exec();\nif (ErrorReporter::error(...)) { ...return; }\n\nXSqlQuery rollback;\nrollback.prepare(\"ROLLBACK;\");\n// failed insertGLTransaction RETURNs -5 rather than RAISE EXCEPTION\nshipq.exec(\"BEGIN;\");   // <-- transaction begins AFTER the UPDATE\n\nshipq.prepare(\"SELECT shipShipment(:shiphead_id, :ts) AS result;\");", "description": "The UPDATE to shiphead (freight, ship-via, tracking) at lines 161-172 runs OUTSIDE the transaction (BEGIN is at line 183). If shipShipment() later fails and ROLLBACK runs, the shiphead row keeps the new freight/tracking but the shipment itself isn't shipped. Next attempt finds stale tracking information.", "reproduction": "Use a shiphead that will fail at shipShipment (e.g., an itemsite missing a cost category that triggers null gltrans_accnt_id, per the comment at line 249). Edit freight/tracking, click Ship. Observe ROLLBACK rolls back shipShipment but leaves the freight/tracking update.", "impact": "Stale freight/tracking data on shiphead after a failed ship attempt. Subsequent ship attempts ship with stale freight or tracking number.", "suggested_fix": "Move `BEGIN;` above the UPDATE (line 161). All DB mutations from sShip() should be inside the same transaction.", "references": {}, "discovered_via": "module_review", "tags": ["transaction-scope", "partial-commit", "data-integrity"]}, {"id": "BUG-0077", "title": "shipOrder::sShip: no numRowsAffected() check on UPDATE shiphead — silent no-op if id is invalid", "category": "data-integrity", "module": "SO", "priority": "P3", "severity": "low", "confidence": "suspected", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/shipOrder.cpp", "line_start": 161, "line_end": 178}, "excerpt": "shipq.prepare(\"UPDATE shiphead SET ... WHERE (shiphead_id=:shiphead_id);\");\nshipq.bindValue(\":shiphead_id\", _shipment->id());\nshipq.exec();\nif (ErrorReporter::error(...)) { connect(...); return; }\n// no check for numRowsAffected == 0", "description": "If _shipment->id() resolves to -1 or a non-existent id, UPDATE affects 0 rows without error. Code then BEGINs and calls shipShipment(-1) which in turn RAISES EXCEPTION — but the user sees 'Error Retrieving Shipping Information' (masked error text from line 173's ErrorReporter title).", "reproduction": "Force _shipment->id() to -1 via scripting and call sShip(). Observe no diagnostic about the underlying misconfiguration.", "impact": "Confusing error messages during edge cases; no direct financial impact.", "suggested_fix": "After UPDATE, check `shipq.numRowsAffected() != 1` and raise a clear validation error.", "references": {}, "discovered_via": "module_review", "tags": ["validation", "numrowsaffected"]}, {"id": "BUG-0078", "title": "distributeInventory: UPDATE check uses first() as a success proxy — fails silently when 0 rows", "category": "data-integrity", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/distributeInventory.cpp", "line_start": 410, "line_end": 425}, "excerpt": "// (see distributeInventory.cpp around 410-425) — UPDATE followed by first()/numRowsAffected semantic mixup", "description": "distributeInventory has an UPDATE followed by query.first() then numRowsAffected()!=1 check. For an UPDATE statement, first() returning false is normal (no row set), so the control flow doesn't reliably distinguish success from 'UPDATE affected 0 rows'. Needs concrete verification with a crafted scenario but pattern is suspicious.", "reproduction": "Script a distribution with an itemloc that doesn't exist in itemlocdist. Trigger the UPDATE path. Observe whether silent success is reported.", "impact": "Partial or zero-row distribution reported as success — lot/serial allocations go missing.", "suggested_fix": "Either (a) use RETURNING on the UPDATE and check that a row came back, or (b) explicitly check numRowsAffected() immediately after exec() — do not rely on first() as a success proxy for DML.", "references": {}, "discovered_via": "module_review", "tags": ["update-validation", "first-as-success"]}, {"id": "BUG-0079", "title": "issueToShipping::sIssue: q.prepare/exec reused on same XSqlQuery without re-checking success", "category": "data-integrity", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/issueToShipping.cpp", "line_start": 470, "line_end": 560}, "excerpt": "issueDetail.exec();\nif (issueDetail.first()) { ...\n  issueDetail.prepare(\"SELECT ... different query ...\");\n  issueDetail.exec();\n  // no check on this second exec's success\n  ... access values as if guaranteed ...\n}", "description": "The same XSqlQuery object is re-prepared and re-executed inside a branch that was guarded by an earlier first(). The second exec()'s success is never re-verified; subsequent .value() calls silently read 0/empty on failure.", "reproduction": "Inject a failing second query (e.g., by revoking SELECT on an underlying table for the second query only). Observe issueToShipping silently skipping the correct handling.", "impact": "Under partial permission misconfiguration, ship-floor issue function silently skips post-issue checks.", "suggested_fix": "Check each exec()'s return boolean; do not reuse the same XSqlQuery across unrelated queries without re-validating.", "references": {"related_bugs": ["BUG-0062"]}, "discovered_via": "module_review", "tags": ["exec-unchecked", "query-reuse"]}, {"id": "BUG-0080", "title": "issueWoMaterialBatch: WHERE filter excludes non-lot/serial, non-loc-controlled materials (sibling of workOrder fix)", "category": "functional", "module": "Mfg", "priority": "P1", "severity": "high", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/issueWoMaterialBatch.cpp", "line_start": 107, "line_end": 107}, "excerpt": "\"   AND ((itemsite_controlmethod IN ('L', 'S')) OR (itemsite_loccntrl)) \"", "description": "This filter excludes womatl rows whose itemsite is neither lot/serial-tracked nor location-controlled. Commit 7749878544 ('Remove incorrect condition') removed exactly this line from guiclient/workOrder.cpp::sIssueMatlBatch because it wrongly excluded perfectly-issuable materials. The same bad filter lives here in issueWoMaterialBatch.cpp::sIssue() — a sibling that escaped the fix. Users running 'Issue WO Material Batch' get only the lot/serial/loc-tracked subset of materials — the rest silently stay un-issued.", "reproduction": "Pick a WO whose materials include simple control-method='R' (regular) items. Try to batch-issue materials via issueWoMaterialBatch. Those items will be skipped.", "impact": "Batch-issue workflow silently skips materials that should be issued, causing under-issuance to WIP and downstream WO backflush/completion problems.", "suggested_fix": "Delete line 107 (mirror upstream fix 7749878544). Validate the rest of the filter still excludes the correct set.", "references": {"git_commits": ["7749878544 — workOrder::sIssueMatlBatch remove incorrect condition"]}, "discovered_via": "gitlog", "tags": ["sibling-fix-missing", "wrong-filter", "underinclude"]}, {"id": "BUG-0081", "title": "workOrderMaterials: identical connect() on lines 70 and 72 — slot wired twice", "category": "tech-debt", "module": "Mfg", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/workOrderMaterials.cpp", "line_start": 68, "line_end": 74}, "excerpt": "if (_privileges->check(\"MaintainWoMaterials\"))\n{\n  connect(_womatl, SIGNAL(valid(bool)), _edit,   SLOT(setEnabled(bool)));  // line 70\n  connect(_womatl, SIGNAL(valid(bool)), _delete, SLOT(setEnabled(bool)));  // line 71\n  connect(_womatl, SIGNAL(valid(bool)), _edit,   SLOT(setEnabled(bool)));  // line 72 — duplicate of 70\n  connect(_womatl, SIGNAL(itemSelected(int)), _edit, SLOT(animateClick()));\n}", "description": "Identical signal-slot connection appears twice (lines 70 and 72). Qt doesn't dedupe — setEnabled will be invoked twice per valid(bool) emission. Functionally idempotent so no user-visible bug today, but signals of copy-paste: if the line SHOULD have been a different connection (e.g., `_view` instead of `_edit`, since the else-branch at line 78 connects _view), that feature is missing.", "reproduction": "Static review / Qt assert-at-compile time if QT_STRICT_CONNECTIONS is on.", "impact": "Minor runtime duplication; may hide a missing intended connection.", "suggested_fix": "Delete one of the duplicates. Verify whether the intent was to wire `_view->setEnabled(bool)` (mirroring the else-branch pattern).", "references": {}, "discovered_via": "module_review", "tags": ["duplicate-connect", "copy-paste"]}, {"id": "BUG-0082", "title": "apOpenItem::set: fetchAPMemoNumber exec() unchecked — silent blank doc number on failure", "category": "functional", "module": "AP", "priority": "P1", "severity": "medium", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/apOpenItem.cpp", "line_start": 107, "line_end": 112}, "excerpt": "setOpenItem.exec(\"SELECT fetchAPMemoNumber() AS number;\");\nif (setOpenItem.first())\n{\n  _docNumber->setText(setOpenItem.value(\"number\").toString());\n  _seqiss = setOpenItem.value(\"number\").toInt();\n}\n// no else branch — exec failure silently leaves _docNumber empty", "description": "When opening apOpenItem in cNew mode, fetchAPMemoNumber() is called to pre-populate the doc number. The exec() is not checked: if the function is revoked, the schema is out-of-date, or the sequence is missing, first() returns false and _docNumber stays blank. User sees a memo form with no pre-populated number, no error message. Saving without entering one triggers a NOT NULL DB error downstream, producing a confusing error far from the root cause.", "reproduction": "REVOKE EXECUTE ON public.fetchAPMemoNumber() FROM session_user; open apOpenItem in cNew mode. Observe blank _docNumber and no error dialog.", "impact": "Confusing error flow when the AP memo sequence function fails. Users report 'form isn't working' — admin must dig into server logs.", "suggested_fix": "Guard exec(): `if (!setOpenItem.exec(...) || !setOpenItem.first()) { ErrorReporter::error(...); return; }`.", "references": {}, "discovered_via": "module_review", "tags": ["exec-unchecked", "silent-failure"]}, {"id": "BUG-0083", "title": "printChecks::sPrint: UPDATE checkhead_number without numRowsAffected check", "category": "functional", "module": "AP", "priority": "P2", "severity": "medium", "confidence": "suspected", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/printChecks.cpp", "line_start": 219, "line_end": 227}, "excerpt": "printPrint.prepare(\"UPDATE checkhead SET checkhead_number=fetchNextCheckNumber(checkhead_bankaccnt_id) WHERE(checkhead_id=:checkhead_id);\");\nprintPrint.bindValue(\":checkhead_id\", checks.value(\"checkhead_id\").toInt());\nprintPrint.exec();\nif (ErrorReporter::error(...)) { return; }", "description": "If the UPDATE's WHERE does not match (e.g., checkhead was deleted concurrently), numRowsAffected() is 0 — no error raised — but code proceeds to render and print a check using a stale checkhead_number (whatever was set earlier). Net effect: a printed check whose on-paper number doesn't match the DB row (if the DB row is gone, this also orphans the printed number against no DB record).", "reproduction": "Open printChecks; in another session DELETE FROM checkhead WHERE id = X; click Print. The print proceeds but the checkhead row no longer exists.", "impact": "Possible check-number/DB mismatch in edge concurrency scenarios. Printed check may reference a non-existent checkhead row, complicating bank-reconciliation.", "suggested_fix": "After exec, check `numRowsAffected() != 1` → abort print with a message to refresh.", "references": {}, "discovered_via": "module_review", "tags": ["numrowsaffected", "race", "check-printing"]}, {"id": "BUG-0084", "title": "public.currToCurr: no NULLIF / zero-guard on _fromRate before division", "category": "data-integrity", "module": "System", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.currtocurr(integer, integer, numeric, date)"}, "excerpt": "_convertedValue := pValue * _toRate / _fromRate;", "description": "The function fetches _fromRate and _toRate from curr_rate and performs a cross-rate conversion. It does not guard against _fromRate=0, which is valid in the NUMERIC type (though nonsensical as an FX rate). If a curr_rate row ever has curr_rate=0 (bad import, admin typo), any posting that goes through currToCurr raises `division_by_zero` — aborting the whole transaction.", "reproduction": "UPDATE curr_rate SET curr_rate=0 WHERE curr_rate_id = (some active row); post an invoice that converts through that currency. Observe 'division by zero' error.", "impact": "Single bad FX-rate row can block all CR/AR/AP posts for the affected currency pair until the admin finds and deletes the row.", "suggested_fix": "Wrap with NULLIF: `_convertedValue := pValue * _toRate / NULLIF(_fromRate, 0);` and RAISE EXCEPTION with a clear message if NULL — 'Currency rate for X is zero; fix the curr_rate table.'", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["division-by-zero", "fx", "defensive-coding"]}, {"id": "BUG-0085", "title": "public.toggleBankRecCleared: no guard on pCurrrate before inverse calculation", "category": "data-integrity", "module": "GL", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.togglebankreccleared(integer, text, integer, numeric)"}, "excerpt": "ROUND(1.0 / pCurrrate, 8) ...\nROUND(pBaseAmount * ROUND(1.0 / pCurrrate, 8), 2)", "description": "If the caller passes pCurrrate=0 (e.g., computed from a zero spread in an FX lookup), the division raises `division_by_zero` and the bank-rec toggle operation aborts. No precheck of pCurrrate.", "reproduction": "SELECT togglebankreccleared(1, 'GL', -1, 0::numeric); → ERROR division by zero.", "impact": "Malformed FX input can block a bank-rec operation. Low volume but happens during manual UI interaction.", "suggested_fix": "Add `IF pCurrrate IS NULL OR pCurrrate = 0 THEN RAISE EXCEPTION 'Currency rate is zero or NULL'; END IF;` at the top of the function.", "references": {"related_bugs": ["BUG-0084"]}, "discovered_via": "db_pattern_scan", "tags": ["division-by-zero", "bank-rec"]}, {"id": "BUG-0086", "title": "api.purchaseorder: INNER JOIN vendinfo hides POs with missing vendor", "category": "data-integrity", "module": "PO", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": true, "location": {"type": "db_view", "db_object": "api.purchaseorder"}, "excerpt": "FROM pohead LEFT JOIN ... JOIN vendinfo ON (pohead.pohead_vend_id = vendinfo.vend_id) JOIN curr_symbol ON (...)", "description": "api.purchaseorder mixes LEFT JOINs for most lookup tables but switches to INNER JOIN on vendinfo and curr_symbol. If a pohead has vend_id pointing to a disabled/deleted vendor row, or a currency no longer in curr_symbol, the PO is silently dropped from the view. Same failure mode as api.salesorder (BUG-0027) and api.customer (BUG-0029).", "reproduction": "SELECT COUNT(*) FROM pohead; vs. SELECT COUNT(*) FROM api.purchaseorder; if numbers differ, one or more rows are hidden by the INNER JOIN.", "impact": "External API consumers (REST layer) see fewer POs than the internal Qt client. Integrations that expect 1:1 parity silently miss orders, potentially duplicating via re-ingestion.", "suggested_fix": "Change the vendinfo and curr_symbol joins to LEFT JOIN, select vend_number/curr_abbr with COALESCE for friendly NULL.", "references": {"related_bugs": ["BUG-0027", "BUG-0029"]}, "discovered_via": "db_pattern_scan", "tags": ["api-view", "inner-join-hides-rows", "reporting-blind-spot"]}, {"id": "BUG-0087", "title": "public.fixacl(): bare EXCEPTION WHEN OTHERS downgrades all errors to WARNING", "category": "tech-debt", "module": "System", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "db_object": "public.fixacl()"}, "excerpt": "BEGIN\n  ALTER ... OWNER TO admin;\nEXCEPTION WHEN OTHERS THEN\n  RAISE WARNING 'Could not change ownership ...';\nEND;", "description": "fixacl() wraps ALTER statements in a bare WHEN OTHERS handler that downgrades any error to a WARNING. Includes syntax errors, privilege errors, or genuine DB corruption. Caller never sees the real cause.", "reproduction": "Introduce a table with an invalid identifier; run fixacl(). The ALTER will fail but fixacl() returns normally with only a WARNING.", "impact": "Admin runs fixacl() believing the ACL fix ran to completion; in fact some ALTER statements silently failed.", "suggested_fix": "Replace `WHEN OTHERS` with `WHEN insufficient_privilege` so only privilege errors are tolerated; re-raise everything else.", "references": {}, "discovered_via": "db_pattern_scan", "tags": ["exception-when-others", "silent-failure"]}, {"id": "BUG-0088", "title": "wgs.to_int_cleanly: bare EXCEPTION WHEN OTHERS → RETURN NULL", "category": "tech-debt", "module": "wgs-custom", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "db_function", "db_object": "wgs.to_int_cleanly(text)"}, "excerpt": "BEGIN\n  RETURN txt::INTEGER;\nEXCEPTION WHEN OTHERS THEN\n  RETURN NULL;\nEND;", "description": "to_int_cleanly exists to 'safely parse' a text as int. Using WHEN OTHERS makes any exception (including low-memory, disk-full) become NULL. Callers can't distinguish 'not a valid integer' from 'DB emergency'.", "reproduction": "SELECT wgs.to_int_cleanly('abc') — returns NULL (expected). The problem is masking unrelated errors.", "impact": "Diagnostic noise hidden; minimal operational impact.", "suggested_fix": "Narrow the exception: `EXCEPTION WHEN invalid_text_representation THEN RETURN NULL;`.", "references": {"related_bugs": ["BUG-0087"]}, "discovered_via": "db_pattern_scan", "tags": ["exception-when-others", "narrow-catch"]}, {"id": "BUG-0089", "title": "reconcileBankaccount: two stacked ifs without braces — confusing but working error-guard", "category": "tech-debt", "module": "GL", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/reconcileBankaccount.cpp", "line_start": 284, "line_end": 289}, "excerpt": "if (rcp.lastError().type() != QSqlError::NoError)\nif (ErrorReporter::error(QtCriticalMsg, this, tr(\"Error Retrieving Bank Reconciliation Information\"),\n                              rcp, __FILE__, __LINE__))\n{\n  return;\n}", "description": "Stacked ifs with no explicit braces. Logic is actually correct (first guards the second; both must be true to return), but is easy to misread or silently break on the next edit ('let me add a line between these two ifs — oh wait').", "reproduction": "Static review.", "impact": "Readability/maintenance hazard only.", "suggested_fix": "Either delete the outer `if (rcp.lastError().type() != QSqlError::NoError)` (since ErrorReporter::error already checks that internally — see common/errorReporter.cpp:1362) or merge with `&&` on one line.", "references": {}, "discovered_via": "module_review", "tags": ["readability", "redundant-check"]}, {"id": "BUG-0090", "title": "dspWoSchedule: sReleaseWO / sRecallWO invoke stored proc with no error check", "category": "functional", "module": "Mfg", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspWoSchedule.cpp", "line_start": 225, "line_end": 243}, "excerpt": "void dspWoSchedule::sReleaseWO()\n{\n  XSqlQuery dspReleaseWO;\n  dspReleaseWO.prepare(\"SELECT releaseWo(:wo_id, false);\");\n  dspReleaseWO.bindValue(\":wo_id\", list()->id());\n  dspReleaseWO.exec();\n\n  omfgThis->sWorkOrdersUpdated(list()->id(), true);\n}", "description": "Both sReleaseWO and sRecallWO menu handlers call the releaseWo / recallWo stored procedures with no error check and no inspection of the return value. If the stored procedure raises an exception or returns a negative status code (per the standard xTuple storedProcErrorLookup convention), the UI silently emits workOrdersUpdated as if the release/recall succeeded. The list view then repopulates showing unchanged status, and the user has no feedback that the action failed.", "reproduction": "Setup: pick a work order whose release would violate a precondition (e.g., deny the ReleaseWorkOrders privilege via DB, or cause the stored proc to raise). Action: right-click the WO and choose Release (or Recall). Observed: no error dialog; schedule reloads but the WO status is unchanged. Expected: error dialog explaining the failure and workOrdersUpdated not emitted.", "impact": "Users believe Release/Recall happened when it did not; they may proceed with downstream workflow (issuing materials, posting production) that is still blocked. Same pattern applies to Recall.", "suggested_fix": "Wrap the exec() with ErrorReporter::error check and, when the stored proc returns an int, inspect result via storedProcErrorLookup. Don't emit workOrdersUpdated on failure.", "references": {"related_bugs": ["BUG-0091"]}, "discovered_via": "module_review", "tags": ["unchecked-exec", "silent-failure", "stored-proc-return-ignored"]}, {"id": "BUG-0091", "title": "dspWoSchedule: sDeleteWO ignores deleteWo return value (only checks exec error)", "category": "functional", "module": "Mfg", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspWoSchedule.cpp", "line_start": 306, "line_end": 316}, "excerpt": "dspDeleteWO.prepare(\"SELECT deleteWo(:wo_id, true) AS returnVal;\");\ndspDeleteWO.bindValue(\":wo_id\", list()->id());\ndspDeleteWO.exec();\n\nif (ErrorReporter::error(QtCriticalMsg, this, tr(\"Error Deleting Work Order Information\"),\n                     dspDeleteWO, __FILE__, __LINE__))\n{\n  return;\n}\nelse\n  omfgThis->sWorkOrdersUpdated(-1, true);", "description": "The code aliases deleteWo()'s result as `returnVal` but never reads it. deleteWo() follows the xTuple convention of returning a negative integer on business-logic failure (e.g., the WO has open materials, or production has been posted). ErrorReporter only catches SQL errors, not negative status codes. A negative return is therefore treated as success and sWorkOrdersUpdated(-1, true) is emitted.", "reproduction": "Setup: find a WO in 'I' (in-process) status with production posted, then directly call SELECT deleteWo(<wo_id>, true). Observed return is < 0. Action: from the dspWoSchedule UI menu, choose Delete on the same WO. Observed: delete completes without error and the list reloads; actual WO row unchanged. Expected: error dialog derived from storedProcErrorLookup('deleteWo', result).", "impact": "User believes the WO was deleted when it was not. On next view, they see the WO still there and may try again; eventually they contact support confused about why Delete does nothing. Consistency bug — other callers of deleteWo throughout the codebase DO check returnVal.", "suggested_fix": "After exec, read int result = dspDeleteWO.value('returnVal').toInt(); if result < 0 call ErrorReporter::error with storedProcErrorLookup('deleteWo', result). Model after existing callers like workOrder.cpp sDeleteWO.", "references": {}, "discovered_via": "module_review", "tags": ["stored-proc-return-ignored", "silent-failure", "consistency-bug"]}, {"id": "BUG-0092", "title": "dspRunningAvailability: sDeleteOrder ignores deletePlannedOrder return (TODO in code)", "category": "functional", "module": "Inventory", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/displays/dspRunningAvailability.cpp", "line_start": 265, "line_end": 289}, "excerpt": "dspDeleteOrder.prepare( \"SELECT deletePlannedOrder(:planord_id, false) AS result;\" );\ndspDeleteOrder.bindValue(\":planord_id\", list()->id());\ndspDeleteOrder.exec();\nif (dspDeleteOrder.first())\n{\n  /* TODO: uncomment when deletePlannedOrder returns INTEGER instead of BOOLEAN\n  int result = dspDeleteOrder.value(\"result\").toInt();\n  if (result < 0)\n  {\n    systemError(this, storedProcErrorLookup(\"deletePlannedOrder\", result), __FILE__, __LINE__);\n    return;\n  }\n  */\n}", "description": "A TODO comment flags that the return-value check is commented out pending a function signature change that never happened. deletePlannedOrder returns a boolean today, but a false return is treated exactly the same as success by the surrounding code. sFillList is called regardless, masking the failure.", "reproduction": "Setup: create or find a planned order that cannot be deleted (e.g., it is linked to an already-exploded WO). Action: from dspRunningAvailability, right-click and Delete Order. Observed: UI refreshes and order row disappears visually (if matched) or stays (if unmatched) — either way, no error surfaced. Expected: error dialog when deletePlannedOrder returns false.", "impact": "Silent failures to delete planned orders leave stale demand in MRP runs. Reported in-code via the long-abandoned TODO but never fixed.", "suggested_fix": "Either (a) change deletePlannedOrder signature to return INTEGER and uncomment the existing check, or (b) check bool result and surface an error if false. Option (a) matches the rest of the codebase.", "references": {}, "discovered_via": "module_review", "tags": ["TODO-unresolved", "stored-proc-return-ignored", "silent-failure"]}, {"id": "BUG-0093", "title": "dspRunningAvailability: sReleaseOrder leaves planord row behind for Planned W/O", "category": "data-integrity", "module": "Inventory", "priority": "P1", "severity": "high", "confidence": "likely", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/displays/dspRunningAvailability.cpp", "line_start": 229, "line_end": 263}, "excerpt": "void dspRunningAvailability::sReleaseOrder()\n{\n  // TODO\n  if (... \"Planned W/O (firmed)\" || ... \"Planned W/O\")\n  {\n    ...\n    workOrder *newdlg = new workOrder();\n    newdlg->set(params);\n    omfgThis->handleNewWindow(newdlg);\n#if 0\n    if (newdlg.exec() != XDialog::Rejected)\n    {\n      sDeleteOrder();\n      sFillList();\n    }\n#endif\n  }\n  else if (... \"Planned P/O ...\")\n  {\n    ...\n    purchaseRequest newdlg(this, \"\", true);\n    newdlg.set(params);\n\n    if (newdlg.exec() != XDialog::Rejected)\n      sFillList();\n  }\n}", "description": "The Planned-W/O branch at one point called sDeleteOrder() + sFillList() after the child workOrder dialog closed with a non-Rejected result, to remove the now-satisfied planord row. When the dialog was refactored to a non-modal new-window (handleNewWindow), that block was commented out with #if 0 and the deletion of the planord was never re-implemented. The Planned P/O branch still deletes its planord inside purchaseRequest on success. Result: releasing a planned W/O creates the WO but leaves the planord row in the DB, inflating MRP demand.", "reproduction": "Setup: identify a planord row of type W (planord_type='W') from running availability. Action: right-click Release Order, complete the workOrder dialog and save. Observed: new wo row inserted; planord row still present — SELECT * FROM planord WHERE planord_id=<id> returns 1 row. Expected: planord row removed because the demand is now represented by the wo row.", "impact": "Duplicate demand visible in MRP / running availability: the released WO appears as a new W/O entry AND the original planord still appears as 'Planned W/O', double-counting the need. Planner may recreate the same WO twice.", "suggested_fix": "Option A: signal from workOrder.cpp when the WO is saved-from-planord, and have sReleaseOrder listen to remove the planord. Option B: make workOrder.cpp itself delete the originating planord in its sSave when 'planord_id' was passed. Option B matches how purchaseRequest handles the P/O branch.", "references": {"related_bugs": ["BUG-0092"]}, "discovered_via": "module_review", "tags": ["#if-0-dead-code", "TODO-unresolved", "duplicate-demand", "refactor-incomplete"]}, {"id": "BUG-0094", "title": "dspJournals: sViewSeries uses wrong-case column names \"SLtrans_date\" / \"SLtrans_journalnumber\"", "category": "tech-debt", "module": "GL", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspJournals.cpp", "line_start": 257, "line_end": 277}, "excerpt": "dspViewSeries.prepare(\"SELECT sltrans_date, sltrans_journalnumber FROM sltrans WHERE (sltrans_id=:sltrans_id)\");\n...\nparams.append(\"startDate\", dspViewSeries.value(\"SLtrans_date\").toDate());\nparams.append(\"endDate\",   dspViewSeries.value(\"SLtrans_date\").toDate());\nparams.append(\"journalnumber\", dspViewSeries.value(\"SLtrans_journalnumber\").toString());", "description": "SELECT returns lowercase column names (PostgreSQL folds unquoted identifiers); the code later looks them up via value(\"SLtrans_date\") / value(\"SLtrans_journalnumber\"). This currently works because QSqlRecord::indexOf is case-insensitive, but it is confusing and inconsistent with the sibling file dspGLTransactions.cpp:414-416 which uses lowercase. Any change to Qt's name matching would silently break the View Journal Series action here.", "reproduction": "Spot review only — no functional failure today.", "impact": "None today. Latent bug if the Qt version changes lookup semantics.", "suggested_fix": "Lowercase the column names to match the SELECT.", "references": {}, "discovered_via": "module_review", "tags": ["inconsistent-casing", "latent-bug"]}, {"id": "BUG-0095", "title": "dspGLTransactions: sViewDocument has 9 branches each with silent exec() failure", "category": "ux", "module": "GL", "priority": "P2", "severity": "medium", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspGLTransactions.cpp", "line_start": 423, "line_end": 596}, "excerpt": "dspViewDocument.prepare(\"SELECT vohead_id, vohead_misc FROM vohead WHERE (vohead_number=:vohead_number)\");\ndspViewDocument.bindValue(\":vohead_number\", item->rawValue(\"docnumber\").toString());\ndspViewDocument.exec();\nif(!dspViewDocument.first())\n  return;\n\n// ... and 8 more identical blocks for IN, PO, SH, CM-A/P, CM-A/R, CM-S/O, SO, WO, I/M", "description": "Every one of the 9 branches in sViewDocument follows the pattern: prepare+bind+exec+return-silently-if-no-rows. None check ErrorReporter after exec. On any SQL error (permission revoked, table lock timeout, connection hiccup) or simply when the doc was deleted between displaying and right-clicking, the menu action quietly does nothing — the user clicks 'View Invoice...' and nothing happens, with no explanation.", "reproduction": "Setup: revoke SELECT on vohead for the current role. Action: click a VO row in dspGLTransactions and choose View Voucher. Observed: nothing happens. Expected: error dialog about permission or missing row.", "impact": "User confusion and lost productivity; support escalations. Same pattern exists in dspJournals::sViewDocument.", "suggested_fix": "Introduce a small helper in dspGLTransactions (or share one in common) that does exec + ErrorReporter::error + returns optional row, and replace the 9 copies. Alternatively just wrap each exec with ErrorReporter::error check and return true-success from first() only when rows exist.", "references": {"related_bugs": ["BUG-0094"]}, "discovered_via": "module_review", "tags": ["systemic", "silent-failure", "duplicated-code", "ux"]}, {"id": "BUG-0096", "title": "dspGLTransactions: massive commented-out dead SQL blocks from MetaSQL refactor", "category": "tech-debt", "module": "GL", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/displays/dspGLTransactions.cpp", "line_start": 285, "line_end": 336}, "excerpt": "MetaSQLQuery mql = mqlLoad(\"gltransactions\", \"begq\");\n//    ParameterList params;\n//    params.append(\"accnt_id\", )\n\nbegq = mql.toQuery(params);\n\n/*      begq.prepare(\"SELECT ... trialbal_beginning ...\");\n        begq.bindValue(\":accnt_id\", ...); ...\n*/\n\n//      begq.bindValue(\":accnt_id\", params.value(\"accnt_id\").toInt());\n//      begq.bindValue(\":start\", params.value(\"startDate\").toDate());", "description": "dspGLTransactions::setParams contains two large commented-out SQL prepare/bind blocks (begq and glq) that were replaced by MetaSQL loads. The dead comments obscure the control flow and mislead future readers about which parameters are needed.", "reproduction": "N/A — code review only.", "impact": "Readability / maintainability only; no runtime effect.", "suggested_fix": "Delete the commented-out blocks.", "references": {}, "discovered_via": "module_review", "tags": ["dead-code", "readability"]}, {"id": "BUG-0097", "title": "dspInventoryAvailability::set: itemsite_id lookup exec is unchecked", "category": "ux", "module": "Inventory", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspInventoryAvailability.cpp", "line_start": 123, "line_end": 137}, "excerpt": "param = pParams.value(\"itemsite_id\", &valid);\nif (valid)\n{\n  XSqlQuery qry;\n  qry.prepare(\"SELECT itemsite_item_id, itemsite_warehous_id FROM itemsite WHERE itemsite_id=:itemsite_id;\");\n  qry.bindValue(\":itemsite_id\", param.toInt());\n  qry.exec();\n  if (qry.first())\n  {\n    parameterWidget()->setDefault(tr(\"Item\"), qry.value(\"itemsite_item_id\"));\n    parameterWidget()->setDefault(tr(\"Site\"), qry.value(\"itemsite_warehous_id\"));\n  }\n}", "description": "When another window opens dspInventoryAvailability and passes itemsite_id, the receiving window does a lookup to translate that into item_id + warehous_id defaults. If the query fails (DB issue) or the itemsite_id doesn't exist, first() returns false and the defaults are silently skipped — the window opens showing all items instead of the item the caller requested.", "reproduction": "Pass a deleted itemsite_id to dspInventoryAvailability::set. Observed: window opens with no item filter applied. Expected: either error message or empty result + filter showing the invalid itemsite_id.", "impact": "Minor UX surprise: filter defaults silently dropped; user sees unfiltered list.", "suggested_fix": "Add ErrorReporter::error check on the qry and surface a tr(\"Item Site not found.\") warning if first() is false with no SQL error.", "references": {}, "discovered_via": "module_review", "tags": ["unchecked-exec", "silent-default-drop"]}, {"id": "BUG-0098", "title": "dspGLTransactions::set: period_id -> date lookup exec is unchecked", "category": "ux", "module": "GL", "priority": "P3", "severity": "low", "confidence": "likely", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspGLTransactions.cpp", "line_start": 166, "line_end": 179}, "excerpt": "param = pParams.value(\"period_id\", &valid);\nif (valid)\n{\n  dspet.prepare( \"SELECT period_start, period_end FROM period WHERE (period_id=:period_id);\" );\n  dspet.bindValue(\":period_id\", param.toInt());\n  dspet.exec();\n  if (dspet.first())\n  {\n    parameterWidget()->setDefault(tr(\"Start Date\"), dspet.value(\"period_start\").toDate());\n    parameterWidget()->setDefault(tr(\"End Date\"), dspet.value(\"period_end\").toDate());\n  }\n}", "description": "Launching dspGLTransactions from another screen with a period_id falls back to the current-date defaults if the period lookup fails or returns 0 rows — no error is raised. Same unchecked pattern in dspJournals.cpp around line 142.", "reproduction": "Pass a non-existent period_id to dspGLTransactions::set. Observed: defaults are today's date. Expected: error message about missing period, or defaults derived from the period_id.", "impact": "Users viewing GL for a specific period via menu shortcut may instead see today's date range and miss transactions.", "suggested_fix": "Check ErrorReporter::error after exec and warn if first() returns false.", "references": {"related_bugs": ["BUG-0097"]}, "discovered_via": "module_review", "tags": ["unchecked-exec", "silent-default-drop"]}, {"id": "BUG-0099", "title": "dspRunningAvailability::setParams: xtmfg.exec() raw SQL, not prepared", "category": "tech-debt", "module": "Inventory", "priority": "P3", "severity": "low", "confidence": "confirmed", "known_preexisting": false, "location": {"type": "qt_code", "path": "guiclient/displays/dspRunningAvailability.cpp", "line_start": 133, "line_end": 141}, "excerpt": "if (_metrics->value(\"Application\") == \"Standard\")\n{\n  XSqlQuery xtmfg;\n  xtmfg.exec(\"SELECT pkghead_name FROM pkghead WHERE pkghead_name='xtmfg'\");\n  if (xtmfg.first())\n    params.append(\"Manufacturing\");\n  params.append(\"showMRPplan\");\n}", "description": "Uses raw exec(string) instead of prepare+bind, and has no error check. The constant 'xtmfg' poses no injection risk, but t
