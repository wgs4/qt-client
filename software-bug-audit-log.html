 in aborted state) and observe that the user-visible error message is the BEGIN error, but the log accumulates a silently-swallowed ROLLBACK warning too.", "impact": "Same as BUG-0111 plus spurious log noise from ROLLBACK-without-transaction.", "suggested_fix": "In the BEGIN-failure branch, do not call rollback at all. In the other two branches, check rollback with ErrorReporter.", "references": {}, "discovered_via": "module_review", "tags": ["rollback", "unchecked-exec", "transaction", "crm"]}, {"id": "BUG-0113", "title": "crmaccount.cpp: 6 rollback.exec() call sites in sDelete/sSave never check result", "category": "functional", "module": "CRM", "priority": "P2", "severity": "medium", "confidence": "confirmed", "known_preexisting": true, "location": {"type": "qt_code", "path": "guiclient/crmaccount.cpp", "line_start": 327, "line_end": 533}, "excerpt": "if (deleteq.lastError().type() != QSqlError::NoError)\n{\n  rollback.exec();\n  ErrorReporter::error(...);\n  return;\n}\n// pattern at L327, L337, L369, L382, L516, L529", "description": "crmaccount.cpp is the largest CRM form and carries the rollback-unchecked pattern at six call sites inside sDelete() and sSave(). Same failure mode as BUG-0111/0112: a failed rollback leaves the tx open and the user is unaware.", "reproduction": "Trigger any of the six error branches with transient connectivity failure.", "impact": "Multiple paths to stuck idle-in-transaction session; highest blast-radius because CRM Account deletion cascades to contact/address/number records.", "suggested_fix": "One fix: factor a helper 'ROLLBACK_OR_REPORT(rollback, ctx)' that encapsulates rollback.exec() + ErrorReporter::error and use it consistently. Applies to incident/opportunity/crmaccount and will clean up ~15 call sites.", "references": {}, "discovered_via": "module_review", "tags": ["rollback", "unchecked-exec", "transaction", "crm"]}, {"id": "BUG-0114", "title": "contact.cpp: sDetachUse exec() return ignored before ErrorReporter check",
